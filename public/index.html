<style>
  :root{
    --bg:#15171c;--panel:#1d2026;--panel2:#22262e;--line:#2e333d;
    --ink:#eef0f3;--sub:#8b93a1;--amber:#f5a623;--green:#3ecf8e;--red:#e5484d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;}
  body{min-height:100vh;}
  #root{max-width:920px;margin:0 auto;min-height:100vh;}
  input,select,textarea,button{font-family:inherit;}
  input,select,textarea{font-family:'Barlow',sans-serif;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber)!important;}
  ::placeholder{color:#5c6470;}
  .seg:active,.padkey:active,.jobcard:active,.trade:active,.primary:active,.danger:active{transform:scale(.97);}
  .padkey,.seg,.primary,.danger,.ghost,.jobcard,.trade,.checkrow,.backbtn,.lockbtn{transition:all .12s ease;}
  .padkey:hover{background:var(--panel2);border-color:var(--amber);}
  .jobcard:hover{border-color:var(--amber);transform:translateY(-2px);}
  .primary:hover{filter:brightness(1.08);}
  .checkrow:hover{background:var(--panel2);}
  .ghost:hover{color:var(--amber);}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;}

  /* ---- Print ---- */
  .print-area{ display:none; }
  @media print{
    @page{ margin:14mm; }
    html,body{ background:#fff !important; color:#000 !important; }
    /* hide everything, then reveal only the print area */
    body * { visibility:hidden !important; }
    .print-area, .print-area * { visibility:visible !important; }
    .print-area{
      display:block !important; position:absolute; left:0; top:0; width:100%;
      color:#000; font-family:'Barlow',Arial,sans-serif;
    }
    .print-header{ border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:14px; }
    .print-company{ font-family:'Oswald',Arial,sans-serif; font-size:22px; font-weight:700; }
    .print-title{ font-size:15px; font-weight:600; margin-top:2px; }
    .print-dates{ font-size:13px; color:#333; margin-top:2px; }
    .print-summary{ font-size:12px; color:#333; margin-bottom:14px; }
    .print-section{ font-family:'Oswald',Arial,sans-serif; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #999; padding-bottom:3px; margin:18px 0 10px; }
    .print-block{ margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #ddd; page-break-inside:avoid; }
    .print-block-head{ font-weight:700; font-size:13px; }
    .print-meta{ font-size:12px; color:#444; margin:2px 0 4px; }
    .print-body{ font-size:13px; white-space:pre-wrap; line-height:1.4; }
    .print-addendum{ font-size:12px; color:#222; margin-top:6px; padding-left:10px; border-left:2px solid #999; white-space:pre-wrap; }
    .print-sublist{ margin-top:6px; padding-left:8px; }
    .print-sublist-head{ font-size:12px; font-weight:700; color:#333; margin-top:4px; }
    .print-sublist-item{ font-size:12px; color:#222; padding:1px 0 1px 8px; }
    .print-check{ font-size:13px; padding:3px 0; }
    .print-equip{ font-size:12px; color:#444; padding-left:14px; }
    .print-empty{ font-size:12px; color:#666; font-style:italic; }
  }
</style>
</head>
<body>

// =================== DATA LAYER ===================
const API = "/api/data";
async function loadAll() {
  const r = await fetch(API);
  if (!r.ok) throw new Error("load failed (" + r.status + ")");
  return r.json();
}
async function saveCollection(collection, data) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ collection, data }),
  });
  if (!r.ok) throw new Error("save failed (" + r.status + ")");
  return r.json();
}

// =================== HELPERS ===================
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const stamp = () => new Date().toLocaleString("en-US", { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" });
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const itemLabel = (it) => typeof it === "string" ? it : it.label;
const itemIsEquip = (it) => typeof it === "object" && it.equipment;
const itemIsText = (it) => typeof it === "object" && it.text;
const itemSubs = (it) => (typeof it === "object" && Array.isArray(it.subs)) ? it.subs : null;
const flattenItems = (items) => {
  const out=[];
  items.forEach(it=>{ out.push(it); const s=itemSubs(it); if(s) s.forEach(si=>out.push(si)); });
  return out;
};

// =================== APP ===================
function App() {
  const [status, setStatus] = useState("loading");
  const [errMsg, setErrMsg] = useState("");
  const [side, setSide] = useState("field");
  const [officeAuthed, setOfficeAuthed] = useState(false);
  const [syncing, setSyncing] = useState(false);

  const [projects, setProjects] = useState([]);
  const [contractors, setContractors] = useState([]);
  const [entries, setEntries] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [procurement, setProcurement] = useState([]);
  const [pto, setPto] = useState([]);

  const refresh = useCallback(async () => {
    try {
      const d = await loadAll();
      setProjects(d.projects || []);
      setContractors(d.contractors || []);
      setEntries(d.entries || []);
      setEmployees(d.employees || []);
      setProcurement(d.procurement || []);
      setPto(d.pto || []);
      setStatus("ok");
    } catch (e) { setErrMsg(String(e.message || e)); setStatus("error"); }
  }, []);
  useEffect(() => { refresh(); }, [refresh]);

  const persist = useCallback(async (collection, data, setter) => {
    setter(data); setSyncing(true);
    try { await saveCollection(collection, data); }
    catch (e) { alert("Couldn't save to the server — reloading latest data.\n\n" + (e.message || e)); await refresh(); }
    finally { setSyncing(false); }
  }, [refresh]);

  const saveProjects    = useCallback((p) => persist("projects", p, setProjects), [persist]);
  const saveContractors = useCallback((c) => persist("contractors", c, setContractors), [persist]);
  const saveEntries     = useCallback((e) => persist("entries", e, setEntries), [persist]);
  const saveEmployees   = useCallback((e) => persist("employees", e, setEmployees), [persist]);
  const saveProcurement = useCallback((p) => persist("procurement", p, setProcurement), [persist]);
  const savePto         = useCallback((p) => persist("pto", p, setPto), [persist]);

  if (status === "loading") return (
    <div style={S.loadWrap}>
      <div style={S.loadMark}>FIELD<span style={{color:"var(--amber)"}}>DOG</span></div>
      <div style={S.spinner} /><div style={S.loadSub}>connecting…</div>
    </div>
  );
  if (status === "error") return (
    <div style={S.loadWrap}>
      <div style={S.loadMark}>FIELD<span style={{color:"var(--amber)"}}>DOG</span></div>
      <div style={{color:"var(--red)",marginTop:16,fontWeight:600}}>Couldn't reach the server</div>
      <div style={S.loadSub}>{errMsg}</div>
      <button className="primary" style={{...S.primaryBtn,maxWidth:200,marginTop:18}} onClick={()=>{setStatus("loading");refresh();}}>RETRY</button>
    </div>
  );

  return (
    <div>
      <Header side={side} setSide={setSide} authed={officeAuthed} resetAuth={()=>setOfficeAuthed(false)} syncing={syncing} onRefresh={refresh} />
      {side==="field" ? (
        <FieldSide projects={projects.filter(p=>!p.removed)} entries={entries} saveEntries={saveEntries} employees={employees} contractors={contractors} procurement={procurement} saveProcurement={saveProcurement} pto={pto} savePto={savePto} />
      ) : officeAuthed ? (
        <OfficeSide projects={projects} saveProjects={saveProjects} contractors={contractors} saveContractors={saveContractors} entries={entries} employees={employees} saveEmployees={saveEmployees} procurement={procurement} saveProcurement={saveProcurement} pto={pto} savePto={savePto} />
      ) : (
        <PinGate onUnlock={()=>setOfficeAuthed(true)} />
      )}
    </div>
  );
}

function Header({ side, setSide, authed, resetAuth, syncing, onRefresh }) {
  return (
    <header style={S.header}>
      <div style={S.brand}>FIELD<span style={{color:"var(--amber)"}}>DOG</span><span style={S.brandTag}>JOB TRACKING</span></div>
      <span title={syncing?"saving…":"synced"} className="syncdot" style={{background:syncing?"var(--amber)":"var(--green)"}} />
      <button className="lockbtn" style={{...S.lockBtn,padding:"8px 10px"}} onClick={onRefresh} title="Reload latest">⟳</button>
      <div style={S.toggle}>
        <button className="seg" onClick={()=>setSide("field")} style={{...S.segBtn,...(side==="field"?S.segOn:{})}}>FIELD</button>
        <button className="seg" onClick={()=>setSide("office")} style={{...S.segBtn,...(side==="office"?S.segOn:{})}}>OFFICE</button>
      </div>
      {side==="office" && authed && <button className="lockbtn" style={S.lockBtn} onClick={resetAuth}>🔒</button>}
    </header>
  );
}

function PinGate({ onUnlock }) {
  const [pin,setPin]=useState(""); const [err,setErr]=useState(false);
  const press=(d)=>{
    setErr(false);
    if(d==="del")return setPin(p=>p.slice(0,-1));
    if(d==="clr")return setPin("");
    setPin(p=>{
      if(p.length>=6) return p;
      const next=p+d;
      if(next===OFFICE_PIN){ setTimeout(onUnlock,150); }
      else if(next.length>=OFFICE_PIN.length){ setErr(true); setTimeout(()=>setPin(""),400); }
      return next;
    });
  };
  // physical / on-screen keyboard support
  useEffect(()=>{
    const onKey=(e)=>{
      if(e.key>="0" && e.key<="9"){ e.preventDefault(); press(e.key); }
      else if(e.key==="Backspace"){ e.preventDefault(); press("del"); }
      else if(e.key==="Escape"){ press("clr"); }
    };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);
  return (
    <div style={S.pinWrap}>
      <div style={S.pinTitle}>OFFICE ACCESS</div>
      <div style={S.pinSub}>Enter PIN — tap below or type on your keyboard</div>
      <div style={{...S.pinDots,...(err?{animation:"shake .35s"}:{})}}>
        {[0,1,2,3,4,5].map(i=><span key={i} style={{...S.dot,...(i<pin.length?S.dotOn:{}),...(i<OFFICE_PIN.length||i<pin.length?{}:{opacity:.25})}} />)}
      </div>
      {err && <div style={S.pinErr}>Incorrect PIN</div>}
      <div style={S.pad}>
        {["1","2","3","4","5","6","7","8","9","clr","0","del"].map(k=>
          <button key={k} className="padkey" style={S.padKey} onClick={()=>press(k)}>{k==="del"?"⌫":k==="clr"?"C":k}</button>)}
      </div>
    </div>
  );
}

// ================= FIELD =================
function FieldSide({ projects, entries, saveEntries, employees, contractors, procurement, saveProcurement, pto, savePto }) {
  const [sel,setSel]=useState(null);
  const [view,setView]=useState("jobs"); // jobs | timeoff | calendar — only relevant when no job is selected
  if(projects.length===0 && view==="jobs") {
    // still allow timeoff/calendar even with no jobs
  }
  const live = sel ? projects.find(p=>p.id===sel.id) : null;
  if(live){
    return <Workspace project={live} back={()=>setSel(null)} entries={entries} saveEntries={saveEntries} employees={employees} contractors={contractors} procurement={procurement} saveProcurement={saveProcurement} />;
  }
  return (
    <main style={S.main}>
      <div style={S.viewSwitcher}>
        <button style={{...S.viewBtn, ...(view==="jobs"?S.viewBtnOn:{})}} onClick={()=>setView("jobs")}>JOBS</button>
        <button style={{...S.viewBtn, ...(view==="timeoff"?S.viewBtnOn:{})}} onClick={()=>setView("timeoff")}>TIME OFF</button>
        <button style={{...S.viewBtn, ...(view==="calendar"?S.viewBtnOn:{})}} onClick={()=>setView("calendar")}>PTO CALENDAR</button>
      </div>
      {view==="jobs" && (
        projects.length===0
          ? <div style={S.noNotes}>No active projects yet. Ask the office to set one up.</div>
          : <JobSelectBody projects={projects} onPick={setSel} />
      )}
      {view==="timeoff" && <FieldTimeOff employees={employees} pto={pto} savePto={savePto} />}
      {view==="calendar" && <PtoCalendar pto={pto} />}
    </main>
  );
}

function JobSelectBody({ projects, onPick }) {
  // group jobs by contractor (case-insensitive), sort groups alphabetically, jobs alphabetically inside.
  // "No contractor" group goes to the bottom.
  const NO_CON = "__none__";
  const groupsMap = {};
  projects.forEach(p=>{
    const key = (p.contractor||"").trim() || NO_CON;
    (groupsMap[key] = groupsMap[key] || { label:(p.contractor||"").trim()||"(No contractor)", jobs:[] }).jobs.push(p);
  });
  const groups = Object.entries(groupsMap)
    .map(([key,g])=>({ key, label:g.label, jobs:g.jobs.slice().sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:"base"})) }))
    .sort((a,b)=>{
      if(a.key===NO_CON) return 1; if(b.key===NO_CON) return -1;
      return a.label.localeCompare(b.label, undefined, {sensitivity:"base"});
    });

  // collapsed state per device, by contractor key
  const LS_KEY = "fielddog_collapsed_contractors_v1";
  const [collapsed,setCollapsed]=useState(()=>{
    try { return new Set(JSON.parse(localStorage.getItem(LS_KEY)||"[]")); }
    catch { return new Set(); }
  });
  const toggle = (key)=>{
    const next = new Set(collapsed);
    next.has(key) ? next.delete(key) : next.add(key);
    setCollapsed(next);
    try { localStorage.setItem(LS_KEY, JSON.stringify([...next])); } catch {}
  };

  return (
    <div>
      <SectionTitle>SELECT A JOB</SectionTitle>
      {groups.map(g=>{
        const isCollapsed = collapsed.has(g.key);
        return (
          <div key={g.key} style={S.contractorGroup}>
            <button className="seg" style={S.contractorHeader} onClick={()=>toggle(g.key)}>
              <span style={S.contractorCaret}>{isCollapsed?"▸":"▾"}</span>
              <span style={S.contractorLabel}>{g.label}</span>
              <span style={S.contractorCount}>{g.jobs.length}</span>
            </button>
            {!isCollapsed && (
              <div style={S.jobGrid}>
                {g.jobs.map(p=>(
                  <button key={p.id} className="jobcard" style={S.jobCard} onClick={()=>onPick(p)}>
                    <div style={S.jobName}>{p.name}</div>
                    <div style={S.jobMeta}>{p.workTypes.map(w=><span key={w} style={S.chip}>{w}</span>)}</div>
                    <div style={S.jobAddr}>{p.address||"—"}</div>
                  </button>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Workspace({ project, back, entries, saveEntries, employees, contractors, procurement, saveProcurement }) {
  const [trade,setTrade]=useState(project.workTypes[0]);
  const [tab,setTab]=useState("checklist");
  const projNum = (project.projectNumbers||{})[trade];
  const contractorRec = (contractors||[]).find(c=>c.name===project.contractor);
  const jobContacts = (contractorRec && contractorRec.contacts) || [];
  return (
    <main style={S.main}>
      <button className="backbtn" style={S.backBtn} onClick={back}>← All Jobs</button>
      <div style={S.wsHead}>
        <div style={S.wsName}>{project.name}</div>
        <div style={S.wsSub}>{project.contractor||"—"} · {project.address||"—"}</div>
      </div>
      {project.workTypes.length>1 &&
        <div style={S.tradeRow}>{project.workTypes.map(w=>
          <button key={w} className="trade" style={{...S.tradeBtn,...(trade===w?S.tradeOn:{})}} onClick={()=>setTrade(w)}>{w}</button>)}</div>}
      <div style={S.projNumBanner}>{trade} project #: <strong style={{color:"var(--ink)"}}>{projNum||"—"}</strong></div>
      {jobContacts.length>0 && (
        <div style={S.contactsBox}>
          <div style={S.contactsHead}>JOB CONTACTS{project.contractor?` · ${project.contractor}`:""}</div>
          {jobContacts.map(c=>(
            <div key={c.id} style={S.contactRow}>
              <span style={S.contactName}>{c.name||"—"}</span>
              {c.phone ? <a href={`tel:${c.phone.replace(/[^0-9+]/g,"")}`} style={S.contactPhone}>{c.phone}</a> : <span style={{color:"var(--sub)"}}>no #</span>}
            </div>
          ))}
        </div>
      )}
      <div style={S.tabRow}>
        <button style={{...S.tab,...(tab==="checklist"?S.tabOn:{})}} onClick={()=>setTab("checklist")}>CHECKLIST</button>
        <button style={{...S.tab,...(tab==="notes"?S.tabOn:{})}} onClick={()=>setTab("notes")}>NOTES</button>
        <button style={{...S.tab,...(tab==="procurement"?S.tabOn:{})}} onClick={()=>setTab("procurement")}>MATERIALS</button>
      </div>
      {tab==="checklist"
        ? <Checklist project={project} trade={trade} entries={entries} saveEntries={saveEntries} employees={employees} />
        : tab==="notes"
        ? <Notes project={project} trade={trade} entries={entries} saveEntries={saveEntries} employees={employees} />
        : <FieldProcurement project={project} trade={trade} procurement={procurement} saveProcurement={saveProcurement} employees={employees} />}
    </main>
  );
}

// ---- Checklist (whole-job, sectioned, equipment items, sub-items, N/A) ----
function Checklist({ project, trade, entries, saveEntries, employees }) {
  const sections = CHECKLISTS[trade] || [];
  // checklist records for this project+trade (whole-job, no day filter)
  const recs = entries.filter(e=>e.type==="check"&&e.projectId===project.id&&e.trade===trade);
  const byItem = {}; recs.forEach(r=>byItem[r.item]=r);
  // extra equipment the techs added
  const extraEquip = entries.filter(e=>e.type==="equip"&&e.projectId===project.id&&e.trade===trade).sort((a,b)=>a.id.localeCompare(b.id));

  const [active,setActive]=useState(null); // {label, mode: 'check'|'na'}
  const [addingEquip,setAddingEquip]=useState(false);

  // count all leaf items (parent + each visible sub when applicable)
  const allLabels = [];
  sections.forEach(sec=>{
    sec.items.forEach(it=>{
      const lbl=itemLabel(it); allLabels.push(lbl);
      const subs=itemSubs(it);
      // count subs only if parent is checked (visible)
      if(subs && byItem[lbl] && byItem[lbl].status!=="na"){
        subs.forEach(si=>allLabels.push(itemLabel(si)));
      }
    });
  });
  const acted = allLabels.filter(l=>byItem[l]).length;

  const saveAction = (label, mode, name, opts={}) => {
    const rec = { id:uid(), type:"check", projectId:project.id, trade, item:label, name:name.trim(), ts:stamp(), day:todayKey(), status: mode==="na" ? "na" : "done" };
    if(opts.model!==undefined) rec.model = (opts.model||"").trim();
    if(opts.serial!==undefined) rec.serial = (opts.serial||"").trim();
    if(opts.value!==undefined) rec.value = (opts.value||"").trim();
    saveEntries([rec, ...entries]); setActive(null);
  };
  const saveExtraEquip = (equipName, name, model, serial) => {
    const rec = { id:uid(), type:"equip", projectId:project.id, trade, equipName:equipName.trim(), name:name.trim(), model:model.trim(), serial:serial.trim(), ts:stamp(), day:todayKey() };
    saveEntries([rec, ...entries]); setAddingEquip(false);
  };

  const renderItem = (it, indent=false) => {
    const label = itemLabel(it);
    const rec = byItem[label];
    const equip = itemIsEquip(it);
    const text = itemIsText(it);
    const subs = itemSubs(it);
    const isActive = active && active.label===label && !rec;
    const naStyle = rec && rec.status==="na" ? S.checkRowNA : (rec ? S.checkRowDone : {});
    return (
      <div key={label}>
        <div className={rec?"":"checkrow"} style={{...S.checkRow, ...naStyle, ...(indent?S.checkRowSub:{})}}>
          <span style={{...S.box, ...(rec && rec.status!=="na"?S.boxOn:{}), ...(rec && rec.status==="na"?S.boxNA:{})}}>
            {rec ? (rec.status==="na" ? "—" : "✓") : ""}
          </span>
          <div style={{flex:1, cursor: rec ? "default":"pointer"}} onClick={()=>{ if(!rec) setActive(isActive?null:{label,mode:"check"}); }}>
            <div style={{...S.checkTxt}}>
              {label}
              {!rec && equip && <span style={S.equipTag}>model / serial</span>}
              {!rec && text && <span style={S.equipTag}>text answer</span>}
            </div>
            {rec && rec.status==="done" && <div style={S.checkStamp}>✓ {rec.name} · {rec.ts}</div>}
            {rec && rec.status==="na" && <div style={S.naStamp}>N/A — {rec.name} · {rec.ts}</div>}
            {rec && rec.model!==undefined && (rec.model||rec.serial) && (
              <div style={S.equipVals}>Model: {rec.model||"—"} · Serial: {rec.serial||"—"}</div>
            )}
            {rec && rec.value && <div style={S.equipVals}>{rec.value}</div>}
          </div>
          {!rec && (
            <button className="ghost" style={S.naBtn} onClick={(e)=>{e.stopPropagation(); setActive(isActive && active.mode==="na" ? null : {label,mode:"na"});}}>
              N/A
            </button>
          )}
        </div>
        {isActive && (
          <CheckForm
            equip={equip}
            text={text}
            mode={active.mode}
            employees={employees}
            onCancel={()=>setActive(null)}
            onSave={(name,extras)=>saveAction(label, active.mode, name, extras||{})}
          />
        )}
        {/* Conditional subs */}
        {subs && rec && rec.status==="done" && (
          <div style={S.subList}>
            {subs.map(si=>renderItem(si, true))}
          </div>
        )}
      </div>
    );
  };

  return (
    <div>
      <div style={S.progress}>
        <div style={S.progressBar}><div style={{...S.progressFill,width:`${allLabels.length?(acted/allLabels.length)*100:0}%`}} /></div>
        <span style={S.progressTxt}>{acted}/{allLabels.length} done</span>
      </div>

      {sections.map(sec=>(
        <div key={sec.section} style={{marginBottom:18}}>
          <div style={S.secHead}>{sec.section}</div>
          <div style={S.checkList}>
            {sec.items.map(it=>renderItem(it))}
          </div>
        </div>
      ))}

      {/* Additional equipment */}
      <div style={{marginBottom:18}}>
        <div style={S.secHead}>Additional Equipment</div>
        {extraEquip.map(eq=>(
          <div key={eq.id} style={{...S.checkRow,...S.checkRowDone}}>
            <span style={{...S.box,...S.boxOn}}>✓</span>
            <div style={{flex:1}}>
              <div style={S.checkTxt}>{eq.equipName}</div>
              <div style={S.checkStamp}>✓ {eq.name} · {eq.ts}</div>
              <div style={S.equipVals}>Model: {eq.model||"—"} · Serial: {eq.serial||"—"}</div>
            </div>
          </div>
        ))}
        {!addingEquip
          ? <button className="ghost" style={S.ghostBtn} onClick={()=>setAddingEquip(true)}>+ Add equipment</button>
          : <ExtraEquipForm employees={employees} onCancel={()=>setAddingEquip(false)} onSave={saveExtraEquip} />}
      </div>

      <p style={S.hint}>This is a whole-job checklist — items stay checked for the life of the job. Tap an item to mark it done; use N/A if it doesn't apply. Once acted on, an item locks and records who & when.</p>
    </div>
  );
}

function CheckForm({ equip, text, mode, employees, onSave, onCancel }) {
  const isNa = mode === "na";
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState(employees.length===0);
  const [model,setModel]=useState(""); const [serial,setSerial]=useState("");
  const [value,setValue]=useState("");
  const submit=()=>{
    const name=useTyped?typed:sel;
    if(!name.trim()) return alert("Pick or type a name.");
    if(!isNa){
      if(equip){ if(!model.trim()) return alert("Model # is required."); if(!serial.trim()) return alert("Serial # is required."); }
      if(text && !value.trim()) return alert("Please type the answer.");
    }
    const extras = {};
    if(equip && !isNa){ extras.model = model; extras.serial = serial; }
    if(text && !isNa){ extras.value = value; }
    onSave(name, extras);
  };
  return (
    <div style={S.checkForm}>
      <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
      {!isNa && equip && (
        <div style={{marginTop:10}}>
          <div style={S.formRow}>
            <div style={{flex:1}}><label style={S.fieldLabel}>MODEL # <span style={{color:"var(--amber)"}}>*</span></label><input style={S.input} value={model} onChange={e=>setModel(e.target.value)} /></div>
            <div style={{flex:1}}><label style={S.fieldLabel}>SERIAL # <span style={{color:"var(--amber)"}}>*</span></label><input style={S.input} value={serial} onChange={e=>setSerial(e.target.value)} /></div>
          </div>
        </div>
      )}
      {!isNa && text && (
        <div style={{marginTop:10}}>
          <label style={S.fieldLabel}>ANSWER <span style={{color:"var(--amber)"}}>*</span></label>
          <input style={S.input} value={value} onChange={e=>setValue(e.target.value)} placeholder="Type the answer…" />
        </div>
      )}
      <div style={{display:"flex",gap:8,marginTop:10}}>
        <button className="primary" style={{...S.primaryBtn,flex:1,marginTop:0, ...(isNa?{background:"var(--sub)",color:"#fff"}:{})}} onClick={submit}>
          {isNa ? "MARK N/A (locks)" : "CHECK OFF (locks)"}
        </button>
        <button className="ghost" style={S.ghostBtn} onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

// ---- Notes (name via employee dropdown; single open box good for talk-to-text) ----
function Notes({ project, trade, entries, saveEntries, employees }) {
  const [work,setWork]=useState("");
  const [todoInput,setTodoInput]=useState("");
  const [todoList,setTodoList]=useState([]); // items being added before save
  const [matInput,setMatInput]=useState("");
  const [matList,setMatList]=useState([]);
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState(employees.length===0);

  const notes=entries.filter(e=>e.type==="note"&&e.projectId===project.id&&e.trade===trade).sort((a,b)=>b.id.localeCompare(a.id));

  // collect all open loop items across this job's trade — preserve which note each came from
  const openTodos=[]; const openMaterials=[];
  notes.forEach(n=>{
    (n.todos||[]).forEach(t=>{ if(!t.closedTs) openTodos.push({...t, noteId:n.id, createdBy:n.name, createdTs:n.ts}); });
    (n.materials||[]).forEach(m=>{ if(!m.closedTs) openMaterials.push({...m, noteId:n.id, createdBy:n.name, createdTs:n.ts}); });
  });

  const addTodoInline=()=>{ const v=todoInput.trim(); if(!v) return; setTodoList([...todoList,{id:uid(),text:v}]); setTodoInput(""); };
  const removeTodoInline=(id)=> setTodoList(todoList.filter(t=>t.id!==id));
  const addMatInline=()=>{ const v=matInput.trim(); if(!v) return; setMatList([...matList,{id:uid(),text:v}]); setMatInput(""); };
  const removeMatInline=(id)=> setMatList(matList.filter(m=>m.id!==id));

  const addNote=()=>{
    const name=useTyped?typed:sel;
    if(!name.trim())return alert("Pick or type a name.");
    if(!work.trim() && todoList.length===0 && matList.length===0) return alert("Fill in at least one section before saving.");
    const note = {
      id:uid(), type:"note", projectId:project.id, trade, name:name.trim(), ts:stamp(), day:todayKey(),
      work: work.trim(),
      todos: todoList.map(t=>({id:t.id, text:t.text, createdName:name.trim(), createdTs:stamp()})),
      materials: matList.map(m=>({id:m.id, text:m.text, createdName:name.trim(), createdTs:stamp()})),
      addenda:[],
    };
    saveEntries([note,...entries]);
    setWork(""); setTodoList([]); setMatList([]); setTodoInput(""); setMatInput("");
  };

  const closeItem = (noteId, kind, itemId, byName) => {
    saveEntries(entries.map(e=>{
      if(e.id!==noteId) return e;
      const list=(e[kind]||[]).map(it=> it.id===itemId ? {...it, closedBy:byName, closedTs:stamp()} : it);
      return {...e, [kind]:list};
    }));
  };

  const addAddendum=(noteId,an,at)=> saveEntries(entries.map(e=> e.id===noteId?{...e,addenda:[...(e.addenda||[]),{id:uid(),name:an.trim(),text:at.trim(),ts:stamp()}]}:e));

  return (
    <div>
      {/* Open loops pinned to the top */}
      {(openTodos.length>0 || openMaterials.length>0) && (
        <div style={S.openLoopsBox}>
          <div style={S.openLoopsHead}>OPEN ITEMS ON THIS JOB · {trade}</div>
          {openTodos.length>0 && (
            <div style={{marginBottom: openMaterials.length>0?12:0}}>
              <div style={S.openLoopsSub}>Still needs to be done</div>
              {openTodos.map(t=>(
                <OpenLoopRow key={t.id} item={t} kind="todos" employees={employees} onClose={(by)=>closeItem(t.noteId,"todos",t.id,by)} />
              ))}
            </div>
          )}
          {openMaterials.length>0 && (
            <div>
              <div style={S.openLoopsSub}>Materials needed next trip</div>
              {openMaterials.map(m=>(
                <OpenLoopRow key={m.id} item={m} kind="materials" employees={employees} onClose={(by)=>closeItem(m.noteId,"materials",m.id,by)} />
              ))}
            </div>
          )}
        </div>
      )}

      {/* New note form */}
      <SectionTitle>NEW NOTE</SectionTitle>
      <div style={S.nameWrap}>
        <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
      </div>
      <label style={S.fieldLabel}>WORK COMPLETED TODAY</label>
      <textarea style={S.textarea} rows={3} placeholder={`What did you finish today on the ${trade.toLowerCase()} scope?  (mic on keyboard works)`} value={work} onChange={e=>setWork(e.target.value)} />

      <div style={{marginTop:14}}>
        <label style={S.fieldLabel}>STILL NEEDS TO BE DONE</label>
        <div style={{display:"flex",gap:8}}>
          <input style={{...S.input,flex:1}} placeholder="e.g. install sillcocks" value={todoInput} onChange={e=>setTodoInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addTodoInline();}} />
          <button className="ghost" style={{...S.ghostBtn,padding:"8px 14px",border:`1px solid var(--line)`,borderRadius:8}} onClick={addTodoInline}>+ ADD</button>
        </div>
        {todoList.map(t=>(
          <div key={t.id} style={S.pendingRow}>
            <span style={{flex:1}}>• {t.text}</span>
            <button className="ghost" style={S.ghostBtn} onClick={()=>removeTodoInline(t.id)}>✕</button>
          </div>
        ))}
      </div>

      <div style={{marginTop:14}}>
        <label style={S.fieldLabel}>MATERIALS NEEDED NEXT TRIP</label>
        <div style={{display:"flex",gap:8}}>
          <input style={{...S.input,flex:1}} placeholder="e.g. two 3/4 90s" value={matInput} onChange={e=>setMatInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addMatInline();}} />
          <button className="ghost" style={{...S.ghostBtn,padding:"8px 14px",border:`1px solid var(--line)`,borderRadius:8}} onClick={addMatInline}>+ ADD</button>
        </div>
        {matList.map(m=>(
          <div key={m.id} style={S.pendingRow}>
            <span style={{flex:1}}>• {m.text}</span>
            <button className="ghost" style={S.ghostBtn} onClick={()=>removeMatInline(m.id)}>✕</button>
          </div>
        ))}
      </div>

      <button className="primary" style={S.primaryBtn} onClick={addNote}>SAVE NOTE (locks on save)</button>
      <p style={S.hint}>Saved notes can't be edited. Open items above can be checked off by anyone when they're done — those records stay.</p>

      <SectionTitle>NOTE HISTORY — {trade}</SectionTitle>
      <div style={S.noteFeed}>
        {notes.length===0 && <div style={S.noNotes}>No notes yet for {trade}.</div>}
        {notes.map(n=><NoteCard key={n.id} note={n} onAddendum={addAddendum} employees={employees} onCloseItem={closeItem} />)}
      </div>
    </div>
  );
}

  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState((employees||[]).length===0);
  const submit=()=>{ const by=useTyped?typed:sel; if(!by.trim()) return alert("Pick or type a name."); onClose(by.trim()); setOpen(false); setSel(""); setTyped(""); };
  return (
    <div style={S.openLoopRow}>
      <div style={{flex:1}}>
        <div style={{fontSize:14}}>• {item.text}</div>
        <div style={S.openLoopMeta}>added by {item.createdBy||item.createdName} · {item.createdTs}</div>

          <div style={{marginTop:8}}>

            <div style={{display:"flex",gap:8,marginTop:8}}>

              <button className="ghost" style={S.ghostBtn} onClick={()=>setOpen(false)}>Cancel</button>
            </div>
          </div>
        )}
      </div>
      {!open && <button className="ghost" style={S.closeLoopBtn} onClick={()=>setOpen(true)}>{kind==="todos"?"Mark done":"Brought"}</button>}
    </div>
  );
}

              <div style={{flex:1}}>
                <div style={{...S.noteItemText, ...(m.closedTs?{textDecoration:"line-through",color:"var(--sub)"}:{})}}>{m.text}</div>
                {m.closedTs && <div style={S.noteItemStamp}>brought by {m.closedBy} · {m.closedTs}</div>}
              </div>
            </div>
          ))}

      )}

      {(note.addenda||[]).map(a=><div key={a.id} style={S.addendum}><div style={S.addHead}>↳ ADDENDUM · {a.name} · {a.ts}</div><div style={S.addBody}>{a.text}</div></div>)}
      {!open?<button className="ghost" style={S.ghostBtn} onClick={()=>setOpen(true)}>+ Add addendum</button>:(
        <div style={S.addForm}>
          <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
          <textarea style={{...S.textarea,marginTop:8}} rows={2} placeholder="Addendum… (mic on keyboard works here too)" value={at} onChange={e=>setAt(e.target.value)} />
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button className="primary" style={{...S.primaryBtn,flex:1}} onClick={submit}>SAVE ADDENDUM</button>
            <button className="ghost" style={S.ghostBtn} onClick={()=>setOpen(false)}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ---- Procurement (field side: techs request materials per trade) ----
function FieldProcurement({ project, trade, procurement, saveProcurement, employees }) {
  const [item,setItem]=useState(""); const [qty,setQty]=useState("");
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState(employees.length===0);

  const myReqs = (procurement||[]).filter(r=>r.projectId===project.id && r.trade===trade).sort((a,b)=>b.id.localeCompare(a.id));

  const submit=()=>{
    const name=useTyped?typed:sel;
    if(!name.trim()) return alert("Pick or type a name.");
    if(!item.trim()) return alert("Item name is required.");
    if(!String(qty).trim()) return alert("Quantity is required.");

// ---- PTO helpers ----
// Iterate dates in inclusive range [fromStr, toStr] as YYYY-MM-DD strings
function ptoDatesInRange(fromStr, toStr) {
  const out=[];
  const a=new Date(fromStr+"T00:00:00"); const b=new Date(toStr+"T00:00:00");
  if(isNaN(a)||isNaN(b)) return out;
  const lo=a<=b?a:b, hi=a<=b?b:a;
  const d=new Date(lo);
  while(d<=hi){
    out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
    d.setDate(d.getDate()+1);
  }
  return out;
}
function fmtDate(s){
  if(!s) return "";
  const d=new Date(s+"T00:00:00");
  if(isNaN(d)) return s;
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function ptoDayLabel(req){
  if(req.dayMode==="am") return "½ day AM";
  if(req.dayMode==="pm") return "½ day PM";
  return "Full days";
}
function ptoDays(req){
  const days = ptoDatesInRange(req.from, req.to).length;
  if(req.dayMode==="am" || req.dayMode==="pm") return 0.5;
  return days;
}

// ---- PTO Calendar (list default, month grid toggle) ----
function PtoCalendar({ pto }) {
  const [mode,setMode]=useState("list"); // list | grid
  const approved = (pto||[]).filter(r=>r.status==="Approved");

  // for list: upcoming first (from today forward), sorted by start date asc
  const tk = todayKey();
  const upcoming = approved.filter(r=>r.to>=tk).sort((a,b)=>a.from.localeCompare(b.from));
  const past = approved.filter(r=>r.to<tk).sort((a,b)=>b.from.localeCompare(a.from));

  // for grid
  const [cursor,setCursor]=useState(()=>{ const d=new Date(); return { y:d.getFullYear(), m:d.getMonth() }; });
  const monthLabel = new Date(cursor.y, cursor.m, 1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const prev = ()=> setCursor(c=>{ const m=c.m-1; return m<0 ? {y:c.y-1, m:11} : {y:c.y, m}; });
  const next = ()=> setCursor(c=>{ const m=c.m+1; return m>11 ? {y:c.y+1, m:0} : {y:c.y, m}; });
  const goToday = ()=> { const d=new Date(); setCursor({y:d.getFullYear(), m:d.getMonth()}); };

  // build month grid (6 weeks × 7 days, leading/trailing days for prev/next month)
  const firstOfMonth = new Date(cursor.y, cursor.m, 1);
  const startDow = firstOfMonth.getDay(); // 0 Sun
  const gridStart = new Date(cursor.y, cursor.m, 1 - startDow);
  const cells = [];
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const inMonth = d.getMonth()===cursor.m;
    const isToday = key===tk;
    const ptoHere = approved.filter(r=> key>=r.from && key<=r.to );
    cells.push({ key, day:d.getDate(), inMonth, isToday, ptoHere });
  }

  return (
    <div>
      <SectionTitle>PTO CALENDAR</SectionTitle>
      <div style={S.tradeRow}>
        <button className="trade" style={{...S.tradeBtn, ...(mode==="list"?S.tradeOn:{})}} onClick={()=>setMode("list")}>List</button>
        <button className="trade" style={{...S.tradeBtn, ...(mode==="grid"?S.tradeOn:{})}} onClick={()=>setMode("grid")}>Month grid</button>
      </div>

      {mode==="list" ? (
        <div style={{marginTop:14}}>
          <SectionTitle>UPCOMING</SectionTitle>
          {upcoming.length===0 && <div style={S.noNotes}>No upcoming time off.</div>}
          {upcoming.map(r=>(
            <div key={r.id} style={S.noteCard}>
              <div style={S.noteHead}>
                <span style={S.noteAuthor}>{r.name}</span>
                <span style={S.noteTs}>{ptoDayLabel(r)}</span>
              </div>
              <div style={S.adminMeta}>{r.from===r.to ? fmtDate(r.from) : `${fmtDate(r.from)} → ${fmtDate(r.to)}`}</div>
              {r.note && <div style={{...S.noteBody, marginTop:6}}>{r.note}</div>}
            </div>
          ))}
          {past.length>0 && (<>
            <SectionTitle>PAST</SectionTitle>
            {past.slice(0,20).map(r=>(
              <div key={r.id} style={{...S.noteCard, opacity:.65}}>
                <div style={S.noteHead}>
                  <span style={S.noteAuthor}>{r.name}</span>
                  <span style={S.noteTs}>{ptoDayLabel(r)}</span>
                </div>
                <div style={S.adminMeta}>{r.from===r.to ? fmtDate(r.from) : `${fmtDate(r.from)} → ${fmtDate(r.to)}`}</div>
              </div>
            ))}
          </>)}
        </div>
      ) : (
        <div style={{marginTop:14}}>
          <div style={S.calNav}>
            <button className="ghost" style={S.calNavBtn} onClick={prev}>‹ Prev</button>
            <button className="ghost" style={S.calNavBtn} onClick={goToday}>Today</button>
            <div style={S.calLabel}>{monthLabel}</div>
            <button className="ghost" style={S.calNavBtn} onClick={next}>Next ›</button>
          </div>
          <div style={S.calGrid}>
            {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} style={S.calHeadCell}>{d}</div>)}
            {cells.map((c,i)=>(
              <div key={i} style={{...S.calCell, ...(c.inMonth?{}:S.calCellDim), ...(c.isToday?S.calCellToday:{})}}>
                <div style={S.calDayNum}>{c.day}</div>
                {c.ptoHere.slice(0,3).map(r=>(
                  <div key={r.id} style={S.calPtoChip} title={`${r.name} · ${ptoDayLabel(r)}`}>{r.name.split(" ")[0]}{r.dayMode!=="full"?"·½":""}</div>
                ))}
                {c.ptoHere.length>3 && <div style={S.calMore}>+{c.ptoHere.length-3}</div>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function ProjectsAdmin({ projects, saveProjects, contractors, entries }) {
  const blank={ name:"", address:"", contractor:"", workTypes:[], projectNumbers:{} };
  const [form,setForm]=useState(blank);
  const [editingId,setEditingId]=useState(null); // null = creating
  const [showRemoved,setShowRemoved]=useState(false);
  const active=projects.filter(p=>!p.removed); const removed=projects.filter(p=>p.removed);

  const toggleType=(w)=>setForm(f=>{
    const has=f.workTypes.includes(w);
    // guard: removing a trade that has logged activity
    if(has && editingId){
      const hasActivity=(entries||[]).some(e=>e.projectId===editingId && e.trade===w && (e.type==="check"||e.type==="equip"||e.type==="note"));
      if(hasActivity && !confirm(`${w} already has checklist or note activity logged on this job. Remove it anyway? (The logged data stays in the system but the trade won't show on the job.)`)) return f;
    }
    const workTypes=has?f.workTypes.filter(x=>x!==w):[...f.workTypes,w];
    const projectNumbers={...f.projectNumbers}; if(has) delete projectNumbers[w];
    return {...f,workTypes,projectNumbers};
  });
  const setNum=(w,v)=>setForm(f=>({...f,projectNumbers:{...f.projectNumbers,[w]:v}}));

  const resetForm=()=>{ setForm(blank); setEditingId(null); };

  const startEdit=(p)=>{
    setEditingId(p.id);
    setForm({ name:p.name, address:p.address||"", contractor:p.contractor||"", workTypes:[...p.workTypes], projectNumbers:{...(p.projectNumbers||{})} });
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const validate=()=>{
    if(!form.name.trim()){ alert("Job name is required."); return null; }
    if(form.workTypes.length===0){ alert("Pick at least one type of work."); return null; }
    for(const w of form.workTypes){ if(!(form.projectNumbers[w]||"").trim()){ alert(`Enter a project number for ${w}.`); return null; } }
    const cleanNums={}; form.workTypes.forEach(w=>cleanNums[w]=form.projectNumbers[w].trim());
    return { ...form, name:form.name.trim(), projectNumbers:cleanNums };
  };

  const create=()=>{ const v=validate(); if(!v) return; saveProjects([{...v,id:uid(),removed:false,created:stamp()},...projects]); resetForm(); };
  const saveEdit=()=>{ const v=validate(); if(!v) return; saveProjects(projects.map(p=>p.id===editingId?{...p,...v}:p)); resetForm(); };

  const remove=(id)=>{ if(!confirm("Remove this project? It moves to the Removed list (data kept).")) return; saveProjects(projects.map(p=>p.id===id?{...p,removed:true}:p)); if(editingId===id) resetForm(); };
  const restore=(id)=> saveProjects(projects.map(p=>p.id===id?{...p,removed:false}:p));

  return (
    <div>
      <SectionTitle>{editingId?"EDIT JOB":"SET UP A JOB"}</SectionTitle>
      <div style={{...S.formCard, ...(editingId?{borderColor:"var(--amber)"}:{})}}>
        {editingId && <div style={S.editBanner}>Editing an existing job — changes apply everywhere.</div>}
        <Field label="JOB NAME *"><input style={S.input} value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Maple Street Townhomes" /></Field>
        <Field label="CONTRACTOR">
          <select style={S.input} value={form.contractor} onChange={e=>setForm({...form,contractor:e.target.value})}>
            <option value="">— choose —</option>
            {contractors.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
            {form.contractor && !contractors.some(c=>c.name===form.contractor) && <option value={form.contractor}>{form.contractor} (not in list)</option>}
          </select>
        </Field>
        <Field label="ADDRESS"><input style={S.input} value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="Street, City, State" /></Field>
        <Field label="TYPE OF WORK *  (each gets its own project #)">
          <div style={S.typeRow}>{WORK_TYPES.map(w=>
            <button key={w} className="trade" style={{...S.tradeBtn,...(form.workTypes.includes(w)?S.tradeOn:{})}} onClick={()=>toggleType(w)}>{form.workTypes.includes(w)?"✓ ":""}{w}</button>)}</div>
        </Field>
        {form.workTypes.length>0 && (
          <div style={S.numBox}>
            {form.workTypes.map(w=>(
              <Field key={w} label={`${w.toUpperCase()} PROJECT # *`}>
                <input style={S.input} value={form.projectNumbers[w]||""} onChange={e=>setNum(w,e.target.value)} placeholder={`e.g. 2026-${w[0]}114`} />
              </Field>
            ))}

        )}
        {editingId ? (
          <div style={{display:"flex",gap:8}}>
            <button className="primary" style={{...S.primaryBtn,flex:1}} onClick={saveEdit}>SAVE CHANGES</button>
            <button className="ghost" style={S.ghostBtn} onClick={resetForm}>Cancel</button>
          </div>
        ) : (
          <button className="primary" style={S.primaryBtn} onClick={create}>+ CREATE JOB</button>

            <div style={S.numList}>{p.workTypes.map(w=><span key={w} style={S.numChip}>{w}: <strong style={{color:"var(--ink)"}}>{(p.projectNumbers||{})[w]||"n/a"}</strong></span>)}</div>

          </div>
        ))}
      </>)}
    </div>
  );

      <div style={{...S.formCard, ...(editingId?{borderColor:"var(--amber)"}:{})}}>
        {editingId && <div style={S.editBanner}>Editing — changes apply everywhere this contractor is used.</div>}
        <Field label="COMPANY NAME *"><input style={S.input} value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. ABC Construction" /></Field>
        <Field label="CONTACTS  (name + phone)">
          {(form.contacts||[]).map(c=>(
            <div key={c.id} style={{display:"flex",gap:8,marginBottom:8}}>
              <input style={{...S.input,flex:2}} placeholder="Name / role" value={c.name} onChange={e=>setContact(c.id,"name",e.target.value)} />
              <input style={{...S.input,flex:2}} placeholder="Phone" value={c.phone} onChange={e=>setContact(c.id,"phone",e.target.value)} />
              <button className="danger" style={{...S.dangerBtn,padding:"8px 12px"}} onClick={()=>delContact(c.id)}>✕</button>
            </div>
          ))}
          <button className="ghost" style={S.ghostBtn} onClick={addContact}>+ Add contact</button>
        </Field>
        {editingId ? (
          <div style={{display:"flex",gap:8}}>
            <button className="primary" style={{...S.primaryBtn,flex:1}} onClick={saveEdit}>SAVE CHANGES</button>
            <button className="ghost" style={S.ghostBtn} onClick={resetForm}>Cancel</button>
          </div>
        ) : (
          <button className="primary" style={S.primaryBtn} onClick={create}>+ SAVE CONTRACTOR</button>
        )}
      </div>
      <SectionTitle>SAVED CONTRACTORS ({contractors.length})</SectionTitle>
      {contractors.length===0 && <div style={S.noNotes}>No contractors saved yet.</div>}
      {contractors.map(c=>(
        <div key={c.id} style={{...S.adminRow, ...(editingId===c.id?{borderColor:"var(--amber)"}:{})}}>
          <div style={{flex:1}}>
            <div style={S.adminName}>{c.name}</div>
            {(c.contacts||[]).length>0
              ? c.contacts.map(ct=><div key={ct.id} style={S.adminMeta}>{ct.name||"—"}{ct.phone?` · ${ct.phone}`:""}</div>)
              : <div style={S.adminMeta}>no contacts</div>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            <button className="ghost" style={S.editBtn} onClick={()=>startEdit(c)}>EDIT</button>
            <button className="danger" style={S.dangerBtn} onClick={()=>del(c.id)}>DELETE</button>
          </div>
        </div>
      ))}
    </div>
  );
}

// ---- Procurement (office side: update status, add notes) ----
function OfficeProcurement({ projects, procurement, saveProcurement, employees }) {
  const [filter,setFilter]=useState("active"); // active | all | received
  const [actOn,setActOn]=useState(null); // request id we're updating
  const [newStatus,setNewStatus]=useState(""); const [note,setNote]=useState("");
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState((employees||[]).length===0);

  const pName=(id)=>(projects.find(p=>p.id===id)||{}).name||"Unknown job";
  const list = (procurement||[]).slice().sort((a,b)=>b.id.localeCompare(a.id));
  const filtered = filter==="all" ? list : filter==="received" ? list.filter(r=>r.status==="Received") : list.filter(r=>r.status!=="Received");
  const counts = { active:list.filter(r=>r.status!=="Received").length, all:list.length, received:list.filter(r=>r.status==="Received").length };

  const statusColor=(s)=> s==="Received"?"var(--green)": s==="Ordered"?"var(--amber)":"var(--sub)";

  const openAct=(r)=>{ setActOn(r.id); setNewStatus(r.status==="Requested"?"Ordered":"Received"); setNote(""); setSel(""); setTyped(""); setUseTyped((employees||[]).length===0); };
  const cancel=()=>{ setActOn(null); setNote(""); };

  const apply=()=>{
    const by = useTyped?typed:sel;
    if(!by.trim()) return alert("Pick or type who's updating this.");
    if(!newStatus) return alert("Pick a new status.");
    const updated = (procurement||[]).map(r=> r.id===actOn ? {
      ...r,
      status:newStatus,
      history:[...(r.history||[]), { id:uid(), status:newStatus, by:by.trim(), note:note.trim(), ts:stamp() }]
    } : r);
    saveProcurement(updated);
    cancel();
  };

  return (
    <div>
      <SectionTitle>MATERIAL REQUESTS</SectionTitle>
      <div style={{...S.tradeRow,marginBottom:12}}>
        <button className="trade" style={{...S.tradeBtn,...(filter==="active"?S.tradeOn:{})}} onClick={()=>setFilter("active")}>Open ({counts.active})</button>
        <button className="trade" style={{...S.tradeBtn,...(filter==="received"?S.tradeOn:{})}} onClick={()=>setFilter("received")}>Received ({counts.received})</button>
        <button className="trade" style={{...S.tradeBtn,...(filter==="all"?S.tradeOn:{})}} onClick={()=>setFilter("all")}>All ({counts.all})</button>
      </div>
      {filtered.length===0 && <div style={S.noNotes}>No requests in this view.</div>}
      {filtered.map(r=>(
        <div key={r.id} style={S.noteCard}>
          <div style={S.noteHead}>
            <span style={S.noteAuthor}>{r.item} × {r.qty}</span>
            <span style={{...S.statusPill, color:statusColor(r.status), borderColor:statusColor(r.status)}}>{r.status}</span>
          </div>
          <div style={S.repProj}>{pName(r.projectId)} · {r.trade}</div>
          <div style={S.adminMeta}>requested by {r.name} · {r.ts}</div>
          {(r.history||[]).map(h=>(
            <div key={h.id} style={S.addendum}>
              <div style={S.addHead}>↳ {h.status} · {h.by} · {h.ts}</div>
              {h.note && <div style={S.addBody}>{h.note}</div>}
            </div>
          ))}
          {actOn===r.id ? (
            <div style={S.addForm}>
              <div style={{...S.formRow,marginBottom:8}}>
                <div style={{flex:1}}>
                  <label style={S.fieldLabel}>NEW STATUS</label>
                  <select style={S.input} value={newStatus} onChange={e=>setNewStatus(e.target.value)}>
                    <option value="Requested">Requested</option>
                    <option value="Ordered">Ordered</option>
                    <option value="Received">Received</option>
                  </select>
                </div>
              </div>
              <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
              <textarea style={{...S.textarea,marginTop:8}} rows={2} placeholder="Note (optional) — e.g. backordered, ETA Friday" value={note} onChange={e=>setNote(e.target.value)} />
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button className="primary" style={{...S.primaryBtn,flex:1,marginTop:0}} onClick={apply}>SAVE UPDATE</button>
                <button className="ghost" style={S.ghostBtn} onClick={cancel}>Cancel</button>
              </div>
            </div>
          ) : (
            r.status!=="Received" && <button className="ghost" style={S.ghostBtn} onClick={()=>openAct(r)}>+ Update status</button>
          )}
        </div>
      ))}
    </div>
  );
}


// ---- Office: review and approve / deny time off ----
function OfficeTimeOff({ pto, savePto, employees }) {
  const [filter,setFilter]=useState("pending"); // pending | approved | denied | cancelled | all
  const [actOn,setActOn]=useState(null); // {id, action: "Approved"|"Denied"|"Cancelled"|"edit"}
  const [note,setNote]=useState("");
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState((employees||[]).length===0);

  // edit-mode form state (only when actOn.action === "edit")
  const [editFrom,setEditFrom]=useState("");
  const [editTo,setEditTo]=useState("");
  const [editDayMode,setEditDayMode]=useState("full");
  const [editEmpName,setEditEmpName]=useState("");
  const [editNote,setEditNote]=useState("");

  const list = (pto||[]).slice().sort((a,b)=> a.from===b.from ? b.id.localeCompare(a.id) : (a.from<b.from?1:-1));
  const counts = {
    pending: list.filter(r=>r.status==="Pending").length,
    approved: list.filter(r=>r.status==="Approved").length,
    denied: list.filter(r=>r.status==="Denied").length,
    cancelled: list.filter(r=>r.status==="Cancelled").length,
    all: list.length,
  };
  const filtered = filter==="all" ? list : list.filter(r=> r.status.toLowerCase()===filter);

  const openDecide=(r,decision)=>{ // Approved | Denied | Cancelled
    setActOn({id:r.id, action:decision});
    setNote(""); setSel(""); setTyped(""); setUseTyped((employees||[]).length===0);
  };
  const openEdit=(r)=>{
    setActOn({id:r.id, action:"edit"});
    setEditFrom(r.from); setEditTo(r.to); setEditDayMode(r.dayMode||"full");
    setEditEmpName(r.name); setEditNote(r.note||"");
    setSel(""); setTyped(""); setUseTyped((employees||[]).length===0);
  };
  const cancelPanel=()=>{ setActOn(null); setNote(""); };

  const applyDecision=()=>{
    const by = useTyped?typed:sel;
    if(!by.trim()) return alert("Pick or type who's making the decision.");
    const updated = (pto||[]).map(r=> r.id===actOn.id ? {
      ...r,
      status: actOn.action,
      history:[...(r.history||[]), { id:uid(), status:actOn.action, by:by.trim(), note:note.trim(), ts:stamp() }]
    } : r);
    savePto(updated);
    cancelPanel();
  };

  const applyEdit=()=>{
    const by = useTyped?typed:sel;
    if(!by.trim()) return alert("Pick or type who's making this edit.");
    if(!editEmpName.trim()) return alert("Employee name is required.");
    if(!editFrom || !editTo) return alert("Start and end dates required.");
    const lo = editFrom<=editTo ? editFrom : editTo;
    const hi = editFrom<=editTo ? editTo : editFrom;
    const original = (pto||[]).find(r=>r.id===actOn.id);
    const summary = `Edited: ${original.name}→${editEmpName.trim()}, ${original.from}–${original.to}→${lo}–${hi}, ${original.dayMode||"full"}→${editDayMode}`;
    const updated = (pto||[]).map(r=> r.id===actOn.id ? {
      ...r,
      name: editEmpName.trim(),
      from: lo, to: hi,
      dayMode: editDayMode,
      note: editNote.trim(),
      history:[...(r.history||[]), { id:uid(), status:"Edited", by:by.trim(), note: summary + (note.trim()?` — ${note.trim()}`:""), ts:stamp() }]
    } : r);
    savePto(updated);
    cancelPanel();
  };

  const hardDelete=(r)=>{
    if(!confirm(`Permanently delete this request for ${r.name} (${r.from===r.to?fmtDate(r.from):fmtDate(r.from)+" → "+fmtDate(r.to)})?\n\nThis cannot be undone.`)) return;
    if(!confirm("Are you sure? There will be no record this request ever existed.")) return;
    savePto((pto||[]).filter(x=>x.id!==r.id));
  };

  return (
    <div>
      <SectionTitle>TIME OFF REQUESTS</SectionTitle>
      <div style={{...S.tradeRow, marginBottom:12}}>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="pending"?S.tradeOn:{})}} onClick={()=>setFilter("pending")}>Pending ({counts.pending})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="approved"?S.tradeOn:{})}} onClick={()=>setFilter("approved")}>Approved ({counts.approved})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="denied"?S.tradeOn:{})}} onClick={()=>setFilter("denied")}>Denied ({counts.denied})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="cancelled"?S.tradeOn:{})}} onClick={()=>setFilter("cancelled")}>Cancelled ({counts.cancelled})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="all"?S.tradeOn:{})}} onClick={()=>setFilter("all")}>All ({counts.all})</button>
      </div>
      {filtered.length===0 && <div style={S.noNotes}>No requests in this view.</div>}
      {filtered.map(r=>{
        const color = r.status==="Approved"?"var(--green)": r.status==="Denied"?"var(--red)": r.status==="Cancelled"?"var(--sub)":"var(--amber)";
        const isEditing = actOn && actOn.id===r.id && actOn.action==="edit";
        const isDeciding = actOn && actOn.id===r.id && actOn.action!=="edit";
        return (
          <div key={r.id} style={S.noteCard}>
            <div style={S.noteHead}>
              <span style={S.noteAuthor}>{r.name}</span>
              <span style={{...S.statusPill, color, borderColor:color}}>{r.status}</span>
            </div>
            <div style={S.adminMeta}>
              {r.from===r.to ? fmtDate(r.from) : `${fmtDate(r.from)} → ${fmtDate(r.to)}`} · {ptoDayLabel(r)}
            </div>
            {r.note && <div style={{...S.noteBody, marginTop:6}}>{r.note}</div>}
            <div style={S.adminMeta}>requested {r.ts}</div>
            {(r.history||[]).map(h=>(
              <div key={h.id} style={S.addendum}>
                <div style={S.addHead}>↳ {h.status} · {h.by} · {h.ts}</div>
                {h.note && <div style={S.addBody}>{h.note}</div>}
              </div>
            ))}

            {isDeciding && (
              <div style={S.addForm}>
                <div style={{fontSize:13, color, fontWeight:600, marginBottom:8}}>
                  {actOn.action==="Approved" && "Approving this request"}
                  {actOn.action==="Denied" && "Denying this request"}
                  {actOn.action==="Cancelled" && "Cancelling this request"}
                </div>
                <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
                <textarea style={{...S.textarea, marginTop:8}} rows={2} placeholder="Note (optional)" value={note} onChange={e=>setNote(e.target.value)} />
                <div style={{display:"flex", gap:8, marginTop:8}}>
                  <button className="primary" style={{...S.primaryBtn, flex:1, marginTop:0, background:color, color: actOn.action==="Cancelled"?"#fff":"#1a1a1a"}} onClick={applyDecision}>
                    CONFIRM {actOn.action.toUpperCase()}
                  </button>
                  <button className="ghost" style={S.ghostBtn} onClick={cancelPanel}>Back</button>
                </div>
              </div>
            )}

            {isEditing && (
              <div style={S.addForm}>
                <div style={{fontSize:13, color:"var(--amber)", fontWeight:600, marginBottom:8}}>Editing this request</div>
                <label style={S.fieldLabel}>EMPLOYEE</label>
                <input style={S.input} value={editEmpName} onChange={e=>setEditEmpName(e.target.value)} />
                <div style={{...S.formRow, marginTop:8}}>
                  <div style={{flex:1}}><label style={S.fieldLabel}>FROM</label><input type="date" style={S.input} value={editFrom} onChange={e=>setEditFrom(e.target.value)} /></div>
                  <div style={{flex:1}}><label style={S.fieldLabel}>TO</label><input type="date" style={S.input} value={editTo} onChange={e=>setEditTo(e.target.value)} /></div>
                </div>
                <div style={{marginTop:8}}>
                  <label style={S.fieldLabel}>DAY MODE</label>
                  <div style={S.tradeRow}>
                    <button className="trade" style={{...S.tradeBtn, ...(editDayMode==="full"?S.tradeOn:{})}} onClick={()=>setEditDayMode("full")}>Full days</button>
                    <button className="trade" style={{...S.tradeBtn, ...(editDayMode==="am"?S.tradeOn:{})}} onClick={()=>setEditDayMode("am")}>½ AM</button>
                    <button className="trade" style={{...S.tradeBtn, ...(editDayMode==="pm"?S.tradeOn:{})}} onClick={()=>setEditDayMode("pm")}>½ PM</button>
                  </div>
                </div>
                <div style={{marginTop:8}}>
                  <label style={S.fieldLabel}>NOTE</label>
                  <textarea style={S.textarea} rows={2} value={editNote} onChange={e=>setEditNote(e.target.value)} />
                </div>
                <div style={{marginTop:8, borderTop:`1px solid var(--line)`, paddingTop:8}}>
                  <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
                  <textarea style={{...S.textarea, marginTop:8}} rows={2} placeholder="Reason for edit (optional)" value={note} onChange={e=>setNote(e.target.value)} />
                </div>
                <div style={{display:"flex", gap:8, marginTop:8}}>
                  <button className="primary" style={{...S.primaryBtn, flex:1, marginTop:0}} onClick={applyEdit}>SAVE EDIT</button>
                  <button className="ghost" style={S.ghostBtn} onClick={cancelPanel}>Cancel</button>
                </div>
              </div>
            )}

            {!actOn || actOn.id!==r.id ? (
              <div style={{display:"flex", gap:8, marginTop:8, flexWrap:"wrap"}}>
                {r.status==="Pending" && (
                  <>
                    <button className="primary" style={{...S.primaryBtn, flex:"1 1 120px", marginTop:0, background:"var(--green)"}} onClick={()=>openDecide(r,"Approved")}>✓ APPROVE</button>
                    <button className="danger" style={{...S.dangerBtn, flex:"1 1 120px", fontSize:13}} onClick={()=>openDecide(r,"Denied")}>✕ DENY</button>
                  </>
                )}
                {r.status!=="Cancelled" && (
                  <button className="ghost" style={S.editBtn} onClick={()=>openDecide(r,"Cancelled")}>CANCEL</button>
                )}
                <button className="ghost" style={S.editBtn} onClick={()=>openEdit(r)}>EDIT</button>
                <button className="danger" style={{...S.dangerBtn, fontSize:12}} onClick={()=>hardDelete(r)}>DELETE</button>
              </div>
            ) : null}
          </div>
        );
      })}
    </div>
  );
}


function Reports({ projects, entries, procurement }) {
  const [mode,setMode]=useState("single"); // single | range
  const [day,setDay]=useState(todayKey());
  const [from,setFrom]=useState(todayKey());
  const [to,setTo]=useState(todayKey());

  const inRange=(d)=>{
    if(mode==="single") return d===day;
    const lo=from<=to?from:to, hi=from<=to?to:from;
    return d>=lo && d<=hi;
  };
  const rangeLabel = mode==="single" ? day : `${from<=to?from:to} → ${from<=to?to:from}`;

  const selEntries=entries.filter(e=>inRange(e.day));
  const notes=selEntries.filter(e=>e.type==="note").sort((a,b)=>a.id.localeCompare(b.id));
  const checks=selEntries.filter(e=>e.type==="check"||e.type==="equip").sort((a,b)=>a.id.localeCompare(b.id));
  const procReqs = (procurement||[]).filter(r=>inRange(r.day)).sort((a,b)=>a.id.localeCompare(b.id));
  const pName=(id)=>(projects.find(p=>p.id===id)||{}).name||"Unknown job";
  const pNum=(id,trade)=>((projects.find(p=>p.id===id)||{}).projectNumbers||{})[trade]||"n/a";
  const groups={}; checks.forEach(c=>{ const k=c.projectId+"|"+c.trade; (groups[k]=groups[k]||[]).push(c); });
  // procurement grouped by job → trade
  const procGroups={}; procReqs.forEach(r=>{ const k=r.projectId+"|"+r.trade; (procGroups[k]=procGroups[k]||[]).push(r); });

  return (
    <div>
      <SectionTitle>DAILY ACTIVITY REPORT</SectionTitle>
      <div style={S.formCard}>
        <div style={{...S.tradeRow,marginBottom:14}}>
          <button className="trade" style={{...S.tradeBtn,...(mode==="single"?S.tradeOn:{})}} onClick={()=>setMode("single")}>Single day</button>
          <button className="trade" style={{...S.tradeBtn,...(mode==="range"?S.tradeOn:{})}} onClick={()=>setMode("range")}>Date range</button>
        </div>
        {mode==="single" ? (
          <Field label="DATE"><input type="date" style={S.input} value={day} onChange={e=>setDay(e.target.value)} /></Field>
        ) : (
          <div style={S.formRow}>
            <Field label="FROM"><input type="date" style={S.input} value={from} onChange={e=>setFrom(e.target.value)} /></Field>
            <Field label="TO"><input type="date" style={S.input} value={to} onChange={e=>setTo(e.target.value)} /></Field>
          </div>
        )}
        <div style={S.reportStats}>
          <Stat n={notes.length} label="Notes logged" />
          <Stat n={checks.length} label="Items checked" />
          <Stat n={new Set(selEntries.map(e=>e.name)).size} label="Crew active" />
        </div>
        <button className="primary" style={S.primaryBtn} onClick={()=>window.print()}>🖨 PRINT / SAVE AS PDF</button>
        <p style={S.hint}>Opens your device's print dialog — choose a printer, or "Save as PDF."</p>
      </div>

      {/* On-screen report */}
      <SectionTitle>NOTES — {rangeLabel}</SectionTitle>
      {notes.length===0 && <div style={S.noNotes}>No notes in this range.</div>}
      {notes.map(n=>(
        <div key={n.id} style={S.noteCard}>
          <div style={S.noteHead}><span style={S.noteAuthor}>{n.name}</span><span style={S.noteTs}>{n.ts}</span></div>
          <div style={S.repProj}>{pName(n.projectId)} · {n.trade} #{pNum(n.projectId,n.trade)}</div>
          {(n.work || n.text) && <div style={S.noteBody}>{n.work || n.text}</div>}
          {(n.todos||[]).length>0 && (
            <div style={S.noteSubsection}>
              <div style={S.noteSubHead}>Still needs to be done</div>
              {n.todos.map(t=>(
                <div key={t.id} style={S.noteItemLine}>
                  <span style={{...S.noteItemMark, ...(t.closedTs?{background:"var(--green)",borderColor:"var(--green)",color:"#1a1a1a"}:{})}}>{t.closedTs?"✓":""}</span>
                  <div style={{flex:1}}>
                    <div style={{...S.noteItemText, ...(t.closedTs?{textDecoration:"line-through",color:"var(--sub)"}:{})}}>{t.text}</div>
                    {t.closedTs && <div style={S.noteItemStamp}>done by {t.closedBy} · {t.closedTs}</div>}
                  </div>
                </div>
              ))}
            </div>
          )}
          {(n.materials||[]).length>0 && (
            <div style={S.noteSubsection}>
              <div style={S.noteSubHead}>Materials needed next trip</div>
              {n.materials.map(m=>(
                <div key={m.id} style={S.noteItemLine}>
                  <span style={{...S.noteItemMark, ...(m.closedTs?{background:"var(--green)",borderColor:"var(--green)",color:"#1a1a1a"}:{})}}>{m.closedTs?"✓":""}</span>
                  <div style={{flex:1}}>
                    <div style={{...S.noteItemText, ...(m.closedTs?{textDecoration:"line-through",color:"var(--sub)"}:{})}}>{m.text}</div>
                    {m.closedTs && <div style={S.noteItemStamp}>brought by {m.closedBy} · {m.closedTs}</div>}
                  </div>
                </div>
              ))}
            </div>
          )}
          {(n.addenda||[]).map(a=><div key={a.id} style={S.addendum}><div style={S.addHead}>↳ ADDENDUM · {a.name} · {a.ts}</div><div style={S.addBody}>{a.text}</div></div>)}
        </div>
      ))}
      <SectionTitle>CHECKLIST ACTIVITY — {rangeLabel}</SectionTitle>
      {Object.keys(groups).length===0 && <div style={S.noNotes}>No checklist activity in this range.</div>}
      {Object.entries(groups).map(([k,list])=>{ const [pid,trade]=k.split("|"); return (
        <div key={k} style={S.noteCard}>
          <div style={S.repProj}>{pName(pid)} · {trade} #{pNum(pid,trade)}</div>
          {list.map(c=>(
            <div key={c.id} style={S.repCheck}>
              {c.status==="na" ? "—" : "✓"} {c.type==="equip"?c.equipName:c.item}
              {c.status==="na" && <span style={{color:"var(--sub)", fontWeight:600, marginLeft:6}}>(N/A)</span>}
              <span style={S.noteTs}> — {c.name}, {c.ts}</span>
              {(c.model||c.serial) && <div style={S.equipVals}>Model: {c.model||"—"} · Serial: {c.serial||"—"}</div>}
              {c.value && <div style={S.equipVals}>Answer: {c.value}</div>}
            </div>
          ))}
        </div>
      );})}

      <SectionTitle>MATERIAL REQUESTS — {rangeLabel}</SectionTitle>
      {Object.keys(procGroups).length===0 && <div style={S.noNotes}>No material requests in this range.</div>}
      {Object.entries(procGroups).map(([k,list])=>{ const [pid,trade]=k.split("|"); return (
        <div key={k} style={S.noteCard}>
          <div style={S.repProj}>{pName(pid)} · {trade} #{pNum(pid,trade)}</div>
          {list.map(r=>(
            <div key={r.id} style={S.repCheck}>
              {r.item} × {r.qty}
              <span style={{...S.statusPill, marginLeft:8, color: r.status==="Received"?"var(--green)":r.status==="Ordered"?"var(--amber)":"var(--sub)", borderColor: r.status==="Received"?"var(--green)":r.status==="Ordered"?"var(--amber)":"var(--sub)"}}>{r.status}</span>
              <span style={S.noteTs}> — {r.name}, {r.ts}</span>
            </div>
          ))}
        </div>
      );})}

      {/* Print-only clean layout */}
      <div className="print-area" aria-hidden="true">
        <div className="print-header">
          <div className="print-company">{COMPANY_NAME}</div>
          <div className="print-title">Daily Activity Report</div>
          <div className="print-dates">{rangeLabel}</div>
        </div>

        <div className="print-summary">
          Notes: {notes.length} &nbsp;·&nbsp; Items checked: {checks.length} &nbsp;·&nbsp; Crew active: {new Set(selEntries.map(e=>e.name)).size}
        </div>

        <h2 className="print-section">Notes</h2>
        {notes.length===0 && <div className="print-empty">No notes in this range.</div>}
        {notes.map(n=>(
          <div key={n.id} className="print-block">
            <div className="print-block-head">{pName(n.projectId)} — {n.trade} #{pNum(n.projectId,n.trade)}</div>
            <div className="print-meta">{n.name} · {n.ts}</div>
            {(n.work || n.text) && <div className="print-body">{n.work || n.text}</div>}
            {(n.todos||[]).length>0 && (
              <div className="print-sublist">
                <div className="print-sublist-head">Still needs to be done:</div>
                {n.todos.map(t=>(
                  <div key={t.id} className="print-sublist-item">{t.closedTs?"✓ ":"☐ "}{t.text}{t.closedTs?` — done by ${t.closedBy}, ${t.closedTs}`:""}</div>
                ))}
              </div>
            )}
            {(n.materials||[]).length>0 && (
              <div className="print-sublist">
                <div className="print-sublist-head">Materials needed next trip:</div>
                {n.materials.map(m=>(
                  <div key={m.id} className="print-sublist-item">{m.closedTs?"✓ ":"☐ "}{m.text}{m.closedTs?` — brought by ${m.closedBy}, ${m.closedTs}`:""}</div>
                ))}
              </div>
            )}
            {(n.addenda||[]).map(a=>(
              <div key={a.id} className="print-addendum">↳ Addendum · {a.name} · {a.ts}<br/>{a.text}</div>
            ))}
          </div>
        ))}

        <h2 className="print-section">Checklist Activity</h2>
        {Object.keys(groups).length===0 && <div className="print-empty">No checklist activity in this range.</div>}
        {Object.entries(groups).map(([k,list])=>{ const [pid,trade]=k.split("|"); return (
          <div key={k} className="print-block">
            <div className="print-block-head">{pName(pid)} — {trade} #{pNum(pid,trade)}</div>
            {list.map(c=>(
              <div key={c.id} className="print-check">
                {c.status==="na" ? "—" : "✓"} {c.type==="equip"?c.equipName:c.item}{c.status==="na" ? " (N/A)" : ""} — {c.name}, {c.ts}
                {(c.model||c.serial) && <div className="print-equip">Model: {c.model||"—"} · Serial: {c.serial||"—"}</div>}
                {c.value && <div className="print-equip">Answer: {c.value}</div>}
              </div>
            ))}
          </div>
        );})}

        <h2 className="print-section">Material Requests</h2>
        {Object.keys(procGroups).length===0 && <div className="print-empty">No material requests in this range.</div>}
        {Object.entries(procGroups).map(([k,list])=>{ const [pid,trade]=k.split("|"); return (
          <div key={k} className="print-block">
            <div className="print-block-head">{pName(pid)} — {trade} #{pNum(pid,trade)}</div>
            {list.map(r=>(
              <div key={r.id} className="print-check">
                {r.item} × {r.qty} — [{r.status}] — {r.name}, {r.ts}
              </div>
            ))}
          </div>
        );})}
      </div>
    </div>
  );
}

function Stat({ n, label }) { return <div style={S.stat}><div style={S.statN}>{n}</div><div style={S.statL}>{label}</div></div>; }
function SectionTitle({ children }) { return <h2 style={S.sectionTitle}>{children}</h2>; }
function Field({ label, children }) { return <div style={{marginBottom:14,flex:1}}><label style={S.fieldLabel}>{label}</label>{children}</div>; }
function Empty({ msg }) { return <main style={S.main}><div style={S.noNotes}>{msg}</div></main>; }
