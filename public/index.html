// ---- Office: view a job's checklists, with uncheck capability ----
function OfficeChecklistView({ project, entries, saveEntries, employees }) {
  const [trade,setTrade]=useState(project.workTypes[0]||"Plumbing");
  // Recompute derived state for this trade
  const sections = CHECKLISTS[trade] || [];
  const recs = entries.filter(e=>e.type==="check"&&e.projectId===project.id&&e.trade===trade);
  const historyByItem = {};
  recs.forEach(r=>{ (historyByItem[r.item]=historyByItem[r.item]||[]).push(r); });
  Object.keys(historyByItem).forEach(k=>historyByItem[k].sort((a,b)=>a.id.localeCompare(b.id)));
  const stateByItem = {};
  Object.entries(historyByItem).forEach(([label,list])=>{
    const latest = list[list.length-1];
    const firstDone = list.find(r=>r.status==="done") || null;
    const lastDone = [...list].reverse().find(r=>r.status==="done");
    stateByItem[label] = { status:latest.status, latest, firstDone, lastDone, history:list };
  });

  // extra equipment
  const allExtraEquipRecs = entries.filter(e=>e.type==="equip"&&e.projectId===project.id&&e.trade===trade);
  const extraEquipByName = {};
  allExtraEquipRecs.forEach(eq=>{ (extraEquipByName[eq.equipName]=extraEquipByName[eq.equipName]||[]).push(eq); });
  const extraEquip = Object.entries(extraEquipByName).map(([name,list])=>{
    list.sort((a,b)=>a.id.localeCompare(b.id));
    const latest = list[list.length-1];
    const first = list[0];
    return { ...latest, equipName:name, firstName:first.name, firstTs:first.ts, history:list };
  });

  const [uncheckingLabel,setUncheckingLabel]=useState(null);
  const [reason,setReason]=useState("");
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState((employees||[]).length===0);

  const beginUncheck = (label)=>{ setUncheckingLabel(label); setReason(""); setSel(""); setTyped(""); setUseTyped((employees||[]).length===0); };
  const cancelUncheck = ()=>{ setUncheckingLabel(null); setReason(""); };
  const confirmUncheck = ()=>{
    const name = useTyped?typed:sel;
    if(!name.trim()) return alert("Pick or type who's unchecking.");
    const rec = {
      id:uid(), type:"check", projectId:project.id, trade,
      item:uncheckingLabel, name:name.trim(), ts:stamp(), day:todayKey(),
      status:"unchecked", reason:reason.trim(),
    };
    saveEntries([rec, ...entries]);
    cancelUncheck();
  };

  // Render a row showing the current state plus history; only show uncheck button for items that are currently "done" or "na"
  const renderRow = (it, indent=false)=>{
    const label = itemLabel(it);
    const st = stateByItem[label];
    if(!st) return null; // not yet acted on, nothing to show on the office side
    const isDone = st.status==="done";
    const isNa = st.status==="na";
    const isUnchecked = st.status==="unchecked";
    const doneRecs = st.history.filter(r=>r.status==="done");
    const numEdits = Math.max(0, doneRecs.length - 1);
    return (
      <div key={label} style={{...S.officeCheckRow, ...(indent?{marginLeft:18,borderLeft:`3px solid var(--line)`,paddingLeft:10}:{})}}>
        <div style={{flex:1}}>
          <div style={S.officeCheckLabel}>
            {isDone && "✓ "}
            {isNa && "— "}
            {isUnchecked && "○ "}
            {label}
            {isUnchecked && <span style={{color:"var(--sub)", fontWeight:500, marginLeft:8, fontSize:12}}>(unchecked)</span>}
          </div>
          {isDone && st.firstDone && <div style={S.officeCheckStamp}>✓ {st.firstDone.name} · {st.firstDone.ts}</div>}
          {isNa && <div style={S.officeCheckStamp}>N/A — {st.latest.name} · {st.latest.ts}</div>}
          {isDone && st.lastDone && (st.lastDone.model || st.lastDone.serial) && (
            <div style={S.equipVals}>Model: {st.lastDone.model||"—"} · Serial: {st.lastDone.serial||"—"}</div>
          )}
          {isDone && st.lastDone && st.lastDone.value && <div style={S.equipVals}>{st.lastDone.value}</div>}
          {numEdits>0 && doneRecs.slice(1).map(e=>(
            <div key={e.id} style={S.editAudit}>↳ model/serial edited by {e.name} · {e.ts} → Model: {e.model||"—"} · Serial: {e.serial||"—"}</div>
          ))}
          {isUnchecked && st.firstDone && (
            <div style={S.uncheckTrail}>
              <div style={S.uncheckLine}>↶ Was checked by {st.firstDone.name} on {st.firstDone.ts}</div>
              <div style={S.uncheckLine}>↶ Unchecked by {st.latest.name} on {st.latest.ts}{st.latest.reason?` — "${st.latest.reason}"`:""}</div>
            </div>
          )}
        </div>
        {(isDone || isNa) && uncheckingLabel!==label && (
          <button className="ghost" style={S.editBtn} onClick={()=>beginUncheck(label)}>UNCHECK</button>
        )}
        {uncheckingLabel===label && (
          <div style={{flexBasis:"100%", marginTop:10, padding:10, background:"var(--bg)", borderRadius:8, border:"1px solid var(--line)"}}>
            <div style={{fontSize:13, color:"var(--amber)", fontWeight:600, marginBottom:8}}>Unchecking: {label}</div>
            <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
            <textarea style={{...S.textarea,marginTop:8}} rows={2} placeholder="Reason (optional)" value={reason} onChange={e=>setReason(e.target.value)} />
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button className="primary" style={{...S.primaryBtn,flex:1,marginTop:0}} onClick={confirmUncheck}>CONFIRM UNCHECK</button>
              <button className="ghost" style={S.ghostBtn} onClick={cancelUncheck}>Cancel</button>
            </div>
          </div>
        )}
      </div>
    );
  };

  // For each section, collect items that have any state (acted on). Show the parent + its done subs.
  const renderSection = (sec)=>{
    const rows = [];
    sec.items.forEach(it=>{
      const lbl = itemLabel(it);
      const st = stateByItem[lbl];
      if(st){
        rows.push(renderRow(it));
        const subs = itemSubs(it);
        if(subs && st.status==="done"){
          subs.forEach(si=>{
            if(stateByItem[itemLabel(si)]) rows.push(renderRow(si, true));
          });
        }
      }
    });
    if(rows.length===0) return null;
    return (
      <div key={sec.section} style={{marginBottom:14}}>
        <div style={S.secHead}>{sec.section}</div>
        <div>{rows}</div>
      </div>
    );
  };

  const renderedSections = sections.map(renderSection).filter(Boolean);
  const hasAnyItems = renderedSections.length>0 || extraEquip.length>0;

  return (
    <div style={S.officeChecklistPanel}>
      {/* Trade picker */}
      <div style={{...S.tradeRow, marginBottom:12}}>
        {project.workTypes.map(t=>(
          <button key={t} className="trade" style={{...S.tradeBtn,...(trade===t?S.tradeOn:{})}} onClick={()=>setTrade(t)}>{t}</button>
        ))}
      </div>
      {!hasAnyItems && <div style={S.noNotes}>No checklist activity yet for {trade}.</div>}
      {renderedSections}
      {extraEquip.length>0 && (
        <div style={{marginBottom:14}}>
          <div style={S.secHead}>Additional Equipment</div>
          {extraEquip.map(eq=>{
            const edits = (eq.history||[]).slice(1);
            return (
              <div key={eq.equipName} style={S.officeCheckRow}>
                <div style={{flex:1}}>
                  <div style={S.officeCheckLabel}>✓ {eq.equipName}</div>
                  <div style={S.officeCheckStamp}>✓ {eq.firstName} · {eq.firstTs}</div>
                  <div style={S.equipVals}>Model: {eq.model||"—"} · Serial: {eq.serial||"—"}</div>
                  {edits.map(e=>(
                    <div key={e.id} style={S.editAudit}>↳ model/serial edited by {e.name} · {e.ts} → Model: {e.model||"—"} · Serial: {e.serial||"—"}</div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ProjectsAdmin({ projects, saveProjects, contractors, entries, saveEntries, employees }) {
  const blank={ name:"", address:"", contractor:"", workTypes:[], projectNumbers:{} };
  const [form,setForm]=useState(blank);
  const [editingId,setEditingId]=useState(null); // null = creating
  const [showRemoved,setShowRemoved]=useState(false);
  const [viewingChecklistsId,setViewingChecklistsId]=useState(null); // project id whose checklists are open
  const [search,setSearch]=useState("");
  const matchProject = (p, q)=>{
    if(!q) return true;
    const needle = q.toLowerCase();
    if((p.name||"").toLowerCase().includes(needle)) return true;
    if((p.address||"").toLowerCase().includes(needle)) return true;
    if((p.contractor||"").toLowerCase().includes(needle)) return true;
    const nums = p.projectNumbers || {};
    for(const k of Object.keys(nums)){
      if(String(nums[k]||"").toLowerCase().includes(needle)) return true;
    }
    return false;
  };
  const q = search.trim();
  const active=projects.filter(p=>!p.removed).filter(p=>matchProject(p,q)).slice().sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:"base"}));
  const removed=projects.filter(p=>p.removed).slice().sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:"base"}));

  const toggleType=(w)=>setForm(f=>{
    const has=f.workTypes.includes(w);
    // guard: removing a trade that has logged activity
    if(has && editingId){
      const hasActivity=(entries||[]).some(e=>e.projectId===editingId && e.trade===w && (e.type==="check"||e.type==="equip"||e.type==="note"));
      if(hasActivity && !confirm(`${w} already has checklist or note activity logged on this job. Remove it anyway? (The logged data stays in the system but the trade won't show on the job.)`)) return f;
    }
    const workTypes=has?f.workTypes.filter(x=>x!==w):[...f.workTypes,w];
    const projectNumbers={...f.projectNumbers}; if(has) delete projectNumbers[w];
    return {...f,workTypes,projectNumbers};
  });
  const setNum=(w,v)=>setForm(f=>({...f,projectNumbers:{...f.projectNumbers,[w]:v}}));

  const resetForm=()=>{ setForm(blank); setEditingId(null); };

  const startEdit=(p)=>{
    setEditingId(p.id);
    setForm({ name:p.name, address:p.address||"", contractor:p.contractor||"", workTypes:[...p.workTypes], projectNumbers:{...(p.projectNumbers||{})} });
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const validate=()=>{
    if(!form.name.trim()){ alert("Job name is required."); return null; }
    if(form.workTypes.length===0){ alert("Pick at least one type of work."); return null; }
    for(const w of form.workTypes){ if(!(form.projectNumbers[w]||"").trim()){ alert(`Enter a project number for ${w}.`); return null; } }
    const cleanNums={}; form.workTypes.forEach(w=>cleanNums[w]=form.projectNumbers[w].trim());
    return { ...form, name:form.name.trim(), projectNumbers:cleanNums };
  };

  const create=()=>{ const v=validate(); if(!v) return; saveProjects([{...v,id:uid(),removed:false,created:stamp()},...projects]); resetForm(); };
  const saveEdit=()=>{ const v=validate(); if(!v) return; saveProjects(projects.map(p=>p.id===editingId?{...p,...v}:p)); resetForm(); };

  const remove=(id)=>{ if(!confirm("Remove this project? It moves to the Removed list (data kept).")) return; saveProjects(projects.map(p=>p.id===id?{...p,removed:true}:p)); if(editingId===id) resetForm(); };
  const restore=(id)=> saveProjects(projects.map(p=>p.id===id?{...p,removed:false}:p));

  return (
    <div>
      <SectionTitle>{editingId?"EDIT JOB":"SET UP A JOB"}</SectionTitle>
      <div style={{...S.formCard, ...(editingId?{borderColor:"var(--amber)"}:{})}}>
        {editingId && <div style={S.editBanner}>Editing an existing job — changes apply everywhere.</div>}
        <Field label="JOB NAME *"><input style={S.input} value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Maple Street Townhomes" /></Field>
        <Field label="CONTRACTOR">
          <select style={S.input} value={form.contractor} onChange={e=>setForm({...form,contractor:e.target.value})}>
            <option value="">— choose —</option>
            {contractors.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
            {form.contractor && !contractors.some(c=>c.name===form.contractor) && <option value={form.contractor}>{form.contractor} (not in list)</option>}
          </select>
        </Field>
        <Field label="ADDRESS"><input style={S.input} value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="Street, City, State" /></Field>
        <Field label="TYPE OF WORK *  (each gets its own project #)">
          <div style={S.typeRow}>{WORK_TYPES.map(w=>
            <button key={w} className="trade" style={{...S.tradeBtn,...(form.workTypes.includes(w)?S.tradeOn:{})}} onClick={()=>toggleType(w)}>{form.workTypes.includes(w)?"✓ ":""}{w}</button>)}</div>
        </Field>
        {form.workTypes.length>0 && (
          <div style={S.numBox}>
            {form.workTypes.map(w=>(
              <Field key={w} label={`${w.toUpperCase()} PROJECT # *`}>
                <input style={S.input} value={form.projectNumbers[w]||""} onChange={e=>setNum(w,e.target.value)} placeholder={`e.g. 2026-${w[0]}114`} />
              </Field>
            ))}
          </div>
        )}
        {editingId ? (
          <div style={{display:"flex",gap:8}}>
            <button className="primary" style={{...S.primaryBtn,flex:1}} onClick={saveEdit}>SAVE CHANGES</button>
            <button className="ghost" style={S.ghostBtn} onClick={resetForm}>Cancel</button>
          </div>
        ) : (
          <button className="primary" style={S.primaryBtn} onClick={create}>+ CREATE JOB</button>
        )}
      </div>
      <SectionTitle>ACTIVE JOBS ({active.length}{q?` of ${projects.filter(p=>!p.removed).length}`:""})</SectionTitle>
      <div style={S.searchWrap}>
        <input
          style={S.searchInput}
          placeholder="Search job name, address, contractor, or project #…"
          value={search}
          onChange={e=>setSearch(e.target.value)}
        />
        {search && <button style={S.searchClear} onClick={()=>setSearch("")} title="Clear">✕</button>}
      </div>
      {active.length===0 && (q ? <div style={S.noNotes}>No active jobs match "{q}".</div> : <div style={S.noNotes}>No active jobs.</div>)}
      {active.map(p=>(
        <div key={p.id}>
          <div style={{...S.adminRow, ...(editingId===p.id || viewingChecklistsId===p.id?{borderColor:"var(--amber)"}:{})}}>
            <div style={{flex:1}}>
              <div style={S.adminName}>{p.name}</div>
              <div style={S.adminMeta}>{p.contractor||"—"}</div>
              <div style={S.adminAddr}>{p.address||"—"}</div>
              <div style={S.numList}>{p.workTypes.map(w=><span key={w} style={S.numChip}>{w}: <strong style={{color:"var(--ink)"}}>{(p.projectNumbers||{})[w]||"n/a"}</strong></span>)}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <button className="ghost" style={S.editBtn} onClick={()=>setViewingChecklistsId(viewingChecklistsId===p.id?null:p.id)}>
                {viewingChecklistsId===p.id?"CLOSE":"CHECKLISTS"}
              </button>
              <button className="ghost" style={S.editBtn} onClick={()=>startEdit(p)}>EDIT</button>
              <button className="danger" style={S.dangerBtn} onClick={()=>remove(p.id)}>REMOVE</button>
            </div>
          </div>
          {viewingChecklistsId===p.id && (
            <OfficeChecklistView project={p} entries={entries} saveEntries={saveEntries} employees={employees} />
          )}
        </div>
      ))}
      {removed.length>0 && (<>
        <button className="ghost" style={{...S.ghostBtn,marginTop:18}} onClick={()=>setShowRemoved(!showRemoved)}>{showRemoved?"Hide":"Show"} removed jobs ({removed.length})</button>
        {showRemoved && removed.map(p=>(
          <div key={p.id} style={{...S.adminRow,opacity:.6}}>
            <div style={{flex:1}}><div style={S.adminName}>{p.name}</div><div style={S.adminMeta}>removed</div></div>
            <button className="ghost" style={S.ghostBtn} onClick={()=>restore(p.id)}>RESTORE</button>
          </div>
        ))}
      </>)}
    </div>
  );
}

function ContractorsAdmin({ contractors, saveContractors }) {
  const blank={ name:"", contacts:[] };
  const [form,setForm]=useState(blank);
  const [editingId,setEditingId]=useState(null);

  const addContact=()=>setForm(f=>({...f,contacts:[...(f.contacts||[]),{id:uid(),name:"",phone:""}]}));
  const setContact=(id,key,val)=>setForm(f=>({...f,contacts:f.contacts.map(c=>c.id===id?{...c,[key]:val}:c)}));
  const delContact=(id)=>setForm(f=>({...f,contacts:f.contacts.filter(c=>c.id!==id)}));
  const resetForm=()=>{ setForm(blank); setEditingId(null); };

  const validate=()=>{
    if(!form.name.trim()){ alert("Company name is required."); return null; }
    const cleanContacts=(form.contacts||[]).filter(c=>c.name.trim()||c.phone.trim()).map(c=>({id:c.id,name:c.name.trim(),phone:c.phone.trim()}));

  const saveEdit=()=>{ const v=validate(); if(!v) return; saveContractors(contractors.map(c=>c.id===editingId?{...c,...v}:c)); resetForm(); };
  const del=(id)=>{ if(confirm("Remove this contractor from the list?")){ saveContractors(contractors.filter(c=>c.id!==id)); if(editingId===id) resetForm(); } };

  return (
    <div>
      <SectionTitle>{editingId?"EDIT CONTRACTOR":"ADD CONTRACTOR"}</SectionTitle>
      <div style={{...S.formCard, ...(editingId?{borderColor:"var(--amber)"}:{})}}>

          {(form.contacts||[]).map(c=>(

              <input style={{...S.input,flex:2}} placeholder="Phone" value={c.phone} onChange={e=>setContact(c.id,"phone",e.target.value)} />
              <button className="danger" style={{...S.dangerBtn,padding:"8px 12px"}} onClick={()=>delContact(c.id)}>✕</button>
            </div>
          ))}
          <button className="ghost" style={S.ghostBtn} onClick={addContact}>+ Add contact</button>
        </Field>
        {editingId ? (
          <div style={{display:"flex",gap:8}}>
            <button className="primary" style={{...S.primaryBtn,flex:1}} onClick={saveEdit}>SAVE CHANGES</button>
            <button className="ghost" style={S.ghostBtn} onClick={resetForm}>Cancel</button>
          </div>
        ) : (
          <button className="primary" style={S.primaryBtn} onClick={create}>+ SAVE CONTRACTOR</button>
        )}
      </div>
      <SectionTitle>SAVED CONTRACTORS ({contractors.length})</SectionTitle>
      {contractors.length===0 && <div style={S.noNotes}>No contractors saved yet.</div>}
      {contractors.slice().sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:"base"})).map(c=>(
        <div key={c.id} style={{...S.adminRow, ...(editingId===c.id?{borderColor:"var(--amber)"}:{})}}>
          <div style={{flex:1}}>
            <div style={S.adminName}>{c.name}</div>
            {(c.contacts||[]).length>0
              ? c.contacts.map(ct=><div key={ct.id} style={S.adminMeta}>{ct.name||"—"}{ct.phone?` · ${fmtPhone(ct.phone)}`:""}</div>)
              : <div style={S.adminMeta}>no contacts</div>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            <button className="ghost" style={S.editBtn} onClick={()=>startEdit(c)}>EDIT</button>
            <button className="danger" style={S.dangerBtn} onClick={()=>del(c.id)}>DELETE</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function EmployeesAdmin({ employees, saveEmployees }) {
  const [name,setName]=useState("");
  const add=()=>{ if(!name.trim())return alert("Employee name required."); saveEmployees([...employees,{id:uid(),name:name.trim()}].sort((a,b)=>a.name.localeCompare(b.name))); setName(""); };
  const del=(id)=>{ if(confirm("Remove this employee from the dropdown list?")) saveEmployees(employees.filter(e=>e.id!==id)); };
  return (
    <div>
      <SectionTitle>ADD EMPLOYEE</SectionTitle>
      <div style={S.formCard}>
        <div style={{display:"flex",gap:8}}>
          <input style={S.input} value={name} onChange={e=>setName(e.target.value)} placeholder="Employee name" onKeyDown={e=>{if(e.key==="Enter")add();}} />
          <button className="primary" style={{...S.primaryBtn,marginTop:0,width:"auto",padding:"0 22px"}} onClick={add}>+ ADD</button>
        </div>
        <p style={S.hint}>These names fill the dropdown the techs use when checking items off.</p>
      </div>
      <SectionTitle>EMPLOYEES ({employees.length})</SectionTitle>
      {employees.length===0 && <div style={S.noNotes}>No employees yet.</div>}
      {employees.slice().sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:"base"})).map(emp=>(
        <div key={emp.id} style={S.adminRow}>
          <div style={{flex:1}}><div style={S.adminName}>{emp.name}</div></div>
          <button className="danger" style={S.dangerBtn} onClick={()=>del(emp.id)}>DELETE</button>
        </div>
      ))}
    </div>
  );
}

// ---- Procurement (office side: update status, add notes) ----
function OfficeProcurement({ projects, procurement, saveProcurement, employees }) {
  const [filter,setFilter]=useState("active"); // active | received | all | deleted
  const [actOn,setActOn]=useState(null); // request id we're updating
  const [actKind,setActKind]=useState(null); // "status" | "delete"
  const [newStatus,setNewStatus]=useState(""); const [note,setNote]=useState("");
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState((employees||[]).length===0);

  const pName=(id)=>(projects.find(p=>p.id===id)||{}).name||"Unknown job";

  // Sort: urgent first (earliest required-by floats up), then by id descending (newest first)
  // Soft-deleted records never appear in non-deleted views.
  const tk = todayKey();
  const baseSort = (a,b)=>{
    // First, urgency: items with a requiredBy date come before items without
    const aHas = !!a.requiredBy; const bHas = !!b.requiredBy;
    if(aHas && !bHas) return -1;
    if(bHas && !aHas) return 1;
    if(aHas && bHas){
      // earlier required-by first
      if(a.requiredBy !== b.requiredBy) return a.requiredBy.localeCompare(b.requiredBy);
    }
    // Within same urgency tier: newest id first
    return b.id.localeCompare(a.id);
  };

  const activeList   = (procurement||[]).filter(r=>!r.deleted && r.status!=="Received").slice().sort(baseSort);
  const receivedList = (procurement||[]).filter(r=>!r.deleted && r.status==="Received").slice().sort((a,b)=>b.id.localeCompare(a.id));
  const allList      = (procurement||[]).filter(r=>!r.deleted).slice().sort(baseSort);
  const deletedList  = (procurement||[]).filter(r=>r.deleted).slice().sort((a,b)=>b.id.localeCompare(a.id));

  const counts = {
    active: activeList.length,
    received: receivedList.length,
    all: allList.length,
    deleted: deletedList.length,
  };
  const filtered = filter==="active" ? activeList
                 : filter==="received" ? receivedList
                 : filter==="deleted" ? deletedList
                 : allList;

  const statusColor=(s)=> s==="Received"?"var(--green)": s==="Ordered"?"var(--amber)":"var(--sub)";

  const openStatus=(r)=>{ setActOn(r.id); setActKind("status"); setNewStatus(r.status==="Requested"?"Ordered":"Received"); setNote(""); setSel(""); setTyped(""); setUseTyped((employees||[]).length===0); };
  const openDelete=(r)=>{ setActOn(r.id); setActKind("delete"); setNote(""); setSel(""); setTyped(""); setUseTyped((employees||[]).length===0); };
  const cancel=()=>{ setActOn(null); setActKind(null); setNote(""); };

  const applyStatus=()=>{
    const by = useTyped?typed:sel;
    if(!by.trim()) return alert("Pick or type who's updating this.");
    if(!newStatus) return alert("Pick a new status.");
    const updated = (procurement||[]).map(r=> r.id===actOn ? {
      ...r,
      status:newStatus,
      history:[...(r.history||[]), { id:uid(), status:newStatus, by:by.trim(), note:note.trim(), ts:stamp() }]
    } : r);
    saveProcurement(updated);
    cancel();
  };

  const applyDelete=()=>{
    const by = useTyped?typed:sel;
    if(!by.trim()) return alert("Pick or type who's deleting this.");
    const updated = (procurement||[]).map(r=> r.id===actOn ? {
      ...r,
      deleted:true,
      deletedBy:by.trim(),
      deletedTs:stamp(),
      deletedReason:note.trim(),
      history:[...(r.history||[]), { id:uid(), status:"Deleted", by:by.trim(), note:note.trim(), ts:stamp() }]
    } : r);
    saveProcurement(updated);
    cancel();
  };

  const restore=(r)=>{
    if(!confirm(`Restore "${r.item} × ${r.qty}" back to the active list?`)) return;
    const restoreTs = stamp();
    saveProcurement((procurement||[]).map(x=> x.id===r.id ? {
      ...x,
      deleted:false,
      history:[...(x.history||[]), { id:uid(), status:"Restored", by:"office", note:"", ts:restoreTs }]
    } : x));
  };

  // Helper: is the required-by date past or imminent?
  const urgencyTag = (r)=>{
    if(!r.requiredBy) return null;
    if(r.status==="Received") return null;
    if(r.requiredBy < tk) return { label:"OVERDUE", color:"var(--red)" };
    if(r.requiredBy === tk) return { label:"NEEDED TODAY", color:"var(--red)" };
    // within 2 days
    const d = new Date(r.requiredBy+"T00:00:00");
    const today = new Date(tk+"T00:00:00");
    const days = Math.round((d - today) / (1000*60*60*24));
    if(days<=2) return { label:`${days} days`, color:"var(--amber)" };
    return null;
  };

  return (
    <div>
      <SectionTitle>MATERIAL REQUESTS</SectionTitle>
      <div style={{...S.tradeRow,marginBottom:12}}>
        <button className="trade" style={{...S.tradeBtn,...(filter==="active"?S.tradeOn:{})}} onClick={()=>setFilter("active")}>Open ({counts.active})</button>
        <button className="trade" style={{...S.tradeBtn,...(filter==="received"?S.tradeOn:{})}} onClick={()=>setFilter("received")}>Received ({counts.received})</button>
        <button className="trade" style={{...S.tradeBtn,...(filter==="all"?S.tradeOn:{})}} onClick={()=>setFilter("all")}>All ({counts.all})</button>
        <button className="trade" style={{...S.tradeBtn,...(filter==="deleted"?S.tradeOn:{})}} onClick={()=>setFilter("deleted")}>Deleted ({counts.deleted})</button>
      </div>
      {filtered.length===0 && <div style={S.noNotes}>No requests in this view.</div>}
      {filtered.map(r=>{
        const tag = urgencyTag(r);
        return (
          <div key={r.id} style={{...S.noteCard, ...(r.deleted?{opacity:.7, borderStyle:"dashed"}:{})}}>
            <div style={S.noteHead}>
              <span style={S.noteAuthor}>{r.item} × {r.qty}</span>
              <span style={{...S.statusPill, color:statusColor(r.status), borderColor:statusColor(r.status)}}>{r.status}</span>
            </div>
            <div style={S.repProj}>{pName(r.projectId)} · {r.trade}</div>
            <div style={S.adminMeta}>requested by {r.name} · {r.ts}</div>
            {r.requiredBy && (
              <div style={{...S.adminMeta, color: tag?tag.color:"var(--amber)", fontWeight:600}}>
                Required by {fmtDate(r.requiredBy)}
                {tag && <span style={{marginLeft:8, padding:"2px 8px", borderRadius:4, background:tag.color, color:"#1a1a1a", fontSize:11, fontWeight:700, letterSpacing:.5}}>{tag.label}</span>}
              </div>
            )}
            {r.deleted && (
              <div style={{...S.adminMeta, color:"var(--red)", fontWeight:600, marginTop:4}}>
                Deleted by {r.deletedBy} · {r.deletedTs}
                {r.deletedReason && <span> — {r.deletedReason}</span>}
              </div>
            )}
            {(r.history||[]).map(h=>(
              <div key={h.id} style={S.addendum}>
                <div style={S.addHead}>↳ {h.status} · {h.by} · {h.ts}</div>
                {h.note && <div style={S.addBody}>{h.note}</div>}
              </div>
            ))}
            {actOn===r.id && actKind==="status" ? (
              <div style={S.addForm}>
                <div style={{...S.formRow,marginBottom:8}}>
                  <div style={{flex:1}}>
                    <label style={S.fieldLabel}>NEW STATUS</label>
                    <select style={S.input} value={newStatus} onChange={e=>setNewStatus(e.target.value)}>
                      <option value="Requested">Requested</option>
                      <option value="Ordered">Ordered</option>
                      <option value="Received">Received</option>
                    </select>
                  </div>
                </div>
                <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
                <textarea style={{...S.textarea,marginTop:8}} rows={2} placeholder="Note (optional) — e.g. backordered, ETA Friday" value={note} onChange={e=>setNote(e.target.value)} />
                <div style={{display:"flex",gap:8,marginTop:8}}>
                  <button className="primary" style={{...S.primaryBtn,flex:1,marginTop:0}} onClick={applyStatus}>SAVE UPDATE</button>
                  <button className="ghost" style={S.ghostBtn} onClick={cancel}>Cancel</button>
                </div>
              </div>
            ) : actOn===r.id && actKind==="delete" ? (
              <div style={S.addForm}>
                <div style={{fontSize:13, color:"var(--red)", fontWeight:600, marginBottom:8}}>
                  Deleting this request — it will move to the Deleted tab with a record of who and when.
                </div>
                <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
                <textarea style={{...S.textarea,marginTop:8}} rows={2} placeholder="Reason (optional) — e.g. test item, duplicate" value={note} onChange={e=>setNote(e.target.value)} />
                <div style={{display:"flex",gap:8,marginTop:8}}>
                  <button className="danger" style={{...S.dangerBtn,flex:1}} onClick={applyDelete}>CONFIRM DELETE</button>
                  <button className="ghost" style={S.ghostBtn} onClick={cancel}>Cancel</button>
                </div>
              </div>
            ) : r.deleted ? (
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button className="ghost" style={S.editBtn} onClick={()=>restore(r)}>↶ Restore</button>
              </div>
            ) : (
              <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
                {r.status!=="Received" && <button className="ghost" style={S.ghostBtn} onClick={()=>openStatus(r)}>+ Update status</button>}
                <button className="danger" style={{...S.dangerBtn, fontSize:12}} onClick={()=>openDelete(r)}>Delete</button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}


// ---- Office: manage all extras across jobs ----
function OfficeExtras({ projects, extras, saveExtras, employees, printSingleExtra }) {
  const [filter,setFilter]=useState("ready"); // inprog | ready | billed | all
  const [openId,setOpenId]=useState(null);
  const pName=(id)=>(projects.find(p=>p.id===id)||{}).name||"Unknown job";

  const list = (extras||[]).slice().sort((a,b)=>b.id.localeCompare(a.id));
  const counts = {
    inprog: list.filter(x=>x.status==="In Progress").length,
    ready: list.filter(x=>x.status==="Ready to Bill").length,
    billed: list.filter(x=>x.status==="Billed").length,
    all: list.length,
  };
  const filtered = filter==="inprog" ? list.filter(x=>x.status==="In Progress")
                 : filter==="ready"  ? list.filter(x=>x.status==="Ready to Bill")
                 : filter==="billed" ? list.filter(x=>x.status==="Billed")
                 : list;

  const updateExtra = (id, fn) => saveExtras((extras||[]).map(x=> x.id===id ? { ...fn({...x}), lastUpdatedTs:stamp() } : x));
  const setStatusOnExtra = (id, newStatus, by) => {
    saveExtras((extras||[]).map(x=> x.id===id ? {
      ...x, status:newStatus, lastUpdatedTs:stamp(),
      history:[...(x.history||[]), { id:uid(), status:newStatus, by:by.trim(), ts:stamp() }]
    } : x));
  };
  const deleteExtra = (id) => {
    if(!confirm("Permanently delete this extra? This can't be undone.")) return;
    saveExtras((extras||[]).filter(x=>x.id!==id));
  };

  return (
    <div>
      <SectionTitle>EXTRAS</SectionTitle>
      <div style={{...S.tradeRow, marginBottom:12}}>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="ready"?S.tradeOn:{})}} onClick={()=>setFilter("ready")}>Ready to Bill ({counts.ready})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="inprog"?S.tradeOn:{})}} onClick={()=>setFilter("inprog")}>In Progress ({counts.inprog})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="billed"?S.tradeOn:{})}} onClick={()=>setFilter("billed")}>Billed ({counts.billed})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="all"?S.tradeOn:{})}} onClick={()=>setFilter("all")}>All ({counts.all})</button>
      </div>
      {filtered.length===0 && <div style={S.noNotes}>No extras in this view.</div>}
      {filtered.map(x=>{
        const project = projects.find(p=>p.id===x.projectId);
        return (
          <div key={x.id} style={S.noteCard}>
            <div style={S.repProj}>{pName(x.projectId)} · {x.trade}</div>
            <OfficeExtraView
              extra={x}
              project={project}
              employees={employees}
              isOpen={openId===x.id}
              onOpen={()=>setOpenId(openId===x.id?null:x.id)}
              onUpdate={updateExtra}
              onStatus={setStatusOnExtra}
              onDelete={()=>deleteExtra(x.id)}
              printSingleExtra={printSingleExtra}
            />
          </div>
        );
      })}
    </div>
  );
}

function OfficeExtraView({ extra, project, employees, isOpen, onOpen, onUpdate, onStatus, onDelete, printSingleExtra }) {
  const x = extra;
  const statusColor = x.status==="Billed" ? "var(--green)" : x.status==="Ready to Bill" ? "var(--amber)" : "var(--sub)";
  const totalHours = (x.time||[]).reduce((s,t)=>s+(parseFloat(t.hours)||0), 0);
  const [statusPicker,setStatusPicker]=useState(null);
  const [sSel,setSSel]=useState(""); const [sTyped,setSTyped]=useState(""); const [sUseTyped,setSUseTyped]=useState((employees||[]).length===0);

  const applyStatusChange = ()=>{
    const by = sUseTyped?sTyped:sSel;
    if(!by.trim()) return alert("Pick or type your name.");
    onStatus(x.id, statusPicker, by);
    setStatusPicker(null); setSSel(""); setSTyped("");
  };
  const printThisExtra = ()=>{
    printSingleExtra(x.id);
  };

  return (
    <div>
      <div style={S.noteHead}>
        <span style={S.noteAuthor}>{x.description.slice(0,50)}{x.description.length>50?"…":""}</span>
        <span style={{...S.statusPill, color:statusColor, borderColor:statusColor}}>{x.status}</span>
      </div>
      <div style={S.adminMeta}>created by {x.createdBy} · {x.createdTs}{x.lastUpdatedTs?` · updated ${x.lastUpdatedTs}`:""}</div>
      <div style={S.adminMeta}>{(x.materials||[]).length} materials · {totalHours} hr labor</div>

      {!isOpen ? (
        <button className="ghost" style={S.ghostBtn} onClick={onOpen}>+ View details</button>
      ) : (
        <div style={{marginTop:10}}>
          <div style={S.extraSection}>
            <div style={S.extraSectionHead}>DESCRIPTION</div>
            <div style={{whiteSpace:"pre-wrap"}}>{x.description}</div>
          </div>
          <div style={S.extraSection}>
            <div style={S.extraSectionHead}>MATERIALS</div>
            {(x.materials||[]).length===0 && <div style={{...S.adminMeta,fontStyle:"italic"}}>None.</div>}
            {(x.materials||[]).map(m=>(
              <div key={m.id} style={S.extraLineRow}>
                <div style={{flex:0,minWidth:60,fontWeight:600}}>{m.qty}</div>
                <div style={{flex:1}}>{m.desc}</div>
              </div>
            ))}
          </div>
          <div style={S.extraSection}>
            <div style={S.extraSectionHead}>TIME &nbsp;<span style={{color:"var(--sub)",fontSize:12,fontWeight:400}}>(total: {totalHours} hr)</span></div>
            {(x.time||[]).length===0 && <div style={{...S.adminMeta,fontStyle:"italic"}}>None.</div>}
            {(x.time||[]).map(t=>(
              <div key={t.id} style={S.extraLineRow}>
                <div style={{flex:0,minWidth:120,fontWeight:600}}>{t.name}</div>
                <div style={{flex:0,minWidth:90,color:"var(--sub)"}}>{fmtDate(t.date)}</div>
                <div style={{flex:1}}>{t.hours} hr</div>
              </div>
            ))}
          </div>
          <div style={S.extraSection}>
            <div style={S.extraSectionHead}>ACTIONS</div>
            {statusPicker ? (
              <div style={S.addForm}>
                <div style={{fontSize:13, color:"var(--amber)", fontWeight:600, marginBottom:8}}>Move to: {statusPicker}</div>
                <NamePicker employees={employees} value={sSel} onChange={setSSel} typed={sTyped} setTyped={setSTyped} useTyped={sUseTyped} setUseTyped={setSUseTyped} />
                <div style={{display:"flex",gap:8,marginTop:8}}>
                  <button className="primary" style={{...S.primaryBtn,flex:1,marginTop:0}} onClick={applyStatusChange}>CONFIRM</button>
                  <button className="ghost" style={S.ghostBtn} onClick={()=>setStatusPicker(null)}>Cancel</button>
                </div>
              </div>
            ) : (
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {x.status!=="Billed" && <button className="primary" style={{...S.primaryBtn, flex:"1 1 140px", marginTop:0, background:"var(--green)"}} onClick={()=>setStatusPicker("Billed")}>✓ MARK BILLED</button>}
                {x.status==="Billed" && <button className="ghost" style={S.editBtn} onClick={()=>setStatusPicker("Ready to Bill")}>← Unbill (back to Ready)</button>}
                {x.status==="In Progress" && <button className="ghost" style={S.editBtn} onClick={()=>setStatusPicker("Ready to Bill")}>Mark Ready to Bill</button>}
                {x.status==="Ready to Bill" && <button className="ghost" style={S.editBtn} onClick={()=>setStatusPicker("In Progress")}>← Back to In Progress</button>}
                <button className="ghost" style={S.editBtn} onClick={printThisExtra}>🖨 PRINT / PDF</button>
                <button className="danger" style={{...S.dangerBtn, fontSize:12}} onClick={onDelete}>DELETE</button>
              </div>
            )}
            {(x.history||[]).length>0 && (
              <div style={{marginTop:10}}>
                {(x.history||[]).map(h=>(
                  <div key={h.id} style={S.addendum}>
                    <div style={S.addHead}>↳ {h.status} · {h.by} · {h.ts}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}


// ---- Office: build the job schedule ----
function OfficeSchedule({ projects, employees, assignments, saveAssignments, pto, unscheduled, saveUnscheduled }) {
  const [showForm,setShowForm]=useState(false);
  const [showUnschedForm,setShowUnschedForm]=useState(false);
  const [editingId,setEditingId]=useState(null);       // assignment id being edited
  const [formInitProjectId,setFormInitProjectId]=useState(null); // pre-fill new-assignment form with this project (from "schedule this")
  const [scheduledFromUnschedId,setScheduledFromUnschedId]=useState(null); // unsched id to remove after successful save

  const tk = todayKey();
  const list = (assignments||[]).slice().sort((a,b)=> a.date===b.date ? a.id.localeCompare(b.id) : a.date.localeCompare(b.date));
  const upcoming = list.filter(a=>a.date>=tk);
  const past = list.filter(a=>a.date<tk);
  const projById = {}; projects.forEach(p=>projById[p.id]=p);

  const removeAssignment = (id) => {
    if(!confirm("Remove this assignment?")) return;
    saveAssignments((assignments||[]).filter(a=>a.id!==id));
  };

  // Save handler for both "create new" and "edit existing" — onSave receives an array of records.
  // If editing, the array has exactly one record with the original id; we replace it.
  // If creating, every record gets appended.
  // After a successful save where an unscheduled item is the source, that unsched item is removed.
  const handleSave = (recs)=>{
    if(editingId){
      // edit mode: replace existing id, keep all others
      saveAssignments([recs[0], ...(assignments||[]).filter(a=>a.id!==editingId)]);
    } else {
      saveAssignments([...recs, ...(assignments||[])]);
      // auto-remove unscheduled if applicable
      if(scheduledFromUnschedId){
        saveUnscheduled((unscheduled||[]).filter(u=>u.id!==scheduledFromUnschedId));
      }
    }
    setShowForm(false);
    setEditingId(null);
    setFormInitProjectId(null);
    setScheduledFromUnschedId(null);
  };

  const openNewForm = ()=>{
    setEditingId(null); setFormInitProjectId(null); setScheduledFromUnschedId(null);
    setShowForm(true);
  };
  const openEditForm = (assignment)=>{
    setEditingId(assignment.id);
    setFormInitProjectId(null);
    setScheduledFromUnschedId(null);
    setShowForm(true);
  };
  const openScheduleFromUnsched = (unschedItem)=>{
    setEditingId(null);
    setFormInitProjectId(unschedItem.projectId);
    setScheduledFromUnschedId(unschedItem.id);
    setShowForm(true);
  };
  const closeForm = ()=>{
    setShowForm(false); setEditingId(null); setFormInitProjectId(null); setScheduledFromUnschedId(null);
  };

  const editingAssignment = editingId ? (assignments||[]).find(a=>a.id===editingId) : null;

  // Unscheduled list (alphabetical by job name)
  const unschedSorted = (unscheduled||[]).slice().sort((a,b)=>{
    const an = (projById[a.projectId]||{}).name||"";
    const bn = (projById[b.projectId]||{}).name||"";
    return an.localeCompare(bn, undefined, {sensitivity:"base"});
  });
  const removeUnsched = (id)=>{
    if(!confirm("Remove this unscheduled item? (the job itself is not affected.)")) return;
    saveUnscheduled((unscheduled||[]).filter(u=>u.id!==id));
  };

  // group upcoming by date for the list view
  const groupedByDate = {};
  upcoming.forEach(a=>{ (groupedByDate[a.date] = groupedByDate[a.date] || []).push(a); });
  const sortedDates = Object.keys(groupedByDate).sort();

  return (
    <div>
      <SectionTitle>JOB SCHEDULE</SectionTitle>

      {/* Top buttons — only show when not in a form */}
      {!showForm && !showUnschedForm && (
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="primary" style={{...S.primaryBtn, flex:"1 1 220px"}} onClick={openNewForm}>+ NEW ASSIGNMENT</button>
          <button className="ghost" style={{...S.editBtn, padding:"12px 18px", fontSize:13}} onClick={()=>setShowUnschedForm(true)}>+ ADD UNSCHEDULED JOB</button>
        </div>
      )}

      {showForm && (
        <NewAssignmentForm
          projects={projects}
          employees={employees}
          pto={pto}
          assignments={assignments}
          editingAssignment={editingAssignment}
          initialProjectId={formInitProjectId}
          onCancel={closeForm}
          onSave={handleSave}
        />
      )}
      {showUnschedForm && (
        <NewUnscheduledForm
          projects={projects}
          existing={unscheduled||[]}
          onCancel={()=>setShowUnschedForm(false)}
          onSave={(rec)=>{ saveUnscheduled([rec, ...(unscheduled||[])]); setShowUnschedForm(false); }}
        />
      )}

      {/* Unscheduled section */}
      {unschedSorted.length>0 && (
        <>
          <SectionTitle>UNSCHEDULED JOBS ({unschedSorted.length})</SectionTitle>
          {unschedSorted.map(u=>{
            const proj = projById[u.projectId];
            return (
              <div key={u.id} style={S.unschedCard}>
                <div style={{flex:1}}>
                  <div style={S.unschedName}>{proj?proj.name:"(unknown job)"}</div>
                  {proj && proj.contractor && <div style={S.adminMeta}>{proj.contractor}</div>}
                  {u.note && <div style={{...S.noteBody, marginTop:6, fontSize:14}}>{u.note}</div>}
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:6,alignSelf:"flex-start"}}>
                  <button className="primary" style={{...S.primaryBtn, marginTop:0, padding:"6px 12px", fontSize:12}} onClick={()=>openScheduleFromUnsched(u)}>+ SCHEDULE THIS</button>
                  <button className="ghost" style={S.editBtn} onClick={()=>removeUnsched(u.id)}>Remove</button>
                </div>
              </div>
            );
          })}
        </>
      )}

      <SectionTitle>UPCOMING</SectionTitle>
      {sortedDates.length===0 && <div style={S.noNotes}>No upcoming assignments scheduled.</div>}
      {sortedDates.map(date=>{
        // group by project|trade within this date
        const byJob = {};
        groupedByDate[date].forEach(a=>{ const k=a.projectId+"|"+a.trade; (byJob[k]=byJob[k]||[]).push(a); });
        const d = new Date(date+"T00:00:00");
        return (
          <div key={date} style={S.scheduleDayCard}>
            <div style={S.scheduleDayHead}>{d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}</div>
            {Object.entries(byJob).map(([k,arr])=>{
              const [pid,trade] = k.split("|");
              const proj = projById[pid];
              return (
                <div key={k} style={S.scheduleJobBlock}>
                  <div style={S.scheduleJobHead}>{proj?proj.name:"(unknown job)"} · {trade}</div>
                  {arr.map(a=>(
                    <div key={a.id} style={S.scheduleTechRow}>
                      <div style={{flex:1}}>
                        <span style={{fontWeight:600}}>{a.name}</span>
                        {a.dayMode!=="full" && <span style={{color:"var(--amber)", marginLeft:6, fontSize:12}}>{a.dayMode==="am"?"½ AM":"½ PM"}</span>}
                        {a.note && <div style={{...S.adminMeta, marginTop:2}}>{a.note}</div>}
                      </div>
                      <div style={{display:"flex",gap:6}}>
                        <button className="ghost" style={{...S.editBtn, fontSize:11, padding:"3px 8px"}} onClick={()=>openEditForm(a)}>Edit</button>
                        <button className="ghost" style={S.removeBtn} onClick={()=>removeAssignment(a.id)}>✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        );
      })}

      {past.length>0 && (<>
        <SectionTitle>PAST ASSIGNMENTS</SectionTitle>
        <div style={{...S.adminMeta, marginBottom:8}}>Showing last 20 days of past assignments.</div>
        {(() => {
          const grouped = {};
          past.forEach(a=>{ (grouped[a.date] = grouped[a.date] || []).push(a); });
          const dates = Object.keys(grouped).sort((a,b)=>b.localeCompare(a)).slice(0,20);
          return dates.map(date=>{
            const d = new Date(date+"T00:00:00");
            return (
              <div key={date} style={{...S.scheduleDayCard, opacity:.65}}>
                <div style={S.scheduleDayHead}>{d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</div>
                {grouped[date].map(a=>{
                  const proj = projById[a.projectId];
                  return (
                    <div key={a.id} style={S.scheduleTechRow}>
                      <div style={{flex:1, fontSize:13}}>
                        {a.name} · {proj?proj.name:"(unknown)"} · {a.trade}
                        {a.dayMode!=="full" && <span style={{color:"var(--amber)", marginLeft:6}}>{a.dayMode==="am"?"½ AM":"½ PM"}</span>}
                      </div>
                      <button className="ghost" style={S.removeBtn} onClick={()=>removeAssignment(a.id)}>✕</button>
                    </div>
                  );
                })}
              </div>
            );
          });
        })()}
      </>)}
    </div>
  );
}

function NewAssignmentForm({ projects, employees, pto, assignments, onCancel, onSave, editingAssignment, initialProjectId }) {
  const isEdit = !!editingAssignment;
  const initProjId = editingAssignment ? editingAssignment.projectId : (initialProjectId || "");
  const [projectId,setProjectId]=useState(initProjId);
  const [trade,setTrade]=useState(editingAssignment ? editingAssignment.trade : "");
  const [from,setFrom]=useState(editingAssignment ? editingAssignment.date : todayKey());
  const [to,setTo]=useState(editingAssignment ? editingAssignment.date : todayKey());
  const [dayMode,setDayMode]=useState(editingAssignment ? editingAssignment.dayMode : "full");
  // For editing, only one tech is involved. For new, multi-select is allowed.
  const [selectedEmps,setSelectedEmps]=useState(editingAssignment ? [editingAssignment.name] : []);
  const [note,setNote]=useState(editingAssignment ? (editingAssignment.note||"") : "");

  const project = projects.find(p=>p.id===projectId);
  const tradeOptions = project ? project.workTypes : [];
  useEffect(()=>{
    if(project && trade && !project.workTypes.includes(trade)){ setTrade(""); }
  }, [projectId]);

  const toggleEmp = (name)=>{
    if(isEdit){
      // edit mode: single-select
      setSelectedEmps([name]);
    } else {
      setSelectedEmps(prev => prev.includes(name) ? prev.filter(n=>n!==name) : [...prev, name]);
    }
  };

  const submit = ()=>{
    if(!projectId) return alert("Pick a job.");
    if(!trade) return alert("Pick a trade.");
    if(!from || !to) return alert("Pick dates.");
    if(selectedEmps.length===0) return alert(isEdit ? "Pick the employee for this assignment." : "Select at least one employee.");
    if(isEdit && selectedEmps.length>1) return alert("Only one employee per edit. Pick one.");

    const lo = from<=to?from:to;
    const hi = from<=to?to:from;
    const dates = [];
    const cur = new Date(lo+"T00:00:00"); const end = new Date(hi+"T00:00:00");
    while(cur<=end){
      dates.push(cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0"));
      cur.setDate(cur.getDate()+1);
    }
    if(isEdit && dates.length!==1) return alert("Edits cover a single date. Pick the same start and end date.");

    // Conflict detection — for edits, ignore the record being edited (you don't conflict with yourself)
    const ptoApproved = (pto||[]).filter(r=>r.status==="Approved");
    const otherAssignments = isEdit ? (assignments||[]).filter(a=>a.id!==editingAssignment.id) : (assignments||[]);
    const conflicts = [];
    dates.forEach(date=>{
      selectedEmps.forEach(name=>{
        const ptoHit = ptoApproved.find(r=>r.name===name && date>=r.from && date<=r.to);
        if(ptoHit) conflicts.push(`${name} has approved PTO on ${date}`);
        const dupes = otherAssignments.filter(a=>a.name===name && a.date===date);
        dupes.forEach(d=>{
          const overlaps = dayMode==="full" || d.dayMode==="full" || d.dayMode===dayMode;
          if(overlaps){
            const proj = projects.find(p=>p.id===d.projectId);
            conflicts.push(`${name} already assigned to ${proj?proj.name:"another job"} on ${date} (${d.dayMode})`);
          }
        });
      });
    });
    if(conflicts.length>0){
      const msg = "Possible conflicts:\n\n" + conflicts.slice(0,10).join("\n") + (conflicts.length>10?`\n…and ${conflicts.length-10} more`:"") + "\n\nSave anyway?";
      if(!confirm(msg)) return;
    }

    if(isEdit){
      // Build a single updated record preserving the original id
      const updated = {
        ...editingAssignment,
        projectId,
        trade,
        name: selectedEmps[0],
        date: dates[0],
        dayMode,
        note: note.trim(),
      };
      onSave([updated]);
    } else {
      const recs = [];
      const ts = stamp();
      dates.forEach(date=>{
        selectedEmps.forEach(name=>{
          recs.push({
            id: uid(),
            projectId,
            trade,
            name,
            date,
            dayMode,
            note: note.trim(),
            createdTs: ts,
          });
        });
      });
      onSave(recs);
    }
  };

  return (
    <div style={S.formCard}>
      {isEdit && <div style={{fontSize:13, color:"var(--amber)", fontWeight:600, marginBottom:8, letterSpacing:.5}}>EDITING ASSIGNMENT</div>}
      <label style={S.fieldLabel}>JOB *</label>
      <select style={S.input} value={projectId} onChange={e=>setProjectId(e.target.value)}>
        <option value="">— pick a job —</option>
        {projects.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>(
          <option key={p.id} value={p.id}>{p.name}{p.contractor?` (${p.contractor})`:""}</option>
        ))}
      </select>

      {tradeOptions.length>0 && (
        <div style={{marginTop:10}}>
          <label style={S.fieldLabel}>TRADE *</label>
          <div style={S.tradeRow}>
            {tradeOptions.map(t=>(
              <button key={t} className="trade" style={{...S.tradeBtn, ...(trade===t?S.tradeOn:{})}} onClick={()=>setTrade(t)}>{t}</button>
            ))}
          </div>
        </div>
      )}

      <div style={{...S.formRow, marginTop:10}}>
        <div style={{flex:1}}><label style={S.fieldLabel}>{isEdit?"DATE":"FROM"}</label><input type="date" style={S.input} value={from} onChange={e=>{setFrom(e.target.value); if(isEdit) setTo(e.target.value);}} /></div>
        {!isEdit && <div style={{flex:1}}><label style={S.fieldLabel}>TO</label><input type="date" style={S.input} value={to} onChange={e=>setTo(e.target.value)} /></div>}
      </div>

      <div style={{marginTop:10}}>
        <label style={S.fieldLabel}>FULL OR HALF DAY</label>
        <div style={S.tradeRow}>
          <button className="trade" style={{...S.tradeBtn, ...(dayMode==="full"?S.tradeOn:{})}} onClick={()=>setDayMode("full")}>Full</button>
          <button className="trade" style={{...S.tradeBtn, ...(dayMode==="am"?S.tradeOn:{})}} onClick={()=>setDayMode("am")}>½ AM</button>
          <button className="trade" style={{...S.tradeBtn, ...(dayMode==="pm"?S.tradeOn:{})}} onClick={()=>setDayMode("pm")}>½ PM</button>
        </div>
      </div>

      <div style={{marginTop:10}}>
        <label style={S.fieldLabel}>{isEdit ? "EMPLOYEE *" : "EMPLOYEES * (tap to select multiple)"}</label>
        {(employees||[]).length===0
          ? <div style={S.adminMeta}>No employees set up yet — add some on the Employees tab.</div>
          : (
            <div style={S.empPickerWrap}>
              {employees.map(emp=>{
                const n = emp.name;
                const isOn = selectedEmps.includes(n);
                return (
                  <button key={emp.id} className="emp-pick" style={{...S.empPickBtn, ...(isOn?S.empPickOn:{})}} onClick={()=>toggleEmp(n)}>
                    {isOn?"✓ ":""}{n}
                  </button>
                );
              })}
            </div>
          )}
      </div>

      <div style={{marginTop:10}}>
        <label style={S.fieldLabel}>NOTE (optional)</label>
        <textarea style={S.textarea} rows={2} placeholder="Anything the techs should know" value={note} onChange={e=>setNote(e.target.value)} />
      </div>

      <div style={{display:"flex",gap:8,marginTop:10}}>
        <button className="primary" style={{...S.primaryBtn,flex:1,marginTop:0}} onClick={submit}>{isEdit ? "SAVE EDIT" : `SAVE ASSIGNMENT${selectedEmps.length>1?"S":""}`}</button>
        <button className="ghost" style={S.ghostBtn} onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}


// ---- Office: review and approve / deny time off ----
function OfficeTimeOff({ pto, savePto, employees }) {
  const [filter,setFilter]=useState("pending"); // pending | approved | denied | cancelled | all
  const [actOn,setActOn]=useState(null); // {id, action: "Approved"|"Denied"|"Cancelled"|"edit"}
  const [note,setNote]=useState("");
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState((employees||[]).length===0);

  // edit-mode form state (only when actOn.action === "edit")
  const [editFrom,setEditFrom]=useState("");
  const [editTo,setEditTo]=useState("");
  const [editDayMode,setEditDayMode]=useState("full");
  const [editEmpName,setEditEmpName]=useState("");
  const [editNote,setEditNote]=useState("");

  const list = (pto||[]).slice().sort((a,b)=> a.from===b.from ? b.id.localeCompare(a.id) : (a.from<b.from?1:-1));
  const counts = {
    pending: list.filter(r=>r.status==="Pending").length,
    approved: list.filter(r=>r.status==="Approved").length,
    denied: list.filter(r=>r.status==="Denied").length,
    cancelled: list.filter(r=>r.status==="Cancelled").length,
    all: list.length,
  };
  const filtered = filter==="all" ? list : list.filter(r=> r.status.toLowerCase()===filter);

  const openDecide=(r,decision)=>{ // Approved | Denied | Cancelled
    setActOn({id:r.id, action:decision});
    setNote(""); setSel(""); setTyped(""); setUseTyped((employees||[]).length===0);
  };
  const openEdit=(r)=>{
    setActOn({id:r.id, action:"edit"});
    setEditFrom(r.from); setEditTo(r.to); setEditDayMode(r.dayMode||"full");
    setEditEmpName(r.name); setEditNote(r.note||"");
    setSel(""); setTyped(""); setUseTyped((employees||[]).length===0);
  };
  const cancelPanel=()=>{ setActOn(null); setNote(""); };

  const applyDecision=()=>{
    const by = useTyped?typed:sel;
    if(!by.trim()) return alert("Pick or type who's making the decision.");
    const updated = (pto||[]).map(r=> r.id===actOn.id ? {
      ...r,
      status: actOn.action,
      history:[...(r.history||[]), { id:uid(), status:actOn.action, by:by.trim(), note:note.trim(), ts:stamp() }]
    } : r);
    savePto(updated);
    cancelPanel();
  };

  const applyEdit=()=>{
    const by = useTyped?typed:sel;
    if(!by.trim()) return alert("Pick or type who's making this edit.");
    if(!editEmpName.trim()) return alert("Employee name is required.");
    if(!editFrom || !editTo) return alert("Start and end dates required.");
    const lo = editFrom<=editTo ? editFrom : editTo;
    const hi = editFrom<=editTo ? editTo : editFrom;
    const original = (pto||[]).find(r=>r.id===actOn.id);
    const summary = `Edited: ${original.name}→${editEmpName.trim()}, ${original.from}–${original.to}→${lo}–${hi}, ${original.dayMode||"full"}→${editDayMode}`;
    const updated = (pto||[]).map(r=> r.id===actOn.id ? {
      ...r,
      name: editEmpName.trim(),
      from: lo, to: hi,
      dayMode: editDayMode,
      note: editNote.trim(),
      history:[...(r.history||[]), { id:uid(), status:"Edited", by:by.trim(), note: summary + (note.trim()?` — ${note.trim()}`:""), ts:stamp() }]
    } : r);
    savePto(updated);
    cancelPanel();
  };

  const hardDelete=(r)=>{
    if(!confirm(`Permanently delete this request for ${r.name} (${r.from===r.to?fmtDate(r.from):fmtDate(r.from)+" → "+fmtDate(r.to)})?\n\nThis cannot be undone.`)) return;
    if(!confirm("Are you sure? There will be no record this request ever existed.")) return;
    savePto((pto||[]).filter(x=>x.id!==r.id));
  };

  return (
    <div>
      <SectionTitle>TIME OFF REQUESTS</SectionTitle>
      <div style={{...S.tradeRow, marginBottom:12}}>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="pending"?S.tradeOn:{})}} onClick={()=>setFilter("pending")}>Pending ({counts.pending})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="approved"?S.tradeOn:{})}} onClick={()=>setFilter("approved")}>Approved ({counts.approved})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="denied"?S.tradeOn:{})}} onClick={()=>setFilter("denied")}>Denied ({counts.denied})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="cancelled"?S.tradeOn:{})}} onClick={()=>setFilter("cancelled")}>Cancelled ({counts.cancelled})</button>
        <button className="trade" style={{...S.tradeBtn, ...(filter==="all"?S.tradeOn:{})}} onClick={()=>setFilter("all")}>All ({counts.all})</button>
      </div>
      {filtered.length===0 && <div style={S.noNotes}>No requests in this view.</div>}
      {filtered.map(r=>{
        const color = r.status==="Approved"?"var(--green)": r.status==="Denied"?"var(--red)": r.status==="Cancelled"?"var(--sub)":"var(--amber)";
        const isEditing = actOn && actOn.id===r.id && actOn.action==="edit";
        const isDeciding = actOn && actOn.id===r.id && actOn.action!=="edit";
        return (
          <div key={r.id} style={S.noteCard}>
            <div style={S.noteHead}>
              <span style={S.noteAuthor}>{r.name}</span>
              <span style={{...S.statusPill, color, borderColor:color}}>{r.status}</span>
            </div>
            <div style={S.adminMeta}>
              {r.from===r.to ? fmtDate(r.from) : `${fmtDate(r.from)} → ${fmtDate(r.to)}`} · {ptoDayLabel(r)}
            </div>
            {r.note && <div style={{...S.noteBody, marginTop:6}}>{r.note}</div>}
            <div style={S.adminMeta}>requested {r.ts}</div>
            {(r.history||[]).map(h=>(
              <div key={h.id} style={S.addendum}>
                <div style={S.addHead}>↳ {h.status} · {h.by} · {h.ts}</div>
                {h.note && <div style={S.addBody}>{h.note}</div>}
              </div>
            ))}

            {isDeciding && (
              <div style={S.addForm}>
                <div style={{fontSize:13, color, fontWeight:600, marginBottom:8}}>
                  {actOn.action==="Approved" && "Approving this request"}
                  {actOn.action==="Denied" && "Denying this request"}
                  {actOn.action==="Cancelled" && "Cancelling this request"}
                </div>
                <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
                <textarea style={{...S.textarea, marginTop:8}} rows={2} placeholder="Note (optional)" value={note} onChange={e=>setNote(e.target.value)} />
                <div style={{display:"flex", gap:8, marginTop:8}}>
                  <button className="primary" style={{...S.primaryBtn, flex:1, marginTop:0, background:color, color: actOn.action==="Cancelled"?"#fff":"#1a1a1a"}} onClick={applyDecision}>
                    CONFIRM {actOn.action.toUpperCase()}
                  </button>
                  <button className="ghost" style={S.ghostBtn} onClick={cancelPanel}>Back</button>
                </div>
              </div>
            )}

            {isEditing && (
              <div style={S.addForm}>
                <div style={{fontSize:13, color:"var(--amber)", fontWeight:600, marginBottom:8}}>Editing this request</div>
                <label style={S.fieldLabel}>EMPLOYEE</label>
                <input style={S.input} value={editEmpName} onChange={e=>setEditEmpName(e.target.value)} />
                <div style={{...S.formRow, marginTop:8}}>
                  <div style={{flex:1}}><label style={S.fieldLabel}>FROM</label><input type="date" style={S.input} value={editFrom} onChange={e=>setEditFrom(e.target.value)} /></div>
                  <div style={{flex:1}}><label style={S.fieldLabel}>TO</label><input type="date" style={S.input} value={editTo} onChange={e=>setEditTo(e.target.value)} /></div>
                </div>
                <div style={{marginTop:8}}>
                  <label style={S.fieldLabel}>DAY MODE</label>
                  <div style={S.tradeRow}>
                    <button className="trade" style={{...S.tradeBtn, ...(editDayMode==="full"?S.tradeOn:{})}} onClick={()=>setEditDayMode("full")}>Full days</button>
                    <button className="trade" style={{...S.tradeBtn, ...(editDayMode==="am"?S.tradeOn:{})}} onClick={()=>setEditDayMode("am")}>½ AM</button>
                    <button className="trade" style={{...S.tradeBtn, ...(editDayMode==="pm"?S.tradeOn:{})}} onClick={()=>setEditDayMode("pm")}>½ PM</button>
                  </div>
                </div>
                <div style={{marginTop:8}}>
                  <label style={S.fieldLabel}>NOTE</label>
                  <textarea style={S.textarea} rows={2} value={editNote} onChange={e=>setEditNote(e.target.value)} />
                </div>
                <div style={{marginTop:8, borderTop:`1px solid var(--line)`, paddingTop:8}}>
                  <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
                  <textarea style={{...S.textarea, marginTop:8}} rows={2} placeholder="Reason for edit (optional)" value={note} onChange={e=>setNote(e.target.value)} />
                </div>
                <div style={{display:"flex", gap:8, marginTop:8}}>
                  <button className="primary" style={{...S.primaryBtn, flex:1, marginTop:0}} onClick={applyEdit}>SAVE EDIT</button>
                  <button className="ghost" style={S.ghostBtn} onClick={cancelPanel}>Cancel</button>
                </div>
              </div>
            )}

            {!actOn || actOn.id!==r.id ? (
              <div style={{display:"flex", gap:8, marginTop:8, flexWrap:"wrap"}}>
                {r.status==="Pending" && (
                  <>
                    <button className="primary" style={{...S.primaryBtn, flex:"1 1 120px", marginTop:0, background:"var(--green)"}} onClick={()=>openDecide(r,"Approved")}>✓ APPROVE</button>
                    <button className="danger" style={{...S.dangerBtn, flex:"1 1 120px", fontSize:13}} onClick={()=>openDecide(r,"Denied")}>✕ DENY</button>
                  </>
                )}
                {r.status!=="Cancelled" && (
                  <button className="ghost" style={S.editBtn} onClick={()=>openDecide(r,"Cancelled")}>CANCEL</button>
                )}
                <button className="ghost" style={S.editBtn} onClick={()=>openEdit(r)}>EDIT</button>
                <button className="danger" style={{...S.dangerBtn, fontSize:12}} onClick={()=>hardDelete(r)}>DELETE</button>
              </div>
            ) : null}
          </div>
        );
      })}
    </div>
  );
}


// ---- Backup feature ----
const BACKUP_LS_KEY = "fielddog_last_backup_v1";

function downloadBackup(allData) {
  const ts = new Date();
  const pad = (n)=>String(n).padStart(2,"0");
  const dateStr = `${ts.getFullYear()}-${pad(ts.getMonth()+1)}-${pad(ts.getDate())}`;
  const timeStr = `${pad(ts.getHours())}${pad(ts.getMinutes())}`;
  const payload = {
    app: "Field Dog",
    company: COMPANY_NAME,
    generatedAt: ts.toISOString(),
    version: 1,
    data: allData,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `fielddog-backup-${dateStr}-${timeStr}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  try { localStorage.setItem(BACKUP_LS_KEY, ts.toISOString()); } catch {}
}

function getLastBackup() {
  try { return localStorage.getItem(BACKUP_LS_KEY); } catch { return null; }
}

function daysSince(iso) {
  if(!iso) return Infinity;
  const then = new Date(iso); const now = new Date();
  return Math.floor((now - then) / (1000*60*60*24));
}

function BackupBanner({ allData }) {
  const [hidden,setHidden]=useState(false);
  const [lastBackup,setLastBackup]=useState(getLastBackup());
  if(hidden) return null;
  const days = daysSince(lastBackup);
  if(days < 7) return null; // only nag if 7+ days or never
  const doBackup = ()=>{
    downloadBackup(allData);
    setLastBackup(new Date().toISOString());
  };
  return (
    <div style={S.backupBanner}>
      <div style={{flex:1, fontSize:13, color:"#1a1a1a", fontWeight:600}}>
        {lastBackup
          ? `Last backup was ${days} days ago — consider downloading today's backup.`
          : "No backup yet on this device — download one to keep a personal copy safe."}
      </div>
      <button className="primary" style={S.backupBannerBtn} onClick={doBackup}>Download Backup</button>
      <button className="ghost" style={{...S.ghostBtn, color:"#1a1a1a"}} onClick={()=>setHidden(true)}>✕</button>
    </div>
  );
}

function Reports({ projects, entries, procurement, extras, printExtraId }) {
  const [mode,setMode]=useState("single"); // single | range
  const [day,setDay]=useState(todayKey());
  const [from,setFrom]=useState(todayKey());
  const [to,setTo]=useState(todayKey());

  const inRange=(d)=>{
    if(mode==="single") return d===day;
    const lo=from<=to?from:to, hi=from<=to?to:from;
    return d>=lo && d<=hi;
  };
  const rangeLabel = mode==="single" ? day : `${from<=to?from:to} → ${from<=to?to:from}`;

  const selEntries=entries.filter(e=>inRange(e.day));
  const notes=selEntries.filter(e=>e.type==="note").sort((a,b)=>a.id.localeCompare(b.id));
  const checks=selEntries.filter(e=>e.type==="check"||e.type==="equip").sort((a,b)=>a.id.localeCompare(b.id));
  const procReqs = (procurement||[]).filter(r=>!r.deleted && inRange(r.day)).sort((a,b)=>a.id.localeCompare(b.id));
  // extras: include any extra that was created in range OR has any time entry in range
  const extrasInRange = (extras||[]).filter(x => {
    if(inRange(x.day)) return true;
    return (x.time||[]).some(t=>inRange(t.date));
  }).sort((a,b)=>a.id.localeCompare(b.id));
  const pName=(id)=>(projects.find(p=>p.id===id)||{}).name||"Unknown job";
  const pNum=(id,trade)=>((projects.find(p=>p.id===id)||{}).projectNumbers||{})[trade]||"n/a";
  const pAddress=(id)=>(projects.find(p=>p.id===id)||{}).address||"";
  const pContractor=(id)=>(projects.find(p=>p.id===id)||{}).contractor||"";

  // ---- Build job-first aggregation ----
  // Structure: { [projectId]: { [trade]: { notes:[], checks:[], procs:[], extras:[] } } }
  const byJob = {};

    if(!byJob[pid]) byJob[pid] = {};
    if(!byJob[pid][trade]) byJob[pid][trade] = { notes:[], checks:[], procs:[], extras:[] };
    return byJob[pid][trade];
  };
  notes.forEach(n=>ensure(n.projectId, n.trade).notes.push(n));
  checks.forEach(c=>ensure(c.projectId, c.trade).checks.push(c));
  procReqs.forEach(r=>ensure(r.projectId, r.trade).procs.push(r));
  extrasInRange.forEach(x=>ensure(x.projectId, x.trade).extras.push(x));

  // Sort job IDs alphabetically by job name
  const jobIds = Object.keys(byJob).sort((a,b)=>pName(a).localeCompare(pName(b), undefined, {sensitivity:"base"}));

    <div>

        </div>
        {mode==="single" ? (
          <Field label="DATE"><input type="date" style={S.input} value={day} onChange={e=>setDay(e.target.value)} /></Field>
        ) : (
          <div style={S.formRow}>

        </div>
        <button className="primary" style={S.primaryBtn} onClick={()=>window.print()}>🖨 PRINT / SAVE AS PDF</button>
        <p style={S.hint}>Opens your device's print dialog — choose a printer, or "Save as PDF."</p>
      </div>

      {/* On-screen report — JOB-FIRST layout */}
      <SectionTitle>ACTIVITY BY JOB — {rangeLabel}</SectionTitle>
      {jobIds.length===0 && <div style={S.noNotes}>No activity in this range.</div>}
      {jobIds.map(pid=>{
        const job = projects.find(p=>p.id===pid);
        const tradeMap = byJob[pid];

        return (

                    <div style={S.reportSubsection}>
                      <div style={S.reportSubHead}>NOTES</div>
                      {t.notes.map(n=>(
                        <div key={n.id} style={S.reportNoteCard}>

// ---- Responsive tab bar: row on desktop, dropdown on phone ----
function useIsNarrow(breakpoint=720){
  const [narrow,setNarrow]=useState(()=> typeof window!=="undefined" && window.innerWidth < breakpoint);
  useEffect(()=>{
    const onResize = ()=> setNarrow(window.innerWidth < breakpoint);
    window.addEventListener("resize", onResize);
    return ()=> window.removeEventListener("resize", onResize);
  }, [breakpoint]);
  return narrow;
}

function TabBar({ tabs, value, onChange, variant }) {
  // tabs: [{ key, label }]
  // variant: "tab" (default office/workspace look) | "view" (field-side underlined look)
  const narrow = useIsNarrow();
  const current = tabs.find(t=>t.key===value);
  if(narrow){
    return (
      <div style={S.tabSelectWrap}>
        <select
          style={S.tabSelect}
          value={value}
          onChange={e=>onChange(e.target.value)}
        >
          {tabs.map(t=>(
            <option key={t.key} value={t.key}>{t.label}</option>
          ))}
        </select>
        <span style={S.tabSelectCaret}>▾</span>
      </div>
    );
  }
  // Desktop: row of buttons
  if(variant==="view"){
    return (
      <div style={S.viewSwitcher}>
        {tabs.map(t=>(
          <button key={t.key} style={{...S.viewBtn, ...(value===t.key?S.viewBtnOn:{})}} onClick={()=>onChange(t.key)}>{t.label}</button>
        ))}
      </div>
    );
  }
  return (
    <div style={S.tabRow}>
      {tabs.map(t=>(
        <button key={t.key} style={{...S.tab, ...(value===t.key?S.tabOn:{})}} onClick={()=>onChange(t.key)}>{t.label}</button>
      ))}
    </div>
  );
}

        <div className="print-dates">Created {x.createdTs}{x.lastUpdatedTs?` · Updated ${x.lastUpdatedTs}`:""}</div>
      </div>
      <div className="pe-jobline"><strong>Contractor:</strong> {project.contractor||"—"}</div>
      <div className="pe-jobline"><strong>Job:</strong> {project.name||"—"}</div>
      <div className="pe-jobline"><strong>Address:</strong> {project.address||"—"}</div>
      <div className="pe-jobline"><strong>Trade:</strong> {x.trade} &nbsp; <strong>Project #:</strong> {projNum}</div>
      <div className="pe-jobline"><strong>Created by:</strong> {x.createdBy||"—"}</div>

      <h2 className="print-section">Description</h2>
      <div className="pe-desc">{x.description}</div>

      <h2 className="print-section">Materials</h2>
      {(x.materials||[]).length===0
        ? <div className="print-empty">No materials listed.</div>
        : (
          <table className="pe-table">
            <thead><tr><th style={{width:"80px"}}>Qty</th><th>Description</th></tr></thead>
            <tbody>
              {x.materials.map(m=>(
                <tr key={m.id}><td>{m.qty}</td><td>{m.desc}</td></tr>
              ))}
            </tbody>
          </table>
        )}

      <h2 className="print-section">Labor</h2>
      {(x.time||[]).length===0
        ? <div className="print-empty">No labor logged.</div>
        : (
          <>
            <table className="pe-table">
              <thead><tr><th>Tech</th><th style={{width:"120px"}}>Date</th><th style={{width:"80px"}}>Hours</th></tr></thead>
              <tbody>
                {x.time.map(t=>(
                  <tr key={t.id}><td>{t.name}</td><td>{fmtDate(t.date)}</td><td>{t.hours}</td></tr>
                ))}
              </tbody>
            </table>
            <div className="pe-total">Total: {totalHr} hr</div>
          </>
        )}

      <div className="pe-status">Status: {x.status}</div>
    </div>
  );
}
