<style>
  :root{
    --bg:#15171c;--panel:#1d2026;--panel2:#22262e;--line:#2e333d;
    --ink:#eef0f3;--sub:#8b93a1;--amber:#f5a623;--green:#3ecf8e;--red:#e5484d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;}
  body{min-height:100vh;}
  #root{max-width:920px;margin:0 auto;min-height:100vh;}
  input,select,textarea,button{font-family:inherit;}
  input,select,textarea{font-family:'Barlow',sans-serif;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber)!important;}
  ::placeholder{color:#5c6470;}
  .seg:active,.padkey:active,.jobcard:active,.trade:active,.primary:active,.danger:active{transform:scale(.97);}
  .padkey,.seg,.primary,.danger,.ghost,.jobcard,.trade,.checkrow,.backbtn,.lockbtn{transition:all .12s ease;}
  .padkey:hover{background:var(--panel2);border-color:var(--amber);}
  .jobcard:hover{border-color:var(--amber);transform:translateY(-2px);}
  .primary:hover{filter:brightness(1.08);}
  .checkrow:hover{background:var(--panel2);}
  .ghost:hover{color:var(--amber);}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;}

  /* ---- Print ---- */
  .print-area, .print-extra-area { display:none; }
  @media print{
    @page{ margin:14mm; }
    html,body{ background:#fff !important; color:#000 !important; }
    /* hide everything, then reveal only the active print area */
    body * { visibility:hidden !important; }
    /* default: show daily-activity print-area */
    body:not(.printing-extra) .print-area,
    body:not(.printing-extra) .print-area * { visibility:visible !important; }
    body:not(.printing-extra) .print-area{
      display:block !important; position:absolute; left:0; top:0; width:100%;
      color:#000; font-family:'Barlow',Arial,sans-serif;
    }
    /* single-extra mode: show only .print-extra-area */
    body.printing-extra .print-extra-area,
    body.printing-extra .print-extra-area * { visibility:visible !important; }
    body.printing-extra .print-extra-area{
      display:block !important; position:absolute; left:0; top:0; width:100%;
      color:#000; font-family:'Barlow',Arial,sans-serif;
    }
    .print-header{ border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:14px; }
    .print-company{ font-family:'Oswald',Arial,sans-serif; font-size:22px; font-weight:700; }
    .print-title{ font-size:15px; font-weight:600; margin-top:2px; }
    .print-dates{ font-size:13px; color:#333; margin-top:2px; }
    .print-summary{ font-size:12px; color:#333; margin-bottom:14px; }
    .print-section{ font-family:'Oswald',Arial,sans-serif; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #999; padding-bottom:3px; margin:18px 0 10px; }
    .print-block{ margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #ddd; page-break-inside:avoid; }
    .print-block-head{ font-weight:700; font-size:13px; }
    .print-meta{ font-size:12px; color:#444; margin:2px 0 4px; }
    .print-body{ font-size:13px; white-space:pre-wrap; line-height:1.4; }
    .print-addendum{ font-size:12px; color:#222; margin-top:6px; padding-left:10px; border-left:2px solid #999; white-space:pre-wrap; }
    .print-sublist{ margin-top:6px; padding-left:8px; }
    .print-sublist-head{ font-size:12px; font-weight:700; color:#333; margin-top:4px; }
    .print-sublist-item{ font-size:12px; color:#222; padding:1px 0 1px 8px; }
    .print-job{ margin-bottom:16px; padding-bottom:10px; border-bottom:2px solid #000; page-break-inside:avoid; }
    .print-job-head{ font-family:'Oswald',Arial,sans-serif; font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:2px; }
    .print-job-addr{ font-size:11px; color:#555; margin-bottom:8px; }
    .print-trade{ margin:8px 0 8px 4px; padding-left:8px; border-left:2px solid #999; }
    .print-trade-head{ font-family:'Oswald',Arial,sans-serif; font-size:13px; font-weight:600; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; color:#333; }
    .print-subsec{ margin:6px 0 8px 4px; }
    .print-sub-head{ font-family:'Oswald',Arial,sans-serif; font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#555; margin:4px 0 3px; }
    .print-check{ font-size:13px; padding:3px 0; }
    .print-equip{ font-size:12px; color:#444; padding-left:14px; }
    .print-empty{ font-size:12px; color:#666; font-style:italic; }
    /* Single-extra print layout */
    .pe-jobline{ font-size:13px; margin:3px 0; }
    .pe-jobline strong{ display:inline-block; min-width:90px; }
    .pe-desc{ margin-top:12px; padding:10px; border:1px solid #999; font-size:13px; white-space:pre-wrap; }
    .pe-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
    .pe-table th, .pe-table td{ border:1px solid #999; padding:5px 7px; text-align:left; }
    .pe-table th{ background:#eee; font-family:'Oswald',Arial,sans-serif; font-weight:700; font-size:11px; letter-spacing:1px; text-transform:uppercase; }
    .pe-total{ font-weight:700; font-size:13px; margin-top:6px; text-align:right; }
    .pe-status{ font-size:12px; color:#444; margin-top:14px; padding-top:8px; border-top:1px solid #ccc; }
  }
</style>
</head>

// =================== DATA LAYER ===================
const API = "/api/data";
async function loadAll() {
  const r = await fetch(API);
  if (!r.ok) throw new Error("load failed (" + r.status + ")");
  return r.json();
}
async function saveCollection(collection, data) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ collection, data }),
  });
  if (!r.ok) throw new Error("save failed (" + r.status + ")");
  return r.json();
}

// =================== HELPERS ===================
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const stamp = () => new Date().toLocaleString("en-US", { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" });
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const itemLabel = (it) => typeof it === "string" ? it : it.label;
const itemIsEquip = (it) => typeof it === "object" && it.equipment;
const itemIsText = (it) => typeof it === "object" && it.text;
const itemSubs = (it) => (typeof it === "object" && Array.isArray(it.subs)) ? it.subs : null;
const flattenItems = (items) => {
  const out=[];
  items.forEach(it=>{ out.push(it); const s=itemSubs(it); if(s) s.forEach(si=>out.push(si)); });
  return out;
};

// =================== APP ===================
function App() {
  const [status, setStatus] = useState("loading");
  const [errMsg, setErrMsg] = useState("");
  const [side, setSide] = useState("field");
  const [officeAuthed, setOfficeAuthed] = useState(false);
  const [syncing, setSyncing] = useState(false);
  // TV mode: detected from ?tv=1 in URL, OR toggled via in-app button
  const [tvMode, setTvMode] = useState(()=>{
    if(typeof window==="undefined") return false;
    try { return new URLSearchParams(window.location.search).get("tv")==="1"; }
    catch { return false; }
  });

  const [projects, setProjects] = useState([]);
  const [contractors, setContractors] = useState([]);
  const [entries, setEntries] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [procurement, setProcurement] = useState([]);
  const [pto, setPto] = useState([]);
  const [extras, setExtras] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [unscheduled, setUnscheduled] = useState([]);
  const [printExtraId, setPrintExtraId] = useState(null);

  const refresh = useCallback(async () => {
    try {
      const d = await loadAll();
      setProjects(d.projects || []);
      setContractors(d.contractors || []);
      setEntries(d.entries || []);
      setEmployees(d.employees || []);
      setProcurement(d.procurement || []);
      setPto(d.pto || []);
      setExtras(d.extras || []);
      setAssignments(d.assignments || []);
      setUnscheduled(d.unscheduled || []);
      setStatus("ok");
    } catch (e) { setErrMsg(String(e.message || e)); setStatus("error"); }
  }, []);
  useEffect(() => { refresh(); }, [refresh]);

  const persist = useCallback(async (collection, data, setter) => {
    setter(data); setSyncing(true);
    try { await saveCollection(collection, data); }
    catch (e) { alert("Couldn't save to the server — reloading latest data.\n\n" + (e.message || e)); await refresh(); }
    finally { setSyncing(false); }
  }, [refresh]);

  const saveProjects    = useCallback((p) => persist("projects", p, setProjects), [persist]);
  const saveContractors = useCallback((c) => persist("contractors", c, setContractors), [persist]);
  const saveEntries     = useCallback((e) => persist("entries", e, setEntries), [persist]);
  const saveEmployees   = useCallback((e) => persist("employees", e, setEmployees), [persist]);
  const saveProcurement = useCallback((p) => persist("procurement", p, setProcurement), [persist]);
  const savePto         = useCallback((p) => persist("pto", p, setPto), [persist]);
  const saveExtras      = useCallback((e) => persist("extras", e, setExtras), [persist]);
  const saveAssignments = useCallback((a) => persist("assignments", a, setAssignments), [persist]);
  const saveUnscheduled = useCallback((u) => persist("unscheduled", u, setUnscheduled), [persist]);

  // Trigger a single-extra print. Renders the SingleExtraPrint block, waits a tick, calls window.print(), then clears.
  const printSingleExtra = useCallback((id) => {
    setPrintExtraId(id);
    document.body.classList.add("printing-extra");
    setTimeout(()=>{
      window.print();
      setTimeout(()=>{
        setPrintExtraId(null);
        document.body.classList.remove("printing-extra");
      }, 200);
    }, 50);
  }, []);

  // TV mode auto-refresh: every 2 minutes when in TV mode
  useEffect(()=>{
    if(!tvMode) return;
    const tick = setInterval(()=>{ refresh(); }, 2*60*1000);
    return ()=> clearInterval(tick);
  }, [tvMode, refresh]);

  if (status === "loading") return (
    <div style={S.loadWrap}>
      <div style={S.loadMark}>FIELD<span style={{color:"var(--amber)"}}>DOG</span></div>
      <div style={S.spinner} /><div style={S.loadSub}>connecting…</div>
    </div>
  );
  if (status === "error") return (
    <div style={S.loadWrap}>
      <div style={S.loadMark}>FIELD<span style={{color:"var(--amber)"}}>DOG</span></div>
      <div style={{color:"var(--red)",marginTop:16,fontWeight:600}}>Couldn't reach the server</div>
      <div style={S.loadSub}>{errMsg}</div>
      <button className="primary" style={{...S.primaryBtn,maxWidth:200,marginTop:18}} onClick={()=>{setStatus("loading");refresh();}}>RETRY</button>
    </div>
  );

  // TV mode: full-screen calendar only, no app chrome
  if (tvMode) return (
    <TvCalendar
      pto={pto}
      assignments={assignments}
      projects={projects}
      onExit={()=>{
        setTvMode(false);
        try {
          const url = new URL(window.location.href);
          url.searchParams.delete("tv");
          window.history.replaceState({}, "", url.toString());
        } catch {}
      }}
    />
  );

  return (
    <div>
      <Header side={side} setSide={setSide} authed={officeAuthed} resetAuth={()=>setOfficeAuthed(false)} syncing={syncing} onRefresh={refresh} />
      {side==="field" ? (
        <FieldSide projects={projects.filter(p=>!p.removed)} entries={entries} saveEntries={saveEntries} employees={employees} contractors={contractors} procurement={procurement} saveProcurement={saveProcurement} pto={pto} savePto={savePto} extras={extras} saveExtras={saveExtras} printSingleExtra={printSingleExtra} assignments={assignments} onTvMode={()=>setTvMode(true)} />
      ) : officeAuthed ? (
        <OfficeSide projects={projects} saveProjects={saveProjects} contractors={contractors} saveContractors={saveContractors} entries={entries} saveEntries={saveEntries} employees={employees} saveEmployees={saveEmployees} procurement={procurement} saveProcurement={saveProcurement} pto={pto} savePto={savePto} extras={extras} saveExtras={saveExtras} printSingleExtra={printSingleExtra} printExtraId={printExtraId} assignments={assignments} saveAssignments={saveAssignments} unscheduled={unscheduled} saveUnscheduled={saveUnscheduled} />
      ) : (
        <PinGate onUnlock={()=>setOfficeAuthed(true)} />
      )}
      <SingleExtraPrint extras={extras} projects={projects} printExtraId={printExtraId} />
    </div>
  );
}

function Header({ side, setSide, authed, resetAuth, syncing, onRefresh }) {
  return (
    <header style={S.header}>
      <div style={S.brand}>FIELD<span style={{color:"var(--amber)"}}>DOG</span><span style={S.brandTag}>JOB TRACKING</span></div>
      <span title={syncing?"saving…":"synced"} className="syncdot" style={{background:syncing?"var(--amber)":"var(--green)"}} />
      <button className="lockbtn" style={{...S.lockBtn,padding:"8px 10px"}} onClick={onRefresh} title="Reload latest">⟳</button>
      <div style={S.toggle}>
        <button className="seg" onClick={()=>setSide("field")} style={{...S.segBtn,...(side==="field"?S.segOn:{})}}>FIELD</button>
        <button className="seg" onClick={()=>setSide("office")} style={{...S.segBtn,...(side==="office"?S.segOn:{})}}>OFFICE</button>
      </div>
      {side==="office" && authed && <button className="lockbtn" style={S.lockBtn} onClick={resetAuth}>🔒</button>}
    </header>
  );
}

function PinGate({ onUnlock }) {
  const [pin,setPin]=useState(""); const [err,setErr]=useState(false);
  const press=(d)=>{
    setErr(false);
    if(d==="del")return setPin(p=>p.slice(0,-1));
    if(d==="clr")return setPin("");
    setPin(p=>{
      if(p.length>=6) return p;
      const next=p+d;
      if(next===OFFICE_PIN){ setTimeout(onUnlock,150); }
      else if(next.length>=OFFICE_PIN.length){ setErr(true); setTimeout(()=>setPin(""),400); }
      return next;
    });
  };
  // physical / on-screen keyboard support
  useEffect(()=>{
    const onKey=(e)=>{
      if(e.key>="0" && e.key<="9"){ e.preventDefault(); press(e.key); }
      else if(e.key==="Backspace"){ e.preventDefault(); press("del"); }
      else if(e.key==="Escape"){ press("clr"); }
    };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);
  return (
    <div style={S.pinWrap}>
      <div style={S.pinTitle}>OFFICE ACCESS</div>
      <div style={S.pinSub}>Enter PIN — tap below or type on your keyboard</div>
      <div style={{...S.pinDots,...(err?{animation:"shake .35s"}:{})}}>
        {[0,1,2,3,4,5].map(i=><span key={i} style={{...S.dot,...(i<pin.length?S.dotOn:{}),...(i<OFFICE_PIN.length||i<pin.length?{}:{opacity:.25})}} />)}
      </div>
      {err && <div style={S.pinErr}>Incorrect PIN</div>}
      <div style={S.pad}>
        {["1","2","3","4","5","6","7","8","9","clr","0","del"].map(k=>
          <button key={k} className="padkey" style={S.padKey} onClick={()=>press(k)}>{k==="del"?"⌫":k==="clr"?"C":k}</button>)}
      </div>
    </div>
  );
}

// ================= FIELD =================
function FieldSide({ projects, entries, saveEntries, employees, contractors, procurement, saveProcurement, pto, savePto, extras, saveExtras, printSingleExtra, assignments, onTvMode }) {
  const [sel,setSel]=useState(null);
  const [view,setView]=useState("jobs"); // jobs | timeoff | calendar — only relevant when no job is selected
  if(projects.length===0 && view==="jobs") {
    // still allow timeoff/calendar even with no jobs
  }
  const live = sel ? projects.find(p=>p.id===sel.id) : null;
  if(live){
    return <Workspace project={live} back={()=>setSel(null)} entries={entries} saveEntries={saveEntries} employees={employees} contractors={contractors} procurement={procurement} saveProcurement={saveProcurement} extras={extras} saveExtras={saveExtras} printSingleExtra={printSingleExtra} />;
  }
  return (
    <main style={S.main}>
      <TabBar
        variant="view"
        value={view}
        onChange={setView}
        tabs={[
          {key:"jobs", label:"JOBS"},
          {key:"timeoff", label:"TIME OFF"},
          {key:"calendar", label:"CALENDAR"},
        ]}
      />
      {view==="jobs" && (
        projects.length===0
          ? <div style={S.noNotes}>No active projects yet. Ask the office to set one up.</div>
          : <JobSelectBody projects={projects} onPick={setSel} />
      )}
      {view==="timeoff" && <FieldTimeOff employees={employees} pto={pto} savePto={savePto} />}
      {view==="calendar" && <FullCalendar pto={pto} assignments={assignments} projects={projects} readOnly={true} onTvMode={onTvMode} />}
    </main>
  );
}

function JobSelectBody({ projects, onPick }) {
  // group jobs by contractor (case-insensitive), sort groups alphabetically, jobs alphabetically inside.
  // "No contractor" group goes to the bottom.
  const NO_CON = "__none__";

  // Search filter — job name, address, contractor, or any project number
  const [search,setSearch]=useState("");
  const matchProject = (p, q)=>{
    if(!q) return true;
    const needle = q.toLowerCase();
    if((p.name||"").toLowerCase().includes(needle)) return true;
    if((p.address||"").toLowerCase().includes(needle)) return true;
    if((p.contractor||"").toLowerCase().includes(needle)) return true;
    const nums = p.projectNumbers || {};
    for(const k of Object.keys(nums)){
      if(String(nums[k]||"").toLowerCase().includes(needle)) return true;
    }
    return false;
  };
  const visibleProjects = projects.filter(p=>matchProject(p, search.trim()));

  const groupsMap = {};
  visibleProjects.forEach(p=>{
    const key = (p.contractor||"").trim() || NO_CON;
    (groupsMap[key] = groupsMap[key] || { label:(p.contractor||"").trim()||"(No contractor)", jobs:[] }).jobs.push(p);
  });
  const groups = Object.entries(groupsMap)
    .map(([key,g])=>({ key, label:g.label, jobs:g.jobs.slice().sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:"base"})) }))
    .sort((a,b)=>{
      if(a.key===NO_CON) return 1; if(b.key===NO_CON) return -1;
      return a.label.localeCompare(b.label, undefined, {sensitivity:"base"});
    });

  // collapsed state per device, by contractor key
  const LS_KEY = "fielddog_collapsed_contractors_v1";
  const [collapsed,setCollapsed]=useState(()=>{
    try { return new Set(JSON.parse(localStorage.getItem(LS_KEY)||"[]")); }
    catch { return new Set(); }
  });
  const toggle = (key)=>{
    const next = new Set(collapsed);
    next.has(key) ? next.delete(key) : next.add(key);
    setCollapsed(next);
    try { localStorage.setItem(LS_KEY, JSON.stringify([...next])); } catch {}
  };
  // When search is active, always show groups expanded so results are visible
  const searching = search.trim().length>0;

  return (
    <div>
      <SectionTitle>SELECT A JOB</SectionTitle>
      <div style={S.searchWrap}>
        <input
          style={S.searchInput}
          placeholder="Search job name, address, contractor, or project #…"
          value={search}
          onChange={e=>setSearch(e.target.value)}
        />
        {search && <button style={S.searchClear} onClick={()=>setSearch("")} title="Clear">✕</button>}
      </div>
      {searching && groups.length===0 && <div style={S.noNotes}>No jobs match "{search}".</div>}
      {groups.map(g=>{
        const isCollapsed = !searching && collapsed.has(g.key);
        return (
          <div key={g.key} style={S.contractorGroup}>
            <button className="seg" style={S.contractorHeader} onClick={()=>!searching && toggle(g.key)}>
              <span style={S.contractorCaret}>{isCollapsed?"▸":"▾"}</span>
              <span style={S.contractorLabel}>{g.label}</span>
              <span style={S.contractorCount}>{g.jobs.length}</span>
            </button>
            {!isCollapsed && (
              <div style={S.jobGrid}>
                {g.jobs.map(p=>(
                  <button key={p.id} className="jobcard" style={S.jobCard} onClick={()=>onPick(p)}>
                    <div style={S.jobName}>{p.name}</div>
                    <div style={S.jobMeta}>{p.workTypes.map(w=><span key={w} style={S.chip}>{w}</span>)}</div>
                    <div style={S.jobAddr}>{p.address||"—"}</div>
                  </button>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---- Checklist (whole-job, sectioned, equipment items, sub-items, N/A) ----
function Checklist({ project, trade, entries, saveEntries, employees }) {
  const sections = CHECKLISTS[trade] || [];
  // All checklist records for this project+trade. We now keep history per item.
  // Records have status: "done" | "na" | "unchecked".
  // The "current" state of an item is determined by the LATEST record (sorted by ts/id).
  // Equipment values (model/serial) on the latest done record are the current values,
  // BUT they can be updated via additional done records that act as edits — the latest done record's model/serial wins.
  const recs = entries.filter(e=>e.type==="check"&&e.projectId===project.id&&e.trade===trade);

  // Group records by item label, sorted by id (which encodes time) ascending (oldest first)
  const historyByItem = {};
  recs.forEach(r=>{
    (historyByItem[r.item] = historyByItem[r.item] || []).push(r);
  });
  Object.keys(historyByItem).forEach(k=>{
    historyByItem[k].sort((a,b)=>a.id.localeCompare(b.id));
  });

  // For each item, derive the current state from the latest record.
  const stateByItem = {};
  Object.entries(historyByItem).forEach(([label, list])=>{
    const latest = list[list.length-1];
    // Pull the most recent model/serial/value from any "done" record (latest one wins)
    const lastDone = [...list].reverse().find(r=>r.status==="done");
    stateByItem[label] = {
      status: latest.status, // "done" | "na" | "unchecked"
      latest,
      firstDone: list.find(r=>r.status==="done") || null, // for the original-check stamp
      lastDone, // for current model/serial values
      history: list,
    };
  });

  // extra equipment the techs added (separate `equip` records; one record per piece)
  // We treat the latest record per equipName as current (so edits update the values)
  const allExtraEquipRecs = entries.filter(e=>e.type==="equip"&&e.projectId===project.id&&e.trade===trade);
  const extraEquipByName = {};
  allExtraEquipRecs.forEach(eq=>{
    const key = eq.equipName;
    (extraEquipByName[key] = extraEquipByName[key] || []).push(eq);
  });
  const extraEquip = Object.entries(extraEquipByName).map(([name,list])=>{
    list.sort((a,b)=>a.id.localeCompare(b.id));
    const first = list[0];
    const latest = list[list.length-1];
    return {
      ...latest, // model/serial come from latest
      equipName: name,
      // first.name and first.ts represent the original check
      firstName: first.name,
      firstTs: first.ts,
      history: list,
    };
  }).sort((a,b)=> a.history[0].id.localeCompare(b.history[0].id));

  const [active,setActive]=useState(null); // {label, mode: 'check'|'na'|'edit'} or {extraEquipName, mode:'editExtra'}
  const [addingEquip,setAddingEquip]=useState(false);

  // Count: a "leaf" item counts as acted on if its current status is done or na.
  const allLabels = [];
  sections.forEach(sec=>{
    sec.items.forEach(it=>{
      const lbl=itemLabel(it); allLabels.push(lbl);
      const subs=itemSubs(it);
      const st = stateByItem[lbl];
      if(subs && st && st.status==="done"){
        subs.forEach(si=>allLabels.push(itemLabel(si)));
      }
    });
  });
  const acted = allLabels.filter(l=>{
    const s = stateByItem[l];
    return s && (s.status==="done" || s.status==="na");
  }).length;

  const saveAction = (label, mode, name, opts={}) => {
    const rec = { id:uid(), type:"check", projectId:project.id, trade, item:label, name:name.trim(), ts:stamp(), day:todayKey(), status: mode==="na" ? "na" : "done" };
    if(opts.model!==undefined) rec.model = (opts.model||"").trim();
    if(opts.serial!==undefined) rec.serial = (opts.serial||"").trim();
    if(opts.value!==undefined) rec.value = (opts.value||"").trim();
    if(opts.isEdit) rec.isEdit = true; // marks this as an edit of an earlier done record
    saveEntries([rec, ...entries]); setActive(null);
  };
  const saveExtraEquip = (equipName, name, model, serial) => {
    const rec = { id:uid(), type:"equip", projectId:project.id, trade, equipName:equipName.trim(), name:name.trim(), model:model.trim(), serial:serial.trim(), ts:stamp(), day:todayKey() };
    saveEntries([rec, ...entries]); setAddingEquip(false);
  };
  const saveExtraEquipEdit = (equipName, name, model, serial) => {
    const rec = { id:uid(), type:"equip", projectId:project.id, trade, equipName:equipName, name:name.trim(), model:model.trim(), serial:serial.trim(), ts:stamp(), day:todayKey(), isEdit:true };
    saveEntries([rec, ...entries]); setActive(null);
  };

  const renderItem = (it, indent=false) => {
    const label = itemLabel(it);
    const st = stateByItem[label];
    const equip = itemIsEquip(it);
    const text = itemIsText(it);
    const subs = itemSubs(it);
    const isActiveForm = active && active.label===label;
    const showEmpty = !st || st.status==="unchecked";
    const naStyle = st && st.status==="na" ? S.checkRowNA : (st && st.status==="done" ? S.checkRowDone : {});

    // Model/serial come from the latest "done" record (most recent edit)
    const curModel = st && st.lastDone ? st.lastDone.model : undefined;
    const curSerial = st && st.lastDone ? st.lastDone.serial : undefined;
    const curValue = st && st.lastDone ? st.lastDone.value : undefined;
    // Number of edits = count of "done"-status records beyond the first
    const doneRecs = st ? st.history.filter(r=>r.status==="done") : [];
    const numEdits = Math.max(0, doneRecs.length - 1);

    return (
      <div key={label}>
        <div
          className={showEmpty?"checkrow":""}
          style={{...S.checkRow, ...naStyle, ...(indent?S.checkRowSub:{}), cursor: showEmpty ? "pointer" : "default"}}
          onClick={()=>{ if(showEmpty) setActive(isActiveForm && active.mode==="check" ? null : {label,mode:"check"}); }}
        >
          <span style={{...S.box, ...(st && st.status==="done"?S.boxOn:{}), ...(st && st.status==="na"?S.boxNA:{})}}>
            {st && st.status==="done" ? "✓" : st && st.status==="na" ? "—" : ""}
          </span>
          <div style={{flex:1}}>
            <div style={{...S.checkTxt}}>
              {label}
              {showEmpty && equip && <span style={S.equipTag}>model / serial</span>}
              {showEmpty && text && <span style={S.equipTag}>text answer</span>}
            </div>
            {st && st.status==="done" && st.firstDone && (
              <div style={S.checkStamp}>✓ {st.firstDone.name} · {st.firstDone.ts}</div>
            )}
            {st && st.status==="na" && (
              <div style={S.naStamp}>N/A — {st.latest.name} · {st.latest.ts}</div>
            )}
            {st && st.status==="done" && (curModel!==undefined) && (curModel||curSerial) && (
              <div style={S.equipVals}>Model: {curModel||"—"} · Serial: {curSerial||"—"}</div>
            )}
            {st && st.status==="done" && curValue && (
              <div style={S.equipVals}>{curValue}</div>
            )}
            {/* show edit history for equipment items */}
            {st && st.status==="done" && equip && numEdits>0 && (
              <div style={S.editAuditWrap}>
                {doneRecs.slice(1).map(e=>(
                  <div key={e.id} style={S.editAudit}>↳ model/serial edited by {e.name} · {e.ts} → Model: {e.model||"—"} · Serial: {e.serial||"—"}</div>
                ))}
              </div>
            )}
            {/* show "previously checked, then unchecked by office" trail */}
            {st && st.status==="unchecked" && st.firstDone && (
              <div style={S.uncheckTrail}>
                <div style={S.uncheckLine}>↶ Was checked by {st.firstDone.name} on {st.firstDone.ts}</div>
                <div style={S.uncheckLine}>↶ Unchecked by {st.latest.name} on {st.latest.ts}{st.latest.reason?` — "${st.latest.reason}"`:""}</div>
              </div>
            )}
            {/* field-side edit button for equipment items already checked done */}
            {st && st.status==="done" && equip && !isActiveForm && (
              <button className="ghost" style={S.editEquipBtn} onClick={(e)=>{e.stopPropagation(); setActive({label, mode:"edit"});}}>
                Edit model/serial
              </button>
            )}
          </div>
          {showEmpty && (
            <button className="ghost" style={S.naBtn} onClick={(e)=>{e.stopPropagation(); setActive(isActiveForm && active.mode==="na" ? null : {label,mode:"na"});}}>
              N/A
            </button>
          )}
        </div>
        {isActiveForm && active.mode!=="edit" && (
          <CheckForm
            equip={equip}
            text={text}
            mode={active.mode}
            employees={employees}
            onCancel={()=>setActive(null)}
            onSave={(name,extras)=>saveAction(label, active.mode, name, extras||{})}
          />
        )}
        {isActiveForm && active.mode==="edit" && (
          <CheckForm
            equip={true}
            text={false}
            mode="check"
            isEdit={true}
            initialModel={curModel||""}
            initialSerial={curSerial||""}
            employees={employees}
            onCancel={()=>setActive(null)}
            onSave={(name,extras)=>saveAction(label, "check", name, {...(extras||{}), isEdit:true})}
          />
        )}
        {/* Conditional subs */}
        {subs && st && st.status==="done" && (
          <div style={S.subList}>
            {subs.map(si=>renderItem(si, true))}
          </div>
        )}
      </div>
    );
  };

  return (
    <div>
      <div style={S.progress}>
        <div style={S.progressBar}><div style={{...S.progressFill,width:`${allLabels.length?(acted/allLabels.length)*100:0}%`}} /></div>
        <span style={S.progressTxt}>{acted}/{allLabels.length} done</span>
      </div>

      {sections.map(sec=>(
        <div key={sec.section} style={{marginBottom:18}}>
          <div style={S.secHead}>{sec.section}</div>
          <div style={S.checkList}>
            {sec.items.map(it=>renderItem(it))}
          </div>
        </div>
      ))}

      {/* Additional equipment */}
      <div style={{marginBottom:18}}>
        <div style={S.secHead}>Additional Equipment</div>
        {extraEquip.map(eq=>{
          const editingThis = active && active.extraEquipName===eq.equipName;
          const equipEdits = (eq.history||[]).slice(1);
          return (
            <div key={eq.equipName}>
              <div style={{...S.checkRow,...S.checkRowDone}}>
                <span style={{...S.box,...S.boxOn}}>✓</span>
                <div style={{flex:1}}>
                  <div style={S.checkTxt}>{eq.equipName}</div>
                  <div style={S.checkStamp}>✓ {eq.firstName} · {eq.firstTs}</div>
                  <div style={S.equipVals}>Model: {eq.model||"—"} · Serial: {eq.serial||"—"}</div>
                  {equipEdits.length>0 && (
                    <div style={S.editAuditWrap}>
                      {equipEdits.map(e=>(
                        <div key={e.id} style={S.editAudit}>↳ model/serial edited by {e.name} · {e.ts} → Model: {e.model||"—"} · Serial: {e.serial||"—"}</div>
                      ))}
                    </div>
                  )}
                  {!editingThis && (
                    <button className="ghost" style={S.editEquipBtn} onClick={()=>setActive({extraEquipName:eq.equipName, mode:"editExtra"})}>Edit model/serial</button>
                  )}
                </div>
              </div>
              {editingThis && (
                <ExtraEquipForm
                  isEdit={true}
                  initialEquipName={eq.equipName}
                  initialModel={eq.model||""}
                  initialSerial={eq.serial||""}
                  employees={employees}
                  onCancel={()=>setActive(null)}
                  onSave={(equipName,name,model,serial)=>saveExtraEquipEdit(eq.equipName, name, model, serial)}
                />
              )}
            </div>
          );
        })}
        {!addingEquip
          ? <button className="ghost" style={S.ghostBtn} onClick={()=>setAddingEquip(true)}>+ Add equipment</button>
          : <ExtraEquipForm employees={employees} onCancel={()=>setAddingEquip(false)} onSave={saveExtraEquip} />}
      </div>

      <p style={S.hint}>This is a whole-job checklist — items stay checked for the life of the job. Tap an item to mark it done; use N/A if it doesn't apply. For equipment, you can edit the model/serial after saving — every edit is logged with your name.</p>
    </div>
  );
}

// employee picker w/ "type a name" fallback

      <label style={S.fieldLabel}>NAME <span style={{color:"var(--amber)"}}>*required</span></label>

        <select style={S.input} value={value} onChange={e=>{ if(e.target.value==="__type__"){setUseTyped(true);} else onChange(e.target.value); }}>
          <option value="">— choose employee —</option>
          {employees.map(emp=><option key={emp.id} value={emp.name}>{emp.name}</option>)}
          <option value="__type__">+ type a name…</option>
        </select>
      ) : (
        <div style={{display:"flex",gap:8}}>

function CheckForm({ equip, text, mode, employees, onSave, onCancel, isEdit, initialModel, initialSerial }) {
  const isNa = mode === "na";
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState(employees.length===0);
  const [model,setModel]=useState(initialModel||""); const [serial,setSerial]=useState(initialSerial||"");
  const [value,setValue]=useState("");
  const submit=()=>{
    const name=useTyped?typed:sel;
    if(!name.trim()) return alert("Pick or type a name.");
    if(!isNa){
      if(equip){ if(!model.trim()) return alert("Model # is required."); if(!serial.trim()) return alert("Serial # is required."); }
      if(text && !value.trim()) return alert("Please type the answer.");
    }
    const extras = {};
    if(equip && !isNa){ extras.model = model; extras.serial = serial; }
    if(text && !isNa){ extras.value = value; }
    onSave(name, extras);
  };
  return (
    <div style={S.checkForm}>
      {isEdit && <div style={{fontSize:12, color:"var(--amber)", fontWeight:600, marginBottom:8, letterSpacing:.5}}>EDITING MODEL / SERIAL</div>}
      <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
      {!isNa && equip && (
        <div style={{marginTop:10}}>
          <div style={S.formRow}>
            <div style={{flex:1}}><label style={S.fieldLabel}>MODEL # <span style={{color:"var(--amber)"}}>*</span></label><input style={S.input} value={model} onChange={e=>setModel(e.target.value)} /></div>
            <div style={{flex:1}}><label style={S.fieldLabel}>SERIAL # <span style={{color:"var(--amber)"}}>*</span></label><input style={S.input} value={serial} onChange={e=>setSerial(e.target.value)} /></div>
          </div>
        </div>
      )}
      {!isNa && text && (
        <div style={{marginTop:10}}>
          <label style={S.fieldLabel}>ANSWER <span style={{color:"var(--amber)"}}>*</span></label>
          <input style={S.input} value={value} onChange={e=>setValue(e.target.value)} placeholder="Type the answer…" />
        </div>
      )}
      <div style={{display:"flex",gap:8,marginTop:10}}>
        <button className="primary" style={{...S.primaryBtn,flex:1,marginTop:0, ...(isNa?{background:"var(--sub)",color:"#fff"}:{})}} onClick={submit}>
          {isNa ? "MARK N/A (locks)" : isEdit ? "SAVE EDIT" : "CHECK OFF (locks)"}
        </button>
        <button className="ghost" style={S.ghostBtn} onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function ExtraEquipForm({ employees, onSave, onCancel, isEdit, initialEquipName, initialModel, initialSerial }) {
  const [equipName,setEquipName]=useState(initialEquipName||"");
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState(employees.length===0);
  const [model,setModel]=useState(initialModel||""); const [serial,setSerial]=useState(initialSerial||"");
  const submit=()=>{ const name=useTyped?typed:sel; if(!equipName.trim())return alert("Name the equipment."); if(!name.trim())return alert("Pick or type a name."); if(!model.trim())return alert("Model # is required."); if(!serial.trim())return alert("Serial # is required."); onSave(equipName,name,model,serial); };
  return (
    <div style={S.checkForm}>
      {isEdit && <div style={{fontSize:12, color:"var(--amber)", fontWeight:600, marginBottom:8, letterSpacing:.5}}>EDITING MODEL / SERIAL</div>}
      <label style={S.fieldLabel}>EQUIPMENT</label>
      <input style={S.input} placeholder="e.g. RO Drinking Water System" value={equipName} onChange={e=>setEquipName(e.target.value)} disabled={isEdit} />
      <div style={{marginTop:10}}><NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} /></div>
      <div style={{...S.formRow,marginTop:10}}>
        <div style={{flex:1}}><label style={S.fieldLabel}>MODEL # <span style={{color:"var(--amber)"}}>*</span></label><input style={S.input} value={model} onChange={e=>setModel(e.target.value)} /></div>
        <div style={{flex:1}}><label style={S.fieldLabel}>SERIAL # <span style={{color:"var(--amber)"}}>*</span></label><input style={S.input} value={serial} onChange={e=>setSerial(e.target.value)} /></div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:10}}>
        <button className="primary" style={{...S.primaryBtn,flex:1,marginTop:0}} onClick={submit}>{isEdit?"SAVE EDIT":"SAVE EQUIPMENT"}</button>
        <button className="ghost" style={S.ghostBtn} onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

// ---- Notes (name via employee dropdown; single open box good for talk-to-text) ----
function Notes({ project, trade, entries, saveEntries, employees }) {
  const [work,setWork]=useState("");
  const [todoInput,setTodoInput]=useState("");
  const [todoList,setTodoList]=useState([]); // items being added before save
  const [matInput,setMatInput]=useState("");
  const [matList,setMatList]=useState([]);
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState(employees.length===0);

  const notes=entries.filter(e=>e.type==="note"&&e.projectId===project.id&&e.trade===trade).sort((a,b)=>b.id.localeCompare(a.id));

  // collect all open loop items across this job's trade — preserve which note each came from
  const openTodos=[]; const openMaterials=[];
  notes.forEach(n=>{
    (n.todos||[]).forEach(t=>{ if(!t.closedTs) openTodos.push({...t, noteId:n.id, createdBy:n.name, createdTs:n.ts}); });
    (n.materials||[]).forEach(m=>{ if(!m.closedTs) openMaterials.push({...m, noteId:n.id, createdBy:n.name, createdTs:n.ts}); });
  });

  const addTodoInline=()=>{ const v=todoInput.trim(); if(!v) return; setTodoList([...todoList,{id:uid(),text:v}]); setTodoInput(""); };
  const removeTodoInline=(id)=> setTodoList(todoList.filter(t=>t.id!==id));
  const addMatInline=()=>{ const v=matInput.trim(); if(!v) return; setMatList([...matList,{id:uid(),text:v}]); setMatInput(""); };
  const removeMatInline=(id)=> setMatList(matList.filter(m=>m.id!==id));

  const addNote=()=>{
    const name=useTyped?typed:sel;
    if(!name.trim())return alert("Pick or type a name.");
    // Auto-fold any text still sitting in the input boxes into the lists,
    // so a tech who types one item and hits SAVE doesn't lose it.
    const pendingTodo = todoInput.trim();
    const pendingMat  = matInput.trim();
    const finalTodos = pendingTodo ? [...todoList, {id:uid(), text:pendingTodo}] : todoList;
    const finalMats  = pendingMat  ? [...matList,  {id:uid(), text:pendingMat}]  : matList;
    if(!work.trim() && finalTodos.length===0 && finalMats.length===0) return alert("Fill in at least one section before saving.");
    const note = {
      id:uid(), type:"note", projectId:project.id, trade, name:name.trim(), ts:stamp(), day:todayKey(),
      work: work.trim(),
      todos: finalTodos.map(t=>({id:t.id, text:t.text, createdName:name.trim(), createdTs:stamp()})),
      materials: finalMats.map(m=>({id:m.id, text:m.text, createdName:name.trim(), createdTs:stamp()})),
      addenda:[],
    };
    saveEntries([note,...entries]);
    setWork(""); setTodoList([]); setMatList([]); setTodoInput(""); setMatInput("");
  };

  const closeItem = (noteId, kind, itemId, byName) => {
    saveEntries(entries.map(e=>{
      if(e.id!==noteId) return e;
      const list=(e[kind]||[]).map(it=> it.id===itemId ? {...it, closedBy:byName, closedTs:stamp()} : it);
      return {...e, [kind]:list};
    }));
  };

  const addAddendum=(noteId,an,at)=> saveEntries(entries.map(e=> e.id===noteId?{...e,addenda:[...(e.addenda||[]),{id:uid(),name:an.trim(),text:at.trim(),ts:stamp()}]}:e));

  return (
    <div>
      {/* Open loops pinned to the top */}
      {(openTodos.length>0 || openMaterials.length>0) && (
        <div style={S.openLoopsBox}>
          <div style={S.openLoopsHead}>OPEN ITEMS ON THIS JOB · {trade}</div>
          {openTodos.length>0 && (
            <div style={{marginBottom: openMaterials.length>0?12:0}}>
              <div style={S.openLoopsSub}>Still needs to be done</div>
              {openTodos.map(t=>(
                <OpenLoopRow key={t.id} item={t} kind="todos" employees={employees} onClose={(by)=>closeItem(t.noteId,"todos",t.id,by)} />
              ))}
            </div>
          )}
          {openMaterials.length>0 && (
            <div>
              <div style={S.openLoopsSub}>Materials needed next trip</div>
              {openMaterials.map(m=>(
                <OpenLoopRow key={m.id} item={m} kind="materials" employees={employees} onClose={(by)=>closeItem(m.noteId,"materials",m.id,by)} />
              ))}
            </div>
          )}
        </div>
      )}

      {/* New note form */}
      <SectionTitle>NEW NOTE</SectionTitle>
      <div style={S.nameWrap}>
        <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
      </div>
      <label style={S.fieldLabel}>WORK COMPLETED TODAY</label>
      <textarea style={S.textarea} rows={3} placeholder={`What did you finish today on the ${trade.toLowerCase()} scope?  (mic on keyboard works)`} value={work} onChange={e=>setWork(e.target.value)} />

      <div style={{marginTop:14}}>
        <label style={S.fieldLabel}>STILL NEEDS TO BE DONE</label>
        <div style={{display:"flex",gap:8}}>
          <input style={{...S.input,flex:1}} placeholder="e.g. install sillcocks" value={todoInput} onChange={e=>setTodoInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addTodoInline();}} />
          <button className="ghost" style={{...S.ghostBtn,padding:"8px 14px",border:`1px solid var(--line)`,borderRadius:8}} onClick={addTodoInline}>+ ADD</button>
        </div>
        {todoList.map(t=>(
          <div key={t.id} style={S.pendingRow}>
            <span style={{flex:1}}>• {t.text}</span>
            <button className="ghost" style={S.ghostBtn} onClick={()=>removeTodoInline(t.id)}>✕</button>
          </div>
        ))}
      </div>

      <div style={{marginTop:14}}>
        <label style={S.fieldLabel}>MATERIALS NEEDED NEXT TRIP</label>
        <div style={{display:"flex",gap:8}}>
          <input style={{...S.input,flex:1}} placeholder="e.g. two 3/4 90s" value={matInput} onChange={e=>setMatInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addMatInline();}} />
          <button className="ghost" style={{...S.ghostBtn,padding:"8px 14px",border:`1px solid var(--line)`,borderRadius:8}} onClick={addMatInline}>+ ADD</button>
        </div>
        {matList.map(m=>(
          <div key={m.id} style={S.pendingRow}>
            <span style={{flex:1}}>• {m.text}</span>
            <button className="ghost" style={S.ghostBtn} onClick={()=>removeMatInline(m.id)}>✕</button>
          </div>
        ))}
      </div>

      <button className="primary" style={S.primaryBtn} onClick={addNote}>SAVE NOTE (locks on save)</button>
      <p style={S.hint}>Saved notes can't be edited. Open items above can be checked off by anyone when they're done — those records stay.</p>

      <SectionTitle>NOTE HISTORY — {trade}</SectionTitle>
      <div style={S.noteFeed}>
        {notes.length===0 && <div style={S.noNotes}>No notes yet for {trade}.</div>}
        {notes.map(n=><NoteCard key={n.id} note={n} onAddendum={addAddendum} employees={employees} onCloseItem={closeItem} />)}
      </div>
    </div>
  );
}

  const submit=()=>{ const by=useTyped?typed:sel; if(!by.trim()) return alert("Pick or type a name."); onClose(by.trim()); setOpen(false); setSel(""); setTyped(""); };

    <div style={S.openLoopRow}>
      <div style={{flex:1}}>

    </div>

}

// ---- Procurement (field side: techs request materials per trade) ----
function FieldProcurement({ project, trade, procurement, saveProcurement, employees }) {
  const [item,setItem]=useState(""); const [qty,setQty]=useState("");
  const [requiredBy,setRequiredBy]=useState("");
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState(employees.length===0);

  // Filter out soft-deleted requests from the field view (techs don't need to see them)
  const myReqs = (procurement||[]).filter(r=>r.projectId===project.id && r.trade===trade && !r.deleted).sort((a,b)=>b.id.localeCompare(a.id));

  const submit=()=>{
    const name=useTyped?typed:sel;
    if(!name.trim()) return alert("Pick or type a name.");
    if(!item.trim()) return alert("Item name is required.");
    if(!String(qty).trim()) return alert("Quantity is required.");
    const rec = {
      id:uid(), projectId:project.id, trade,
      item:item.trim(), qty:String(qty).trim(),
      requiredBy: requiredBy || "",
      name:name.trim(), ts:stamp(), day:todayKey(),
      status:"Requested", history:[]
    };
    saveProcurement([rec, ...(procurement||[])]);
    setItem(""); setQty(""); setRequiredBy("");
  };

  const statusColor=(s)=> s==="Received"?"var(--green)": s==="Ordered"?"var(--amber)":"var(--sub)";

  return (
    <div>
      <div style={S.nameWrap}>
        <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
      </div>
      <div style={S.formRow}>
        <div style={{flex:2}}><label style={S.fieldLabel}>ITEM *</label><input style={S.input} value={item} onChange={e=>setItem(e.target.value)} placeholder={`e.g. 3/4" copper elbows`} /></div>
        <div style={{flex:1}}><label style={S.fieldLabel}>QTY *</label><input style={S.input} value={qty} onChange={e=>setQty(e.target.value)} placeholder="e.g. 25" /></div>
      </div>
      <div style={{marginTop:10}}>
        <label style={S.fieldLabel}>MATERIALS REQUIRED BY (optional)</label>
        <input type="date" style={S.input} value={requiredBy} onChange={e=>setRequiredBy(e.target.value)} />
      </div>
      <button className="primary" style={S.primaryBtn} onClick={submit}>+ REQUEST MATERIAL</button>
      <p style={S.hint}>The office sees your request and updates its status as it gets ordered and received.</p>

      <SectionTitle>YOUR REQUESTS — {trade}</SectionTitle>
      {myReqs.length===0 && <div style={S.noNotes}>No material requests on this job yet.</div>}
      {myReqs.map(r=>(
        <div key={r.id} style={S.noteCard}>
          <div style={S.noteHead}>
            <span style={S.noteAuthor}>{r.item} × {r.qty}</span>
            <span style={{...S.statusPill, color:statusColor(r.status), borderColor:statusColor(r.status)}}>{r.status}</span>
          </div>
          <div style={S.adminMeta}>requested by {r.name} · {r.ts}</div>
          {r.requiredBy && <div style={{...S.adminMeta, color:"var(--amber)", fontWeight:600}}>Required by {fmtDate(r.requiredBy)}</div>}
          {(r.history||[]).map(h=>(
            <div key={h.id} style={S.addendum}>
              <div style={S.addHead}>↳ {h.status} · {h.by} · {h.ts}</div>
              {h.note && <div style={S.addBody}>{h.note}</div>}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}


// ---- Extras (field side: per-job per-trade extras) ----
function FieldExtras({ project, trade, extras, saveExtras, employees, printSingleExtra }) {
  const [openId,setOpenId]=useState(null); // id of extra currently being edited, or "__new__" for the new form
  const myExtras = (extras||[]).filter(x=>x.projectId===project.id && x.trade===trade).sort((a,b)=>b.id.localeCompare(a.id));

  const createExtra = (description, createdBy) => {
    const rec = {
      id: uid(),
      projectId: project.id,
      trade,
      description: description.trim(),
      materials: [],
      time: [],
      status: "In Progress", // In Progress | Ready to Bill | Billed
      createdBy: createdBy.trim(),
      createdTs: stamp(),
      day: todayKey(),
      history: [],
    };
    saveExtras([rec, ...(extras||[])]);
    setOpenId(rec.id);
  };

  const updateExtra = (id, fn, historyEntry) => {
    saveExtras((extras||[]).map(x=> {
      if(x.id!==id) return x;
      const next = fn({...x});
      if(historyEntry) next.history = [...(x.history||[]), historyEntry];
      next.lastUpdatedTs = stamp();
      return next;
    }));
  };

  const setStatusOnExtra = (id, newStatus, by) => {
    updateExtra(id, x=>({...x, status:newStatus}), { id:uid(), status:newStatus, by:by.trim(), ts:stamp() });
  };

  return (
    <div>
      {openId !== "__new__" && (
        <button className="primary" style={S.primaryBtn} onClick={()=>setOpenId("__new__")}>+ NEW EXTRA</button>
      )}

      {openId === "__new__" && (
        <NewExtraForm employees={employees} onCancel={()=>setOpenId(null)} onSave={createExtra} />
      )}

      {myExtras.length===0 && openId !== "__new__" && (
        <div style={S.noNotes}>No extras logged for this {trade} scope.</div>
      )}

      {myExtras.map(x=>(
        <ExtraCard
          key={x.id}
          extra={x}
          project={project}
          isOpen={openId===x.id}
          onOpen={()=>setOpenId(openId===x.id?null:x.id)}
          employees={employees}
          onUpdate={updateExtra}
          onStatus={setStatusOnExtra}
          printSingleExtra={printSingleExtra}
        />
      ))}
    </div>
  );
}

function NewExtraForm({ employees, onCancel, onSave }) {
  const [desc,setDesc]=useState("");
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState((employees||[]).length===0);
  const submit=()=>{
    const by = useTyped?typed:sel;
    if(!by.trim()) return alert("Pick or type a name.");

        <label style={S.fieldLabel}>DESCRIPTION OF EXTRA *</label>
        <textarea style={S.textarea} rows={3} placeholder="What's this extra for? (mic on keyboard works)" value={desc} onChange={e=>setDesc(e.target.value)} />
      </div>

function ExtraCard({ extra, project, isOpen, onOpen, employees, onUpdate, onStatus, printSingleExtra }) {
  const x = extra;
  const isLocked = x.status === "Billed";
  const statusColor = x.status==="Billed" ? "var(--green)" : x.status==="Ready to Bill" ? "var(--amber)" : "var(--sub)";
  const totalHours = (x.time||[]).reduce((s,t)=>s+(parseFloat(t.hours)||0), 0);

  // material form state
  const [mQty,setMQty]=useState(""); const [mDesc,setMDesc]=useState("");
  // time form state
  const [tSel,setTSel]=useState(""); const [tTyped,setTTyped]=useState(""); const [tUseTyped,setTUseTyped]=useState((employees||[]).length===0);
  const [tDate,setTDate]=useState(todayKey()); const [tHours,setTHours]=useState("");
  // description edit
  const [editDesc,setEditDesc]=useState(false); const [descDraft,setDescDraft]=useState(x.description);
  // status change picker
  const [statusPicker,setStatusPicker]=useState(null); // "Ready to Bill" | "In Progress" — Billed is office-only
  const [sSel,setSSel]=useState(""); const [sTyped,setSTyped]=useState(""); const [sUseTyped,setSUseTyped]=useState((employees||[]).length===0);

  const addMaterial = ()=>{
    if(isLocked) return;
    if(!mQty.trim() || !mDesc.trim()) return alert("Enter quantity and description.");
    onUpdate(x.id, e=>({...e, materials:[...(e.materials||[]), {id:uid(), qty:mQty.trim(), desc:mDesc.trim(), ts:stamp()}]}));
    setMQty(""); setMDesc("");
  };
  const removeMaterial = (id)=>{
    if(isLocked) return;
    if(!confirm("Remove this material line?")) return;
    onUpdate(x.id, e=>({...e, materials:(e.materials||[]).filter(m=>m.id!==id)}));
  };
  const addTime = ()=>{
    if(isLocked) return;
    const by = tUseTyped?tTyped:tSel;
    if(!by.trim()) return alert("Pick or type a name.");
    if(!tDate) return alert("Pick a date.");
    if(!tHours.trim() || isNaN(parseFloat(tHours))) return alert("Enter hours.");
    onUpdate(x.id, e=>({...e, time:[...(e.time||[]), {id:uid(), name:by.trim(), date:tDate, hours:tHours.trim()}]}));
    setTHours(""); setTSel(""); setTTyped("");
  };
  const removeTime = (id)=>{
    if(isLocked) return;
    if(!confirm("Remove this time entry?")) return;
    onUpdate(x.id, e=>({...e, time:(e.time||[]).filter(t=>t.id!==id)}));
  };
  const saveDescEdit = ()=>{
    if(!descDraft.trim()) return alert("Description can't be empty.");
    onUpdate(x.id, e=>({...e, description:descDraft.trim()}));
    setEditDesc(false);
  };
  const applyStatusChange = ()=>{
    const by = sUseTyped?sTyped:sSel;
    if(!by.trim()) return alert("Pick or type your name.");
    onStatus(x.id, statusPicker, by);
    setStatusPicker(null); setSSel(""); setSTyped("");
  };

  const printThisExtra = ()=>{
    printSingleExtra(x.id);
  };

  return (
    <div style={{...S.noteCard, ...(isOpen?{borderColor:"var(--amber)"}:{})}}>
      <div style={S.noteHead}>
        <span style={S.noteAuthor}>EXTRA · {x.description.slice(0,40)}{x.description.length>40?"…":""}</span>
        <span style={{...S.statusPill, color:statusColor, borderColor:statusColor}}>{x.status}</span>
      </div>
      <div style={S.adminMeta}>created by {x.createdBy} · {x.createdTs}</div>
      {x.lastUpdatedTs && <div style={S.adminMeta}>last updated {x.lastUpdatedTs}</div>}

      {!isOpen ? (
        <button className="ghost" style={S.ghostBtn} onClick={onOpen}>+ Open / edit</button>
      ) : (
        <div>
          {/* Description */}
          <div style={S.extraSection}>
            <div style={S.extraSectionHead}>DESCRIPTION</div>
            {!editDesc ? (
              <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                <div style={{flex:1, whiteSpace:"pre-wrap"}}>{x.description}</div>
                {!isLocked && <button className="ghost" style={S.editBtn} onClick={()=>{setDescDraft(x.description); setEditDesc(true);}}>EDIT</button>}
              </div>
            ) : (
              <div>

// Iterate dates in inclusive range [fromStr, toStr] as YYYY-MM-DD strings
function ptoDatesInRange(fromStr, toStr) {
  const out=[];
  const a=new Date(fromStr+"T00:00:00"); const b=new Date(toStr+"T00:00:00");
  if(isNaN(a)||isNaN(b)) return out;
  const lo=a<=b?a:b, hi=a<=b?b:a;
  const d=new Date(lo);
  while(d<=hi){
    out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
    d.setDate(d.getDate()+1);
  }
  return out;
}
function fmtDate(s){
  if(!s) return "";
  const d=new Date(s+"T00:00:00");
  if(isNaN(d)) return s;
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
// Format US phone numbers for display. Pass through anything that isn't a clean 10 or 11-digit US number.
function fmtPhone(s){
  if(!s) return "";
  const digits = String(s).replace(/\D/g,"");
  if(digits.length===10) return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
  if(digits.length===11 && digits[0]==="1") return `1 (${digits.slice(1,4)}) ${digits.slice(4,7)}-${digits.slice(7)}`;
  return s; // extensions, international, partials — show raw
}
function ptoDayLabel(req){
  if(req.dayMode==="am") return "½ day AM";
  if(req.dayMode==="pm") return "½ day PM";
  return "Full days";
}
function ptoDays(req){
  const days = ptoDatesInRange(req.from, req.to).length;
  if(req.dayMode==="am" || req.dayMode==="pm") return 0.5;
  return days;
}

  const [showForm,setShowForm]=useState(false);

function PtoRequestForm({ employees, onSave, onCancel, initialName }) {
  const [sel,setSel]=useState(initialName||""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState((employees||[]).length===0);
  const [from,setFrom]=useState(todayKey()); const [to,setTo]=useState(todayKey());
  const [dayMode,setDayMode]=useState("full"); // full | am | pm
  const [note,setNote]=useState("");

  const submit=()=>{
    const name=useTyped?typed:sel;
    if(!name.trim()) return alert("Pick or type a name.");
    if(!from || !to) return alert("Pick start and end dates.");
    if(dayMode!=="full" && from!==to){ if(!confirm("Half-day is selected, but the dates are different. Save anyway?")) return; }
    const req = {
      id:uid(),
      name:name.trim(),
      from: from<=to?from:to,
      to:   from<=to?to:from,
      dayMode,
      note:note.trim(),
      ts: stamp(),
      status: "Pending",
      history: [],
    };
    onSave(req);
  };

  return (
    <div style={S.formCard}>
      <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
      <div style={{...S.formRow, marginTop:10}}>
        <div style={{flex:1}}><label style={S.fieldLabel}>START DATE</label><input type="date" style={S.input} value={from} onChange={e=>setFrom(e.target.value)} /></div>
        <div style={{flex:1}}><label style={S.fieldLabel}>END DATE</label><input type="date" style={S.input} value={to} onChange={e=>setTo(e.target.value)} /></div>
      </div>
      <div style={{marginTop:12}}>
        <label style={S.fieldLabel}>FULL DAY OR HALF DAY</label>
        <div style={S.tradeRow}>
          <button className="trade" style={{...S.tradeBtn, ...(dayMode==="full"?S.tradeOn:{})}} onClick={()=>setDayMode("full")}>Full days</button>
          <button className="trade" style={{...S.tradeBtn, ...(dayMode==="am"?S.tradeOn:{})}} onClick={()=>setDayMode("am")}>½ Day AM</button>
          <button className="trade" style={{...S.tradeBtn, ...(dayMode==="pm"?S.tradeOn:{})}} onClick={()=>setDayMode("pm")}>½ Day PM</button>
        </div>
      </div>
      <div style={{marginTop:12}}>
        <label style={S.fieldLabel}>NOTE (optional)</label>
        <textarea style={S.textarea} rows={2} placeholder="Anything the office should know" value={note} onChange={e=>setNote(e.target.value)} />
      </div>
      <div style={{display:"flex",gap:8,marginTop:10}}>
        <button className="primary" style={{...S.primaryBtn,flex:1,marginTop:0}} onClick={submit}>SUBMIT REQUEST</button>
        <button className="ghost" style={S.ghostBtn} onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

// ---- PTO Calendar (list default, month grid toggle) ----
// ---- FullCalendar — weekly + monthly views, showing PTO + job assignments together ----
function FullCalendar({ pto, assignments, projects, readOnly, onTvMode }) {
  const [mode,setMode]=useState("week"); // week | month
  const approved = (pto||[]).filter(r=>r.status==="Approved");
  const tk = todayKey();
  const projById = {}; (projects||[]).forEach(p=>{ projById[p.id]=p; });

  // Helpers shared by both views
  const dateKey = (d)=> d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const ptoOn   = (key)=> approved.filter(r=> key>=r.from && key<=r.to);
  const asgnOn  = (key)=> (assignments||[]).filter(a=> a.date===key);

  // ---- Week state ----
  const [weekCursor,setWeekCursor]=useState(()=>{
    // start of current week (Monday)
    const d=new Date(); const day=d.getDay(); // 0 Sun..6 Sat
    const diff=(day===0? -6 : 1-day); // shift to Monday
    d.setDate(d.getDate()+diff);
    return d;
  });
  const weekDays = []; for(let i=0;i<6;i++){ const d=new Date(weekCursor); d.setDate(weekCursor.getDate()+i); weekDays.push(d); }
  const weekLabel = `${weekDays[0].toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${weekDays[5].toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`;
  const prevWeek = ()=> { const d=new Date(weekCursor); d.setDate(weekCursor.getDate()-7); setWeekCursor(d); };
  const nextWeek = ()=> { const d=new Date(weekCursor); d.setDate(weekCursor.getDate()+7); setWeekCursor(d); };
  const goThisWeek = ()=>{
    const d=new Date(); const day=d.getDay();
    const diff=(day===0?-6:1-day); d.setDate(d.getDate()+diff); setWeekCursor(d);
  };

  // ---- Month state ----
  const [cursor,setCursor]=useState(()=>{ const d=new Date(); return { y:d.getFullYear(), m:d.getMonth() }; });
  const monthLabel = new Date(cursor.y, cursor.m, 1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const prev = ()=> setCursor(c=>{ const m=c.m-1; return m<0 ? {y:c.y-1, m:11} : {y:c.y, m}; });
  const next = ()=> setCursor(c=>{ const m=c.m+1; return m>11 ? {y:c.y+1, m:0} : {y:c.y, m}; });
  const goToday = ()=> { const d=new Date(); setCursor({y:d.getFullYear(), m:d.getMonth()}); };
  const firstOfMonth = new Date(cursor.y, cursor.m, 1);
  const startDow = firstOfMonth.getDay();
  const gridStart = new Date(cursor.y, cursor.m, 1 - startDow);
  const cells = [];
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const key = dateKey(d);
    const inMonth = d.getMonth()===cursor.m;
    const isToday = key===tk;
    cells.push({ key, day:d.getDate(), inMonth, isToday, ptoHere: ptoOn(key), asgnHere: asgnOn(key) });
  }

  const dayModeShort = (dm)=> dm==="am"?"½ AM": dm==="pm"?"½ PM":"";

  return (
    <div>
      <SectionTitle>CALENDAR</SectionTitle>
      <div style={S.tradeRow}>
        <button className="trade" style={{...S.tradeBtn, ...(mode==="week"?S.tradeOn:{})}} onClick={()=>setMode("week")}>Week</button>
        <button className="trade" style={{...S.tradeBtn, ...(mode==="month"?S.tradeOn:{})}} onClick={()=>setMode("month")}>Month grid</button>
        {onTvMode && (
          <button className="trade" style={{...S.tradeBtn, marginLeft:"auto", background:"#1a1a1a", color:"var(--amber)", borderColor:"var(--amber)"}} onClick={onTvMode} title="Fullscreen view for the shop TV">📺 TV View</button>
        )}
      </div>

      {mode==="week" ? (
        <div style={{marginTop:14}}>
          <div style={S.calNav}>
            <button className="ghost" style={S.calNavBtn} onClick={prevWeek}>‹ Prev</button>
            <button className="ghost" style={S.calNavBtn} onClick={goThisWeek}>This week</button>
            <div style={S.calLabel}>{weekLabel}</div>
            <button className="ghost" style={S.calNavBtn} onClick={nextWeek}>Next ›</button>
          </div>
          <div style={S.weekGrid}>
            {weekDays.map((d,i)=>{
              const key = dateKey(d);
              const isToday = key===tk;
              const dayPto = ptoOn(key);
              const dayAsgn = asgnOn(key);
              // group assignments by projectId+trade
              const groups = {};
              dayAsgn.forEach(a=>{ const k=a.projectId+"|"+a.trade; (groups[k]=groups[k]||[]).push(a); });
              const isSat = d.getDay()===6;
              return (
                <div key={i} style={{...S.weekDay, ...(isToday?S.weekDayToday:{}), ...(isSat?{opacity:.75}:{})}}>
                  <div style={S.weekDayHead}>
                    <div style={S.weekDayName}>{d.toLocaleDateString("en-US",{weekday:"short"}).toUpperCase()}</div>
                    <div style={S.weekDayNum}>{d.getDate()}</div>
                  </div>
                  {Object.keys(groups).length===0 && dayPto.length===0 && (
                    <div style={S.weekEmpty}>—</div>
                  )}
                  {Object.entries(groups).map(([k,list])=>{
                    const [pid,trade]=k.split("|");
                    const proj = projById[pid];
                    return (
                      <div key={k} style={S.weekJobBlock}>
                        <div style={S.weekJobName}>{proj?proj.name:"(unknown)"}<span style={S.weekJobTrade}> · {trade}</span></div>
                        {list.map(a=>(
                          <div key={a.id} style={S.weekTechLine}>
                            {a.name}{a.dayMode!=="full"?<span style={S.weekHalfTag}> {dayModeShort(a.dayMode)}</span>:""}
                          </div>
                        ))}
                      </div>
                    );
                  })}
                  {dayPto.length>0 && (
                    <div style={S.weekPtoBlock}>
                      <div style={S.weekPtoHead}>TIME OFF</div>
                      {dayPto.map(r=>(
                        <div key={r.id} style={S.weekTechLine}>{r.name}{r.dayMode!=="full"?<span style={S.weekHalfTag}> {dayModeShort(r.dayMode)}</span>:""}</div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ) : (
        <div style={{marginTop:14}}>
          <div style={S.calNav}>
            <button className="ghost" style={S.calNavBtn} onClick={prev}>‹ Prev</button>
            <button className="ghost" style={S.calNavBtn} onClick={goToday}>Today</button>
            <div style={S.calLabel}>{monthLabel}</div>
            <button className="ghost" style={S.calNavBtn} onClick={next}>Next ›</button>
          </div>
          <div style={S.calGrid}>
            {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} style={S.calHeadCell}>{d}</div>)}
            {cells.map((c,i)=>{
              const totalChips = c.asgnHere.length + c.ptoHere.length;
              const visibleAsgn = c.asgnHere.slice(0, 3);
              const visiblePto = c.ptoHere.slice(0, Math.max(0, 3-visibleAsgn.length));
              const overflow = totalChips - (visibleAsgn.length + visiblePto.length);
              return (
                <div key={i} style={{...S.calCell, ...(c.inMonth?{}:S.calCellDim), ...(c.isToday?S.calCellToday:{})}}>
                  <div style={S.calDayNum}>{c.day}</div>
                  {visibleAsgn.map(a=>{
                    const proj = projById[a.projectId];
                    const projShort = proj ? proj.name.split(" ")[0] : "?";
                    return <div key={a.id} style={S.calAsgnChip} title={`${a.name} · ${proj?proj.name:""} · ${a.trade}${a.dayMode!=="full"?" · "+dayModeShort(a.dayMode):""}`}>{projShort}·{a.name.split(" ")[0]}</div>;
                  })}
                  {visiblePto.map(r=>(
                    <div key={r.id} style={S.calPtoChip} title={`${r.name} · PTO · ${ptoDayLabel(r)}`}>PTO·{r.name.split(" ")[0]}{r.dayMode!=="full"?"·½":""}</div>
                  ))}
                  {overflow>0 && <div style={S.calMore}>+{overflow}</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

                return (

                    <div style={S.tvJobName}>{proj?proj.name:"(unknown)"}<span style={S.tvJobTrade}> · {trade}</span></div>
                    {list.map(a=>(
                      <div key={a.id} style={S.tvTechLine}>
                        {a.name}{a.dayMode!=="full"?<span style={S.tvHalfTag}> {dayModeShort(a.dayMode)}</span>:""}
                      </div>
                    ))}
                  </div>
                );
              })}
              {dayPto.length>0 && (
                <div style={S.tvPtoBlock}>
                  <div style={S.tvPtoHead}>TIME OFF</div>
                  {dayPto.map(r=>(
                    <div key={r.id} style={S.tvTechLine}>{r.name}{r.dayMode!=="full"?<span style={S.tvHalfTag}> {dayModeShort(r.dayMode)}</span>:""}</div>
                  ))}

              )}
            </div>
          );

      </div>

    </div>
  );
}
