<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#15171c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FieldLog" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>FieldLog — Job Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171c;--panel:#1d2026;--panel2:#22262e;--line:#2e333d;
    --ink:#eef0f3;--sub:#8b93a1;--amber:#f5a623;--green:#3ecf8e;--red:#e5484d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;}
  body{min-height:100vh;}
  #root{max-width:920px;margin:0 auto;min-height:100vh;}
  input,select,textarea,button{font-family:inherit;}
  input,select,textarea{font-family:'Barlow',sans-serif;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber)!important;}
  ::placeholder{color:#5c6470;}
  .seg:active,.padkey:active,.jobcard:active,.trade:active,.primary:active,.danger:active{transform:scale(.97);}
  .padkey,.seg,.primary,.danger,.ghost,.jobcard,.trade,.checkrow,.backbtn,.lockbtn{transition:all .12s ease;}
  .padkey:hover{background:var(--panel2);border-color:var(--amber);}
  .jobcard:hover{border-color:var(--amber);transform:translateY(-2px);}
  .primary:hover{filter:brightness(1.08);}
  .checkrow:hover{background:var(--panel2);}
  .ghost:hover{color:var(--amber);}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;}

  /* ---- Print ---- */
  .print-area{ display:none; }
  @media print{
    @page{ margin:14mm; }
    html,body{ background:#fff !important; color:#000 !important; }
    /* hide everything, then reveal only the print area */
    body * { visibility:hidden !important; }
    .print-area, .print-area * { visibility:visible !important; }
    .print-area{
      display:block !important; position:absolute; left:0; top:0; width:100%;
      color:#000; font-family:'Barlow',Arial,sans-serif;
    }
    .print-header{ border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:14px; }
    .print-company{ font-family:'Oswald',Arial,sans-serif; font-size:22px; font-weight:700; }
    .print-title{ font-size:15px; font-weight:600; margin-top:2px; }
    .print-dates{ font-size:13px; color:#333; margin-top:2px; }
    .print-summary{ font-size:12px; color:#333; margin-bottom:14px; }
    .print-section{ font-family:'Oswald',Arial,sans-serif; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #999; padding-bottom:3px; margin:18px 0 10px; }
    .print-block{ margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #ddd; page-break-inside:avoid; }
    .print-block-head{ font-weight:700; font-size:13px; }
    .print-meta{ font-size:12px; color:#444; margin:2px 0 4px; }
    .print-body{ font-size:13px; white-space:pre-wrap; line-height:1.4; }
    .print-addendum{ font-size:12px; color:#222; margin-top:6px; padding-left:10px; border-left:2px solid #999; white-space:pre-wrap; }
    .print-check{ font-size:13px; padding:3px 0; }
    .print-equip{ font-size:12px; color:#444; padding-left:14px; }
    .print-empty{ font-size:12px; color:#666; font-style:italic; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// =================== CONFIG ===================
const OFFICE_PIN = "1234"; // change this value and redeploy to update the office PIN
const COMPANY_NAME = "DRG Mechanical, Inc."; // shown on printed reports

const WORK_TYPES = ["Plumbing", "HVAC", "In-Floor"];

// ---- CHECKLISTS ----
// Each trade is a list of SECTIONS. Each section has a title and items.
// An item is either a plain string, or {label, equipment:true} for items
// that should also capture Model # and Serial #.
const CHECKLISTS = {
  Plumbing: [
    { section: "DWV", items: [
      "Groundwork done/tested",
      "Sump Line done",
      "Nail Plated",
      "Overflows Checked",
      "Above ground done/tested",
      "Test Caps pulled",
      "Tubs/Showers Trapped",
      "Tub Showers Set",
    ]},
    { section: "Waterlines", items: [
      "Water Lines Dropped",
      "Basement Finish Done",
      "Mechanical Room Done",
      "Nail Plated",
      "Sprinkler Line Piped",
      { label: "Softener Done", equipment: true },
      { label: "Water Heater Installed", equipment: true },
      "Sioux Falls Inspected (1)",
      "Sioux Falls Inspected (2)",
      "Sioux Falls Inspected (3)",
      "Desuperheater done",
      "Valves for Sillcocks (MN)",
    ]},
    { section: "Gas Line", items: [
      "Ran back to Mechanical Room",
      "Mechanical room piped",
      "Fire water heater",
      "Sioux Falls Inspected (1)",
      "Sioux Falls Inspected (2)",
      "MN Inspected",
      "High pressure gas tag",
    ]},
    { section: "Finish", items: [
      "Fixtures Set",
      "Dishwasher lines ran",
      "Check hot/cold connections",
      "Clean out Covers on",
      "Icemaker lines run",
      "Done/Final Inspection",
      "Fixtures Caulked",
      "Dishwasher set",
      "Water temps set (delta)",
      "Clean outs doped",
      "Icemaker lines connected",
      "Material list complete",
    ]},
  ],
  // Placeholder starter lists — swap with real sheets later.
  HVAC: [
    { section: "Rough-In", items: [
      "Verify equipment matches submittal",
      "Set & secure ductwork / trunk lines",
      "Seal all duct joints",
      { label: "Air Handler / Furnace", equipment: true },
    ]},
    { section: "Finish", items: [
      "Connect refrigerant lines & evacuate",
      "Charge system to spec",
      "Wire thermostat & controls",
      "Test airflow at all registers",
      "Verify condensate drain & safety switch",
      "Clean up & remove debris",
    ]},
  ],
  "In-Floor": [
    { section: "Layout", items: [
      "Confirm slab/subfloor prepped & clean",
      "Lay out tubing per design spacing",
      "Secure tubing (clips/staples/rails)",
      "Connect manifolds & label loops",
    ]},
    { section: "Test & Finish", items: [
      "Pressure test loops (hold PSI)",
      "Photograph layout before pour/cover",
      "Verify pressure held during pour",
      { label: "Pump / Mixing Valve", equipment: true },
      "Test circulation & flow per loop",
      "Clean up & remove debris",
    ]},
  ],
};

// =================== DATA LAYER ===================
const API = "/api/data";
async function loadAll() {
  const r = await fetch(API);
  if (!r.ok) throw new Error("load failed (" + r.status + ")");
  return r.json();
}
async function saveCollection(collection, data) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ collection, data }),
  });
  if (!r.ok) throw new Error("save failed (" + r.status + ")");
  return r.json();
}

// =================== HELPERS ===================
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const stamp = () => new Date().toLocaleString("en-US", { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" });
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const itemLabel = (it) => typeof it === "string" ? it : it.label;
const itemIsEquip = (it) => typeof it === "object" && it.equipment;

// =================== APP ===================
function App() {
  const [status, setStatus] = useState("loading");
  const [errMsg, setErrMsg] = useState("");
  const [side, setSide] = useState("field");
  const [officeAuthed, setOfficeAuthed] = useState(false);
  const [syncing, setSyncing] = useState(false);

  const [projects, setProjects] = useState([]);
  const [contractors, setContractors] = useState([]);
  const [entries, setEntries] = useState([]);
  const [employees, setEmployees] = useState([]);

  const refresh = useCallback(async () => {
    try {
      const d = await loadAll();
      setProjects(d.projects || []);
      setContractors(d.contractors || []);
      setEntries(d.entries || []);
      setEmployees(d.employees || []);
      setStatus("ok");
    } catch (e) { setErrMsg(String(e.message || e)); setStatus("error"); }
  }, []);
  useEffect(() => { refresh(); }, [refresh]);

  const persist = useCallback(async (collection, data, setter) => {
    setter(data); setSyncing(true);
    try { await saveCollection(collection, data); }
    catch (e) { alert("Couldn't save to the server — reloading latest data.\n\n" + (e.message || e)); await refresh(); }
    finally { setSyncing(false); }
  }, [refresh]);

  const saveProjects    = useCallback((p) => persist("projects", p, setProjects), [persist]);
  const saveContractors = useCallback((c) => persist("contractors", c, setContractors), [persist]);
  const saveEntries     = useCallback((e) => persist("entries", e, setEntries), [persist]);
  const saveEmployees   = useCallback((e) => persist("employees", e, setEmployees), [persist]);

  if (status === "loading") return (
    <div style={S.loadWrap}>
      <div style={S.loadMark}>FIELD<span style={{color:"var(--amber)"}}>LOG</span></div>
      <div style={S.spinner} /><div style={S.loadSub}>connecting…</div>
    </div>
  );
  if (status === "error") return (
    <div style={S.loadWrap}>
      <div style={S.loadMark}>FIELD<span style={{color:"var(--amber)"}}>LOG</span></div>
      <div style={{color:"var(--red)",marginTop:16,fontWeight:600}}>Couldn't reach the server</div>
      <div style={S.loadSub}>{errMsg}</div>
      <button className="primary" style={{...S.primaryBtn,maxWidth:200,marginTop:18}} onClick={()=>{setStatus("loading");refresh();}}>RETRY</button>
    </div>
  );

  return (
    <div>
      <Header side={side} setSide={setSide} authed={officeAuthed} resetAuth={()=>setOfficeAuthed(false)} syncing={syncing} onRefresh={refresh} />
      {side==="field" ? (
        <FieldSide projects={projects.filter(p=>!p.removed)} entries={entries} saveEntries={saveEntries} employees={employees} contractors={contractors} />
      ) : officeAuthed ? (
        <OfficeSide projects={projects} saveProjects={saveProjects} contractors={contractors} saveContractors={saveContractors} entries={entries} employees={employees} saveEmployees={saveEmployees} />
      ) : (
        <PinGate onUnlock={()=>setOfficeAuthed(true)} />
      )}
    </div>
  );
}

function Header({ side, setSide, authed, resetAuth, syncing, onRefresh }) {
  return (
    <header style={S.header}>
      <div style={S.brand}>FIELD<span style={{color:"var(--amber)"}}>LOG</span><span style={S.brandTag}>JOB TRACKING</span></div>
      <span title={syncing?"saving…":"synced"} className="syncdot" style={{background:syncing?"var(--amber)":"var(--green)"}} />
      <button className="lockbtn" style={{...S.lockBtn,padding:"8px 10px"}} onClick={onRefresh} title="Reload latest">⟳</button>
      <div style={S.toggle}>
        <button className="seg" onClick={()=>setSide("field")} style={{...S.segBtn,...(side==="field"?S.segOn:{})}}>FIELD</button>
        <button className="seg" onClick={()=>setSide("office")} style={{...S.segBtn,...(side==="office"?S.segOn:{})}}>OFFICE</button>
      </div>
      {side==="office" && authed && <button className="lockbtn" style={S.lockBtn} onClick={resetAuth}>🔒</button>}
    </header>
  );
}

function PinGate({ onUnlock }) {
  const [pin,setPin]=useState(""); const [err,setErr]=useState(false);
  const press=(d)=>{
    setErr(false);
    if(d==="del")return setPin(p=>p.slice(0,-1));
    if(d==="clr")return setPin("");
    setPin(p=>{
      if(p.length>=6) return p;
      const next=p+d;
      if(next===OFFICE_PIN){ setTimeout(onUnlock,150); }
      else if(next.length>=OFFICE_PIN.length){ setErr(true); setTimeout(()=>setPin(""),400); }
      return next;
    });
  };
  // physical / on-screen keyboard support
  useEffect(()=>{
    const onKey=(e)=>{
      if(e.key>="0" && e.key<="9"){ e.preventDefault(); press(e.key); }
      else if(e.key==="Backspace"){ e.preventDefault(); press("del"); }
      else if(e.key==="Escape"){ press("clr"); }
    };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);
  return (
    <div style={S.pinWrap}>
      <div style={S.pinTitle}>OFFICE ACCESS</div>
      <div style={S.pinSub}>Enter PIN — tap below or type on your keyboard</div>
      <div style={{...S.pinDots,...(err?{animation:"shake .35s"}:{})}}>
        {[0,1,2,3,4,5].map(i=><span key={i} style={{...S.dot,...(i<pin.length?S.dotOn:{}),...(i<OFFICE_PIN.length||i<pin.length?{}:{opacity:.25})}} />)}
      </div>
      {err && <div style={S.pinErr}>Incorrect PIN</div>}
      <div style={S.pad}>
        {["1","2","3","4","5","6","7","8","9","clr","0","del"].map(k=>
          <button key={k} className="padkey" style={S.padKey} onClick={()=>press(k)}>{k==="del"?"⌫":k==="clr"?"C":k}</button>)}
      </div>
    </div>
  );
}

// ================= FIELD =================
function FieldSide({ projects, entries, saveEntries, employees, contractors }) {
  const [sel,setSel]=useState(null);
  if(projects.length===0) return <Empty msg="No active projects yet. Ask the office to set one up." />;
  const live = sel ? projects.find(p=>p.id===sel.id) : null;
  if(!live){
    if(sel) setSel(null);
    return (
      <main style={S.main}>
        <SectionTitle>SELECT A JOB</SectionTitle>
        <div style={S.jobGrid}>
          {projects.map(p=>(
            <button key={p.id} className="jobcard" style={S.jobCard} onClick={()=>setSel(p)}>
              <div style={S.jobName}>{p.name}</div>
              <div style={S.jobMeta}>{p.workTypes.map(w=><span key={w} style={S.chip}>{w}</span>)}</div>
              <div style={S.jobAddr}>{p.address||"—"}</div>
              <div style={S.jobNum}>{p.contractor||"no contractor"}</div>
            </button>
          ))}
        </div>
      </main>
    );
  }
  return <Workspace project={live} back={()=>setSel(null)} entries={entries} saveEntries={saveEntries} employees={employees} contractors={contractors} />;
}

function Workspace({ project, back, entries, saveEntries, employees, contractors }) {
  const [trade,setTrade]=useState(project.workTypes[0]);
  const [tab,setTab]=useState("checklist");
  const projNum = (project.projectNumbers||{})[trade];
  const contractorRec = (contractors||[]).find(c=>c.name===project.contractor);
  const jobContacts = (contractorRec && contractorRec.contacts) || [];
  return (
    <main style={S.main}>
      <button className="backbtn" style={S.backBtn} onClick={back}>← All Jobs</button>
      <div style={S.wsHead}>
        <div style={S.wsName}>{project.name}</div>
        <div style={S.wsSub}>{project.contractor||"—"} · {project.address||"—"}</div>
      </div>
      {project.workTypes.length>1 &&
        <div style={S.tradeRow}>{project.workTypes.map(w=>
          <button key={w} className="trade" style={{...S.tradeBtn,...(trade===w?S.tradeOn:{})}} onClick={()=>setTrade(w)}>{w}</button>)}</div>}
      <div style={S.projNumBanner}>{trade} project #: <strong style={{color:"var(--ink)"}}>{projNum||"—"}</strong></div>
      {jobContacts.length>0 && (
        <div style={S.contactsBox}>
          <div style={S.contactsHead}>JOB CONTACTS{project.contractor?` · ${project.contractor}`:""}</div>
          {jobContacts.map(c=>(
            <div key={c.id} style={S.contactRow}>
              <span style={S.contactName}>{c.name||"—"}</span>
              {c.phone ? <a href={`tel:${c.phone.replace(/[^0-9+]/g,"")}`} style={S.contactPhone}>{c.phone}</a> : <span style={{color:"var(--sub)"}}>no #</span>}
            </div>
          ))}
        </div>
      )}
      <div style={S.tabRow}>
        <button style={{...S.tab,...(tab==="checklist"?S.tabOn:{})}} onClick={()=>setTab("checklist")}>CHECKLIST</button>
        <button style={{...S.tab,...(tab==="notes"?S.tabOn:{})}} onClick={()=>setTab("notes")}>DAILY NOTES</button>
      </div>
      {tab==="checklist"
        ? <Checklist project={project} trade={trade} entries={entries} saveEntries={saveEntries} employees={employees} />
        : <Notes project={project} trade={trade} entries={entries} saveEntries={saveEntries} employees={employees} />}
    </main>
  );
}

// ---- Checklist (whole-job, sectioned, equipment items) ----
function Checklist({ project, trade, entries, saveEntries, employees }) {
  const sections = CHECKLISTS[trade] || [];
  // checklist records for this project+trade (whole-job, no day filter)
  const recs = entries.filter(e=>e.type==="check"&&e.projectId===project.id&&e.trade===trade);
  const byItem = {}; recs.forEach(r=>byItem[r.item]=r);
  // extra equipment the techs added
  const extraEquip = entries.filter(e=>e.type==="equip"&&e.projectId===project.id&&e.trade===trade).sort((a,b)=>a.id.localeCompare(b.id));

  const [active,setActive]=useState(null); // item label being filled in
  const [addingEquip,setAddingEquip]=useState(false);

  const allItems = sections.flatMap(s=>s.items);
  const done = allItems.filter(it=>byItem[itemLabel(it)]).length;

  const saveCheck = (label, name, model, serial) => {
    const rec = { id:uid(), type:"check", projectId:project.id, trade, item:label, name:name.trim(), ts:stamp(), day:todayKey() };
    if(model!==undefined) rec.model = model.trim();
    if(serial!==undefined) rec.serial = serial.trim();
    saveEntries([rec, ...entries]); setActive(null);
  };
  const saveExtraEquip = (equipName, name, model, serial) => {
    const rec = { id:uid(), type:"equip", projectId:project.id, trade, equipName:equipName.trim(), name:name.trim(), model:model.trim(), serial:serial.trim(), ts:stamp(), day:todayKey() };
    saveEntries([rec, ...entries]); setAddingEquip(false);
  };

  return (
    <div>
      <div style={S.progress}>
        <div style={S.progressBar}><div style={{...S.progressFill,width:`${allItems.length?(done/allItems.length)*100:0}%`}} /></div>
        <span style={S.progressTxt}>{done}/{allItems.length} done</span>
      </div>

      {sections.map(sec=>(
        <div key={sec.section} style={{marginBottom:18}}>
          <div style={S.secHead}>{sec.section}</div>
          <div style={S.checkList}>
            {sec.items.map(it=>{
              const label=itemLabel(it); const rec=byItem[label]; const equip=itemIsEquip(it);
              return (
                <div key={label}>
                  <div className={rec?"":"checkrow"} style={{...S.checkRow,...(rec?S.checkRowDone:{})}} onClick={()=>{ if(!rec) setActive(active===label?null:label); }}>
                    <span style={{...S.box,...(rec?S.boxOn:{})}}>{rec?"✓":""}</span>
                    <div style={{flex:1}}>
                      <div style={{...S.checkTxt}}>{label}{equip&&!rec&&<span style={S.equipTag}>model / serial</span>}</div>
                      {rec && <div style={S.checkStamp}>✓ {rec.name} · {rec.ts}</div>}
                      {rec && rec.model!==undefined && (rec.model||rec.serial) && (
                        <div style={S.equipVals}>Model: {rec.model||"—"} · Serial: {rec.serial||"—"}</div>
                      )}
                    </div>
                  </div>
                  {active===label && !rec && (
                    <CheckForm equip={equip} employees={employees} onCancel={()=>setActive(null)} onSave={(name,model,serial)=>saveCheck(label,name,equip?model:undefined,equip?serial:undefined)} />
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ))}

      {/* Additional equipment */}
      <div style={{marginBottom:18}}>
        <div style={S.secHead}>Additional Equipment</div>
        {extraEquip.map(eq=>(
          <div key={eq.id} style={{...S.checkRow,...S.checkRowDone}}>
            <span style={{...S.box,...S.boxOn}}>✓</span>
            <div style={{flex:1}}>
              <div style={S.checkTxt}>{eq.equipName}</div>
              <div style={S.checkStamp}>✓ {eq.name} · {eq.ts}</div>
              <div style={S.equipVals}>Model: {eq.model||"—"} · Serial: {eq.serial||"—"}</div>
            </div>
          </div>
        ))}
        {!addingEquip
          ? <button className="ghost" style={S.ghostBtn} onClick={()=>setAddingEquip(true)}>+ Add equipment</button>
          : <ExtraEquipForm employees={employees} onCancel={()=>setAddingEquip(false)} onSave={saveExtraEquip} />}
      </div>

      <p style={S.hint}>This is a whole-job checklist — items stay checked for the life of the job. Once checked, an item locks and records who & when.</p>
    </div>
  );
}

// employee picker w/ "type a name" fallback
function NamePicker({ employees, value, onChange, typed, setTyped, useTyped, setUseTyped }) {
  return (
    <div>
      <label style={S.fieldLabel}>NAME <span style={{color:"var(--amber)"}}>*required</span></label>
      {!useTyped ? (
        <select style={S.input} value={value} onChange={e=>{ if(e.target.value==="__type__"){setUseTyped(true);} else onChange(e.target.value); }}>
          <option value="">— choose employee —</option>
          {employees.map(emp=><option key={emp.id} value={emp.name}>{emp.name}</option>)}
          <option value="__type__">+ type a name…</option>
        </select>
      ) : (
        <div style={{display:"flex",gap:8}}>
          <input style={S.input} placeholder="Type name" value={typed} onChange={e=>setTyped(e.target.value)} />
          {employees.length>0 && <button className="ghost" style={S.ghostBtn} onClick={()=>{setUseTyped(false);setTyped("");}}>list</button>}
        </div>
      )}
    </div>
  );
}

function CheckForm({ equip, employees, onSave, onCancel }) {
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState(employees.length===0);
  const [model,setModel]=useState(""); const [serial,setSerial]=useState("");
  const submit=()=>{ const name=useTyped?typed:sel; if(!name.trim()) return alert("Pick or type a name."); if(equip){ if(!model.trim()) return alert("Model # is required."); if(!serial.trim()) return alert("Serial # is required."); } onSave(name,model,serial); };
  return (
    <div style={S.checkForm}>

function Notes({ project, trade, entries, saveEntries, employees }) {
  const [text,setText]=useState("");
  const [sel,setSel]=useState(""); const [typed,setTyped]=useState(""); const [useTyped,setUseTyped]=useState(employees.length===0);
  const notes=entries.filter(e=>e.type==="note"&&e.projectId===project.id&&e.trade===trade).sort((a,b)=>b.id.localeCompare(a.id));
  const addNote=()=>{
    const name=useTyped?typed:sel;
    if(!name.trim())return alert("Pick or type a name.");
    if(!text.trim())return alert("Write something first.");
    saveEntries([{id:uid(),type:"note",projectId:project.id,trade,name:name.trim(),text:text.trim(),ts:stamp(),day:todayKey(),addenda:[]},...entries]);
    setText("");
  };
  const addAddendum=(noteId,an,at)=> saveEntries(entries.map(e=> e.id===noteId?{...e,addenda:[...(e.addenda||[]),{id:uid(),name:an.trim(),text:at.trim(),ts:stamp()}]}:e));
  return (
    <div>
      <div style={S.nameWrap}>
        <NamePicker employees={employees} value={sel} onChange={setSel} typed={typed} setTyped={setTyped} useTyped={useTyped} setUseTyped={setUseTyped} />
      </div>
      <textarea style={S.textarea} rows={4} placeholder={`What work did you complete today on the ${trade.toLowerCase()} scope?  (tap the mic on your keyboard to talk-to-text)`} value={text} onChange={e=>setText(e.target.value)} />
      <button className="primary" style={S.primaryBtn} onClick={addNote}>SAVE NOTE (locks on save)</button>
      <p style={S.hint}>Saved notes can't be edited or deleted. You can append an addendum — the original always stays.</p>
      <div style={S.noteFeed}>
        {notes.length===0 && <div style={S.noNotes}>No notes yet for {trade}.</div>}
        {notes.map(n=><NoteCard key={n.id} note={n} onAddendum={addAddendum} employees={employees} />)}
      </div>
    </div>
  );
}

function ProjectsAdmin({ projects, saveProjects, contractors, entries }) {
  const blank={ name:"", address:"", contractor:"", workTypes:[], projectNumbers:{} };
  const [form,setForm]=useState(blank);
  const [editingId,setEditingId]=useState(null); // null = creating
  const [showRemoved,setShowRemoved]=useState(false);
  const active=projects.filter(p=>!p.removed); const removed=projects.filter(p=>p.removed);

  const toggleType=(w)=>setForm(f=>{
    const has=f.workTypes.includes(w);
    // guard: removing a trade that has logged activity
    if(has && editingId){
      const hasActivity=(entries||[]).some(e=>e.projectId===editingId && e.trade===w && (e.type==="check"||e.type==="equip"||e.type==="note"));
      if(hasActivity && !confirm(`${w} already has checklist or note activity logged on this job. Remove it anyway? (The logged data stays in the system but the trade won't show on the job.)`)) return f;
    }
    const workTypes=has?f.workTypes.filter(x=>x!==w):[...f.workTypes,w];
    const projectNumbers={...f.projectNumbers}; if(has) delete projectNumbers[w];
    return {...f,workTypes,projectNumbers};
  });
  const setNum=(w,v)=>setForm(f=>({...f,projectNumbers:{...f.projectNumbers,[w]:v}}));

  const resetForm=()=>{ setForm(blank); setEditingId(null); };

  const startEdit=(p)=>{
    setEditingId(p.id);
    setForm({ name:p.name, address:p.address||"", contractor:p.contractor||"", workTypes:[...p.workTypes], projectNumbers:{...(p.projectNumbers||{})} });
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const validate=()=>{
    if(!form.name.trim()){ alert("Job name is required."); return null; }
    if(form.workTypes.length===0){ alert("Pick at least one type of work."); return null; }
    for(const w of form.workTypes){ if(!(form.projectNumbers[w]||"").trim()){ alert(`Enter a project number for ${w}.`); return null; } }
    const cleanNums={}; form.workTypes.forEach(w=>cleanNums[w]=form.projectNumbers[w].trim());
    return { ...form, name:form.name.trim(), projectNumbers:cleanNums };
  };

  const create=()=>{ const v=validate(); if(!v) return; saveProjects([{...v,id:uid(),removed:false,created:stamp()},...projects]); resetForm(); };
  const saveEdit=()=>{ const v=validate(); if(!v) return; saveProjects(projects.map(p=>p.id===editingId?{...p,...v}:p)); resetForm(); };

  const remove=(id)=>{ if(!confirm("Remove this project? It moves to the Removed list (data kept).")) return; saveProjects(projects.map(p=>p.id===id?{...p,removed:true}:p)); if(editingId===id) resetForm(); };
  const restore=(id)=> saveProjects(projects.map(p=>p.id===id?{...p,removed:false}:p));

  return (
    <div>
      <SectionTitle>{editingId?"EDIT JOB":"SET UP A JOB"}</SectionTitle>
      <div style={{...S.formCard, ...(editingId?{borderColor:"var(--amber)"}:{})}}>
        {editingId && <div style={S.editBanner}>Editing an existing job — changes apply everywhere.</div>}
        <Field label="JOB NAME *"><input style={S.input} value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Maple Street Townhomes" /></Field>
        <Field label="CONTRACTOR">
          <select style={S.input} value={form.contractor} onChange={e=>setForm({...form,contractor:e.target.value})}>
            <option value="">— choose —</option>
            {contractors.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
            {form.contractor && !contractors.some(c=>c.name===form.contractor) && <option value={form.contractor}>{form.contractor} (not in list)</option>}
          </select>
        </Field>
        <Field label="ADDRESS"><input style={S.input} value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="Street, City, State" /></Field>
        <Field label="TYPE OF WORK *  (each gets its own project #)">
          <div style={S.typeRow}>{WORK_TYPES.map(w=>
            <button key={w} className="trade" style={{...S.tradeBtn,...(form.workTypes.includes(w)?S.tradeOn:{})}} onClick={()=>toggleType(w)}>{form.workTypes.includes(w)?"✓ ":""}{w}</button>)}</div>
        </Field>
        {form.workTypes.length>0 && (
          <div style={S.numBox}>
            {form.workTypes.map(w=>(
              <Field key={w} label={`${w.toUpperCase()} PROJECT # *`}>
                <input style={S.input} value={form.projectNumbers[w]||""} onChange={e=>setNum(w,e.target.value)} placeholder={`e.g. 2026-${w[0]}114`} />
              </Field>
            ))}
          </div>
        )}
        {editingId ? (
          <div style={{display:"flex",gap:8}}>
            <button className="primary" style={{...S.primaryBtn,flex:1}} onClick={saveEdit}>SAVE CHANGES</button>
            <button className="ghost" style={S.ghostBtn} onClick={resetForm}>Cancel</button>
          </div>
        ) : (
          <button className="primary" style={S.primaryBtn} onClick={create}>+ CREATE JOB</button>
        )}
      </div>
      <SectionTitle>ACTIVE JOBS ({active.length})</SectionTitle>
      {active.length===0 && <div style={S.noNotes}>No active jobs.</div>}
      {active.map(p=>(
        <div key={p.id} style={{...S.adminRow, ...(editingId===p.id?{borderColor:"var(--amber)"}:{})}}>
          <div style={{flex:1}}>
            <div style={S.adminName}>{p.name}</div>
            <div style={S.adminMeta}>{p.contractor||"—"}</div>
            <div style={S.adminAddr}>{p.address||"—"}</div>
            <div style={S.numList}>{p.workTypes.map(w=><span key={w} style={S.numChip}>{w}: <strong style={{color:"var(--ink)"}}>{(p.projectNumbers||{})[w]||"n/a"}</strong></span>)}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            <button className="ghost" style={S.editBtn} onClick={()=>startEdit(p)}>EDIT</button>
            <button className="danger" style={S.dangerBtn} onClick={()=>remove(p.id)}>REMOVE</button>
          </div>
        </div>
      ))}
      {removed.length>0 && (<>
        <button className="ghost" style={{...S.ghostBtn,marginTop:18}} onClick={()=>setShowRemoved(!showRemoved)}>{showRemoved?"Hide":"Show"} removed jobs ({removed.length})</button>
        {showRemoved && removed.map(p=>(
          <div key={p.id} style={{...S.adminRow,opacity:.6}}>
            <div style={{flex:1}}><div style={S.adminName}>{p.name}</div><div style={S.adminMeta}>removed</div></div>
            <button className="ghost" style={S.ghostBtn} onClick={()=>restore(p.id)}>RESTORE</button>
          </div>
        ))}
      </>)}
    </div>
  );
}

              <input style={{...S.input,flex:2}} placeholder="Phone" value={c.phone} onChange={e=>setContact(c.id,"phone",e.target.value)} />
              <button className="danger" style={{...S.dangerBtn,padding:"8px 12px"}} onClick={()=>delContact(c.id)}>✕</button>
            </div>
          ))}
          <button className="ghost" style={S.ghostBtn} onClick={addContact}>+ Add contact</button>
        </Field>
        {editingId ? (
          <div style={{display:"flex",gap:8}}>
            <button className="primary" style={{...S.primaryBtn,flex:1}} onClick={saveEdit}>SAVE CHANGES</button>
            <button className="ghost" style={S.ghostBtn} onClick={resetForm}>Cancel</button>

          <button className="primary" style={S.primaryBtn} onClick={create}>+ SAVE CONTRACTOR</button>

      <SectionTitle>SAVED CONTRACTORS ({contractors.length})</SectionTitle>
      {contractors.length===0 && <div style={S.noNotes}>No contractors saved yet.</div>}

        <div key={c.id} style={{...S.adminRow, ...(editingId===c.id?{borderColor:"var(--amber)"}:{})}}>

            <div style={S.adminName}>{c.name}</div>
            {(c.contacts||[]).length>0
              ? c.contacts.map(ct=><div key={ct.id} style={S.adminMeta}>{ct.name||"—"}{ct.phone?` · ${ct.phone}`:""}</div>)

function Reports({ projects, entries }) {
  const [mode,setMode]=useState("single"); // single | range
  const [day,setDay]=useState(todayKey());
  const [from,setFrom]=useState(todayKey());
  const [to,setTo]=useState(todayKey());

  const inRange=(d)=>{
    if(mode==="single") return d===day;
    const lo=from<=to?from:to, hi=from<=to?to:from;
    return d>=lo && d<=hi;
  };
  const rangeLabel = mode==="single" ? day : `${from<=to?from:to} → ${from<=to?to:from}`;

  const selEntries=entries.filter(e=>inRange(e.day));
  const notes=selEntries.filter(e=>e.type==="note").sort((a,b)=>a.id.localeCompare(b.id));
  const checks=selEntries.filter(e=>e.type==="check"||e.type==="equip").sort((a,b)=>a.id.localeCompare(b.id));
  const pName=(id)=>(projects.find(p=>p.id===id)||{}).name||"Unknown job";
  const pNum=(id,trade)=>((projects.find(p=>p.id===id)||{}).projectNumbers||{})[trade]||"n/a";
  const groups={}; checks.forEach(c=>{ const k=c.projectId+"|"+c.trade; (groups[k]=groups[k]||[]).push(c); });

  return (
    <div>
      <SectionTitle>DAILY ACTIVITY REPORT</SectionTitle>
      <div style={S.formCard}>
        <div style={{...S.tradeRow,marginBottom:14}}>
          <button className="trade" style={{...S.tradeBtn,...(mode==="single"?S.tradeOn:{})}} onClick={()=>setMode("single")}>Single day</button>
          <button className="trade" style={{...S.tradeBtn,...(mode==="range"?S.tradeOn:{})}} onClick={()=>setMode("range")}>Date range</button>
        </div>
        {mode==="single" ? (
          <Field label="DATE"><input type="date" style={S.input} value={day} onChange={e=>setDay(e.target.value)} /></Field>
        ) : (
          <div style={S.formRow}>
            <Field label="FROM"><input type="date" style={S.input} value={from} onChange={e=>setFrom(e.target.value)} /></Field>
            <Field label="TO"><input type="date" style={S.input} value={to} onChange={e=>setTo(e.target.value)} /></Field>
          </div>
        )}
        <div style={S.reportStats}>
          <Stat n={notes.length} label="Notes logged" />
          <Stat n={checks.length} label="Items checked" />
          <Stat n={new Set(selEntries.map(e=>e.name)).size} label="Crew active" />
        </div>
        <button className="primary" style={S.primaryBtn} onClick={()=>window.print()}>🖨 PRINT / SAVE AS PDF</button>
        <p style={S.hint}>Opens your device's print dialog — choose a printer, or "Save as PDF."</p>
      </div>

      {/* On-screen report */}
      <SectionTitle>NOTES — {rangeLabel}</SectionTitle>
      {notes.length===0 && <div style={S.noNotes}>No notes in this range.</div>}
      {notes.map(n=>(
        <div key={n.id} style={S.noteCard}>
          <div style={S.noteHead}><span style={S.noteAuthor}>{n.name}</span><span style={S.noteTs}>{n.ts}</span></div>
          <div style={S.repProj}>{pName(n.projectId)} · {n.trade} #{pNum(n.projectId,n.trade)}</div>
          <div style={S.noteBody}>{n.text}</div>
          {(n.addenda||[]).map(a=><div key={a.id} style={S.addendum}><div style={S.addHead}>↳ ADDENDUM · {a.name} · {a.ts}</div><div style={S.addBody}>{a.text}</div></div>)}
        </div>
      ))}
      <SectionTitle>CHECKLIST ACTIVITY — {rangeLabel}</SectionTitle>
      {Object.keys(groups).length===0 && <div style={S.noNotes}>No checklist activity in this range.</div>}
      {Object.entries(groups).map(([k,list])=>{ const [pid,trade]=k.split("|"); return (
        <div key={k} style={S.noteCard}>
          <div style={S.repProj}>{pName(pid)} · {trade} #{pNum(pid,trade)}</div>
          {list.map(c=>(
            <div key={c.id} style={S.repCheck}>
              ✓ {c.type==="equip"?c.equipName:c.item} <span style={S.noteTs}>— {c.name}, {c.ts}</span>
              {(c.model||c.serial) && <div style={S.equipVals}>Model: {c.model||"—"} · Serial: {c.serial||"—"}</div>}
            </div>
          ))}
        </div>
      );})}

      {/* Print-only clean layout */}
      <div className="print-area" aria-hidden="true">
        <div className="print-header">
          <div className="print-company">{COMPANY_NAME}</div>
          <div className="print-title">Daily Activity Report</div>
          <div className="print-dates">{rangeLabel}</div>
        </div>

        <div className="print-summary">
          Notes: {notes.length} &nbsp;·&nbsp; Items checked: {checks.length} &nbsp;·&nbsp; Crew active: {new Set(selEntries.map(e=>e.name)).size}
        </div>

        <h2 className="print-section">Notes</h2>
        {notes.length===0 && <div className="print-empty">No notes in this range.</div>}
        {notes.map(n=>(
          <div key={n.id} className="print-block">
            <div className="print-block-head">{pName(n.projectId)} — {n.trade} #{pNum(n.projectId,n.trade)}</div>
            <div className="print-meta">{n.name} · {n.ts}</div>
            <div className="print-body">{n.text}</div>
            {(n.addenda||[]).map(a=>(
              <div key={a.id} className="print-addendum">↳ Addendum · {a.name} · {a.ts}<br/>{a.text}</div>
            ))}
          </div>
        ))}

        <h2 className="print-section">Checklist Activity</h2>
        {Object.keys(groups).length===0 && <div className="print-empty">No checklist activity in this range.</div>}
        {Object.entries(groups).map(([k,list])=>{ const [pid,trade]=k.split("|"); return (
          <div key={k} className="print-block">
            <div className="print-block-head">{pName(pid)} — {trade} #{pNum(pid,trade)}</div>
            {list.map(c=>(
              <div key={c.id} className="print-check">
                ✓ {c.type==="equip"?c.equipName:c.item} — {c.name}, {c.ts}
                {(c.model||c.serial) && <div className="print-equip">Model: {c.model||"—"} · Serial: {c.serial||"—"}</div>}
              </div>
            ))}
          </div>
        );})}
      </div>
    </div>
  );
}

function Stat({ n, label }) { return <div style={S.stat}><div style={S.statN}>{n}</div><div style={S.statL}>{label}</div></div>; }
function SectionTitle({ children }) { return <h2 style={S.sectionTitle}>{children}</h2>; }
function Field({ label, children }) { return <div style={{marginBottom:14,flex:1}}><label style={S.fieldLabel}>{label}</label>{children}</div>; }
function Empty({ msg }) { return <main style={S.main}><div style={S.noNotes}>{msg}</div></main>; }
