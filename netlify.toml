[build]
  publish = "public"
  functions = "netlify/functions"

# Let the function own /api/data — never fall through to the SPA
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# Single-page app: serve index.html for any route not matched
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
